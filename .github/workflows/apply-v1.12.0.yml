name: Apply Umnik v1.12.0

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          ref: feature/chat-profiles-orchestrator-v1.12.0
          fetch-depth: 0

      - name: Patch one-shot updater
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/update_v1_12_0.py')
          s = p.read_text()
          old = '''s = one(s, ''' + "'''        chatsRepository.save(listOf(chat))\n'''" + ''', ''' + "'''        val resetChats = listOf(chat) + protectedOrchestrators\n        chatsRepository.save(resetChats)\n'''" + ''', "clear save orchestrators")'''
          new = '''s = s.replace(''' + "'''        chatsRepository.save(listOf(chat))\n'''" + ''', ''' + "'''        val resetChats = listOf(chat) + protectedOrchestrators\n        chatsRepository.save(resetChats)\n'''" + ''', 1)'''
          if old not in s:
              raise SystemExit('clear save hotfix target not found')
          s = s.replace(old, new, 1)
          old2 = '''s = one(s, ''' + "'''            chats = listOf(chat),\n            currentChatId = chat.id,\n'''" + ''', ''' + "'''            chats = resetChats,\n            currentChatId = chat.id,\n'''" + ''', "clear state orchestrators")'''
          new2 = '''s = s.replace(''' + "'''            chats = listOf(chat),\n            currentChatId = chat.id,\n'''" + ''', ''' + "'''            chats = resetChats,\n            currentChatId = chat.id,\n'''" + ''', 1)'''
          if old2 in s:
              s = s.replace(old2, new2, 1)
          p.write_text(s)
          PY

      - name: Apply update
        run: python .github/scripts/update_v1_12_0.py

      - name: Validate patch
        run: git diff --check

      - name: Commit and push feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No source changes to commit"
          else
            git commit -m "Umnik 1.12.0: fixed project chat profiles and orchestrator"
            git push origin HEAD:feature/chat-profiles-orchestrator-v1.12.0
          fi

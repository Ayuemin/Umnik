name: Apply Umnik v1.12.0

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          ref: feature/chat-profiles-orchestrator-v1.12.0
          fetch-depth: 0

      - name: Apply update
        run: python .github/scripts/update_v1_12_0.py

      - name: Validate patch
        run: git diff --check

      - name: Commit and push feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No source changes to commit"
          else
            git commit -m "Umnik 1.12.0: fixed project chat profiles and orchestrator"
            git push origin HEAD:feature/chat-profiles-orchestrator-v1.12.0
          fi

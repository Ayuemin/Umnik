name: Apply projects migration

on:
  push:
    branches: [ "main" ]
    paths:
      - "scripts/add_projects.py"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply project feature patch
        run: python3 scripts/add_projects.py

      - name: Commit generated source changes
        run: |
          git checkout -- .github/workflows/android-release.yml || true
          if git diff --quiet -- app; then
            echo "No app changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app
          git commit -m "Add projects and favorites"
          git push

name: Local Shell Limit Text Patch

on:
  push:
    branches:
      - "work/local-shell-mvp"

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, '[apply-shell-limit-text]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: work/local-shell-mvp
          fetch-depth: 0

      - name: Apply UI copy patch
        run: python .github/scripts/local_shell_limit_text_patch.py

      - name: Validate diff
        run: |
          git diff --check
          git diff -- app/src/main/java/com/ayuemin/ymnik/ui/OpenRouterHub.kt

      - name: Commit product change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/ayuemin/ymnik/ui/OpenRouterHub.kt
          git commit -m "Refresh Local Shell limit guidance"
          git push origin HEAD:work/local-shell-mvp

name: Cancel old v1.15.0 release

on:
  push:
    branches: [ "main" ]
    paths: [ ".github/workflows/cancel-old-v1.15-release.yml" ]

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel old release run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/35002654524/cancel" || true

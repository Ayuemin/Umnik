name: Apply context usage instrumentation v2

on:
  push:
    branches:
      - work/local-shell-mvp
    paths:
      - .github/workflows/context-usage-patch-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/local-shell-mvp
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Apply source changes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'anchor not found in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          models = 'app/src/main/java/com/ayuemin/ymnik/model/Models.kt'
          context_models = '''data class ContextLayerUsage(
              val chars: Int = 0,
              val bytes: Int = 0,
              val estimatedTokens: Int = 0
          )

          data class ContextUsageBreakdown(
              val systemPrompt: ContextLayerUsage = ContextLayerUsage(),
              val tools: ContextLayerUsage = ContextLayerUsage(),
              val history: ContextLayerUsage = ContextLayerUsage(),
              val memoryRag: ContextLayerUsage = ContextLayerUsage(),
              val skills: ContextLayerUsage = ContextLayerUsage(),
              val currentUserPrompt: ContextLayerUsage = ContextLayerUsage(),
              val attachmentCount: Int = 0,
              val attachmentBytes: Long = 0L,
              val capturedAt: Long = System.currentTimeMillis()
          )

          '''
          replace_once(models, 'data class ChatMessage(\n', context_models + 'data class ChatMessage(\n')
          replace_once(
              models,
              '    val requestId: String? = null,\n    val costBreakdown: RequestCostBreakdown? = null\n)',
              '    val requestId: String? = null,\n    val costBreakdown: RequestCostBreakdown? = null,\n    val contextUsage: ContextUsageBreakdown? = null\n)'
          )

          tracker = Path('app/src/main/java/com/ayuemin/ymnik/network/ContextUsageTracker.kt')
          tracker.write_text(r'''package com.ayuemin.ymnik.network

          import com.ayuemin.ymnik.model.ContextLayerUsage
          import com.ayuemin.ymnik.model.ContextUsageBreakdown
          import com.google.gson.JsonObject
          import java.util.LinkedHashMap

          /**
           * Snapshot of the context that actually reaches /chat/completions.
           * Exact provider input tokens live in ChatMessage.inputTokens; token counts here are estimates.
           * The latest call wins so Agent/tool loops match the provider usage stored for the final answer.
           */
          internal object ContextUsageTracker {
              private const val MAX_ENTRIES = 128
              private const val TTL_MS = 30L * 60L * 1000L
              private const val SKILL_START = "===== НАЧАЛО ПОДКЛЮЧЁННЫХ НАВЫКОВ ====="
              private const val SKILL_END = "===== КОНЕЦ ПОДКЛЮЧЁННЫХ НАВЫКОВ ====="
              private const val MEMORY_START = "===== ДОЛГОВРЕМЕННАЯ ПАМЯТЬ ЭТОГО ЧАТА ====="
              private const val MEMORY_END = "===== КОНЕЦ ДОЛГОВРЕМЕННОЙ ПАМЯТИ ====="

              private data class Entry(val capturedAt: Long, val usage: ContextUsageBreakdown)
              private data class AttachmentStats(val count: Int, val bytes: Long)
              private val entries = LinkedHashMap<String, Entry>()

              @Synchronized
              fun capture(requestId: String?, payload: JsonObject): ContextUsageBreakdown? {
                  val key = requestId?.trim()?.takeIf { it.isNotBlank() } ?: return null
                  val usage = measurePayload(payload)
                  val now = System.currentTimeMillis()
                  prune(now)
                  entries[key] = Entry(now, usage)
                  while (entries.size > MAX_ENTRIES) {
                      entries.entries.firstOrNull()?.key?.let(entries::remove) ?: break
                  }
                  return usage
              }

              @Synchronized
              fun consume(requestId: String): ContextUsageBreakdown? {
                  val now = System.currentTimeMillis()
                  prune(now)
                  return entries.remove(requestId)?.usage
              }

              @Synchronized
              private fun prune(now: Long) {
                  val stale = entries.filterValues { now - it.capturedAt > TTL_MS }.keys.toList()
                  stale.forEach(entries::remove)
              }

              internal fun measurePayload(payload: JsonObject): ContextUsageBreakdown {
                  val messages = payload.get("messages")
                      ?.takeIf { it.isJsonArray }
                      ?.asJsonArray
                      ?.mapNotNull { it.takeIf { value -> value.isJsonObject }?.asJsonObject }
                      .orEmpty()

                  val currentUserIndex = messages.indexOfLast { it.string("role") == "user" }
                  val systemText = messages
                      .filter { it.string("role") == "system" }
                      .joinToString("\n") { messageText(it) }
                  val (withoutSkills, skillText) = peelMarkedBlock(systemText, SKILL_START, SKILL_END)
                  val (baseSystemText, memorySystemText) = peelMarkedBlock(withoutSkills, MEMORY_START, MEMORY_END)

                  val toolNamesById = mutableMapOf<String, String>()
                  val historyParts = mutableListOf<String>()
                  val ragParts = mutableListOf<String>()
                  if (memorySystemText.isNotBlank()) ragParts += memorySystemText

                  messages.forEachIndexed { index, message ->
                      val role = message.string("role").orEmpty()
                      if (role == "assistant") {
                          message.get("tool_calls")
                              ?.takeIf { it.isJsonArray }
                              ?.asJsonArray
                              ?.forEach { element ->
                                  val call = element.takeIf { it.isJsonObject }?.asJsonObject ?: return@forEach
                                  val id = call.string("id") ?: return@forEach
                                  val name = call.getAsJsonObject("function")?.string("name") ?: return@forEach
                                  toolNamesById[id] = name
                              }
                      }
                      if (role == "system" || index == currentUserIndex) return@forEachIndexed
                      if (role == "tool") {
                          val toolCallId = message.string("tool_call_id")
                          if (toolCallId != null && toolNamesById[toolCallId] == "knowledge_search") {
                              ragParts += message.toString()
                              return@forEachIndexed
                          }
                      }
                      historyParts += message.toString()
                  }

                  val currentUser = messages.getOrNull(currentUserIndex)
                  val currentPrompt = currentUser?.let(::messageText).orEmpty()
                  val attachments = currentUser?.let(::attachmentStats) ?: AttachmentStats(0, 0L)
                  val toolsJson = payload.get("tools")
                      ?.takeIf { it.isJsonArray }
                      ?.asJsonArray
                      ?.toString()
                      .orEmpty()

                  return ContextUsageBreakdown(
                      systemPrompt = layer(baseSystemText),
                      tools = layer(toolsJson),
                      history = layer(historyParts.joinToString("\n")),
                      memoryRag = layer(ragParts.joinToString("\n")),
                      skills = layer(skillText),
                      currentUserPrompt = layer(currentPrompt),
                      attachmentCount = attachments.count,
                      attachmentBytes = attachments.bytes
                  )
              }

              private fun layer(text: String): ContextLayerUsage = ContextSizeEstimator.measure(text).let {
                  ContextLayerUsage(chars = it.chars, bytes = it.utf8Bytes, estimatedTokens = it.estimatedTokens)
              }

              private fun peelMarkedBlock(source: String, startMarker: String, endMarker: String): Pair<String, String> {
                  val start = source.indexOf(startMarker)
                  if (start < 0) return source to ""
                  val markerEnd = source.indexOf(endMarker, start + startMarker.length)
                  if (markerEnd < 0) return source to ""
                  var from = start
                  var to = markerEnd + endMarker.length
                  if (from > 0 && source[from - 1] == '\n') from -= 1
                  if (to < source.length && source[to] == '\n') to += 1
                  val block = source.substring(from, to)
                  val remainder = source.removeRange(from, to).trim()
                  return remainder to block
              }

              private fun messageText(message: JsonObject): String {
                  val content = message.get("content") ?: return ""
                  if (content.isJsonPrimitive) return content.asString
                  if (!content.isJsonArray) return content.toString()
                  return content.asJsonArray.mapNotNull { part ->
                      val obj = part.takeIf { it.isJsonObject }?.asJsonObject ?: return@mapNotNull null
                      if (obj.string("type") == "text") obj.string("text") else null
                  }.joinToString("\n")
              }

              private fun attachmentStats(message: JsonObject): AttachmentStats {
                  val content = message.get("content")?.takeIf { it.isJsonArray }?.asJsonArray
                      ?: return AttachmentStats(0, 0L)
                  var count = 0
                  var bytes = 0L
                  content.forEach { element ->
                      val part = element.takeIf { it.isJsonObject }?.asJsonObject ?: return@forEach
                      when (part.string("type")) {
                          "file" -> {
                              count += 1
                              bytes += part.getAsJsonObject("file")?.string("file_data")?.let(::dataUrlBytes) ?: 0L
                          }
                          "image_url", "video_url" -> {
                              count += 1
                              val key = if (part.string("type") == "image_url") "image_url" else "video_url"
                              bytes += part.getAsJsonObject(key)?.string("url")?.let(::dataUrlBytes) ?: 0L
                          }
                          "input_audio" -> {
                              count += 1
                              bytes += part.getAsJsonObject("input_audio")?.string("data")
                                  ?.let { base64DecodedBytes(it, 0) } ?: 0L
                          }
                      }
                  }
                  return AttachmentStats(count, bytes)
              }

              private fun dataUrlBytes(value: String): Long {
                  if (!value.startsWith("data:")) return 0L
                  val comma = value.indexOf(',')
                  if (comma < 0 || comma == value.lastIndex) return 0L
                  return base64DecodedBytes(value, comma + 1)
              }

              private fun base64DecodedBytes(value: String, start: Int): Long {
                  var meaningful = 0L
                  var padding = 0L
                  for (index in start until value.length) {
                      val c = value[index]
                      if (c.isWhitespace()) continue
                      meaningful += 1
                      if (c == '=') padding += 1
                  }
                  if (meaningful == 0L) return 0L
                  val groups = meaningful / 4L
                  val remainder = meaningful % 4L
                  val decoded = groups * 3L + when (remainder.toInt()) {
                      2 -> 1L
                      3 -> 2L
                      else -> 0L
                  } - padding
                  return decoded.coerceAtLeast(0L)
              }

              private fun JsonObject.string(name: String): String? = runCatching {
                  get(name)?.takeIf { !it.isJsonNull && it.isJsonPrimitive }?.asString
              }.getOrNull()
          }
          '''.replace('\n          ', '\n'), encoding='utf-8')

          enhancer = 'app/src/main/java/com/ayuemin/ymnik/network/OpenRouterRequestEnhancer.kt'
          replace_once(
              enhancer,
              '        // Small one-off attachments are sent directly. Large or reusable documents\n',
              '''        ContextUsageTracker.capture(requestId, payload)?.let { usage ->
                      com.ayuemin.ymnik.diagnostics.DiagnosticLog.record(
                          context,
                          "CONTEXT_USAGE",
                          "request=" + requestId.orEmpty().take(8) +
                              "; system=" + usage.systemPrompt.chars + "ch/" + usage.systemPrompt.bytes + "B" +
                              "; tools=" + usage.tools.bytes + "B" +
                              "; history=" + usage.history.chars + "ch/" + usage.history.bytes + "B" +
                              "; memoryRag=" + usage.memoryRag.chars + "ch/" + usage.memoryRag.bytes + "B" +
                              "; skills=" + usage.skills.chars + "ch/" + usage.skills.bytes + "B" +
                              "; user=" + usage.currentUserPrompt.chars + "ch/" + usage.currentUserPrompt.bytes + "B" +
                              "; attachments=" + usage.attachmentCount + "/" + usage.attachmentBytes + "B"
                      )
                  }

                  // Small one-off attachments are sent directly. Large or reusable documents
          '''.replace('\n          ', '\n')
          )

          repo = Path('app/src/main/java/com/ayuemin/ymnik/data/ChatRepository.kt')
          repo_text = repo.read_text(encoding='utf-8')
          if 'import com.ayuemin.ymnik.network.ContextUsageTracker' not in repo_text:
              repo_text = repo_text.replace(
                  'import com.ayuemin.ymnik.model.ChatMessage\n',
                  'import com.ayuemin.ymnik.model.ChatMessage\nimport com.ayuemin.ymnik.network.ContextUsageTracker\n',
                  1
              )
          pattern = re.compile(
              r'\s*val messages = chat\.messages\.toMutableList\(\)\n'
              r'\s*messages\[userIndex\] = messages\[userIndex\]\.copy\(deliveryState = if \(assistant == null\) "failed" else null\)\n'
              r'\s*if \(assistant != null\) messages\.add\(userIndex \+ 1, assistant\)'
          )
          replacement = '''
                      val completedAssistant = assistant?.let { raw ->
                          if (raw.contextUsage != null) {
                              raw
                          } else {
                              raw.requestId
                                  ?.let(ContextUsageTracker::consume)
                                  ?.let { usage -> raw.copy(contextUsage = usage) }
                                  ?: raw
                          }
                      }
                      val messages = chat.messages.toMutableList()
                      messages[userIndex] = messages[userIndex].copy(deliveryState = if (completedAssistant == null) "failed" else null)
                      if (completedAssistant != null) messages.add(userIndex + 1, completedAssistant)'''.replace('\n          ', '\n')
          repo_text, count = pattern.subn(replacement, repo_text, count=1)
          if count != 1:
              raise SystemExit('ChatRepository finishRequest anchor not found')
          repo.write_text(repo_text, encoding='utf-8')

          ui = 'app/src/main/java/com/ayuemin/ymnik/ui/YmnikApp.kt'
          replace_once(
              ui,
              'import com.ayuemin.ymnik.model.ChatMessage\n',
              'import com.ayuemin.ymnik.model.ChatMessage\nimport com.ayuemin.ymnik.model.ContextLayerUsage\nimport com.ayuemin.ymnik.model.ContextUsageBreakdown\n'
          )
          replace_once(
              ui,
              '            message.costBreakdown != null ||\n            message.responseDurationMs != null ||',
              '            message.costBreakdown != null ||\n            message.contextUsage != null ||\n            message.responseDurationMs != null ||'
          )
          replace_once(
              ui,
              '                message.activeSkillCount != null ||\n                message.teamContextUsed != null ||',
              '                message.activeSkillCount != null ||\n                message.contextUsage != null ||\n                message.teamContextUsed != null ||'
          )
          replace_once(
              ui,
              '                AnswerInfoSectionTitle("Контекст")\n',
              '                AnswerInfoSectionTitle("Контекст")\n                message.contextUsage?.let { ContextUsageBreakdownRows(it) }\n'
          )
          helper = r'''@Composable
          private fun ContextUsageBreakdownRows(usage: ContextUsageBreakdown) {
              AnswerInfoRow("Системный prompt", formatContextLayer(usage.systemPrompt))
              AnswerInfoRow("Схемы tools", formatContextLayer(usage.tools))
              AnswerInfoRow("История", formatContextLayer(usage.history))
              AnswerInfoRow("Память / RAG", formatContextLayer(usage.memoryRag))
              AnswerInfoRow("Навыки", formatContextLayer(usage.skills))
              AnswerInfoRow("Текущий запрос", formatContextLayer(usage.currentUserPrompt))
              if (usage.attachmentCount > 0 || usage.attachmentBytes > 0L) {
                  AnswerInfoRow("Вложения", "${usage.attachmentCount} шт. · ${usage.attachmentBytes} Б")
              }
              Text(
                  "Символы и байты точные; ≈ токены — локальная оценка.",
                  style = MaterialTheme.typography.bodySmall,
                  color = MaterialTheme.colorScheme.onSurfaceVariant
              )
          }

          private fun formatContextLayer(layer: ContextLayerUsage): String =
              "${layer.chars} зн. · ${layer.bytes} Б · ≈ ${layer.estimatedTokens} ток."

          '''.replace('\n          ', '\n')
          replace_once(ui, '@Composable\nprivate fun AnswerInfoSectionTitle(title: String) {', helper + '@Composable\nprivate fun AnswerInfoSectionTitle(title: String) {')

          test = Path('app/src/test/java/com/ayuemin/ymnik/network/ContextUsageTrackerTest.kt')
          test.parent.mkdir(parents=True, exist_ok=True)
          test.write_text(r'''package com.ayuemin.ymnik.network

          import com.google.gson.JsonArray
          import com.google.gson.JsonObject
          import org.junit.Assert.assertEquals
          import org.junit.Assert.assertTrue
          import org.junit.Test

          class ContextUsageTrackerTest {
              @Test
              fun measurePayloadSeparatesContextLayersAndAttachments() {
                  val skillBlock = "===== НАЧАЛО ПОДКЛЮЧЁННЫХ НАВЫКОВ =====\nskill rule\n===== КОНЕЦ ПОДКЛЮЧЁННЫХ НАВЫКОВ ====="
                  val memoryBlock = "===== ДОЛГОВРЕМЕННАЯ ПАМЯТЬ ЭТОГО ЧАТА =====\nold fact\n===== КОНЕЦ ДОЛГОВРЕМЕННОЙ ПАМЯТИ ====="
                  val payload = JsonObject().apply {
                      add("messages", JsonArray().apply {
                          add(message("system", "base rule\n$skillBlock\n$memoryBlock"))
                          add(message("user", "older question"))
                          add(message("assistant", "older answer"))
                          add(JsonObject().apply {
                              addProperty("role", "user")
                              add("content", JsonArray().apply {
                                  add(JsonObject().apply {
                                      addProperty("type", "text")
                                      addProperty("text", "current question")
                                  })
                                  add(JsonObject().apply {
                                      addProperty("type", "image_url")
                                      add("image_url", JsonObject().apply {
                                          addProperty("url", "data:image/png;base64,AQIDBA==")
                                      })
                                  })
                              })
                          })
                      })
                      add("tools", JsonArray().apply {
                          add(JsonObject().apply { addProperty("type", "function") })
                      })
                  }
                  val usage = ContextUsageTracker.measurePayload(payload)
                  assertTrue(usage.systemPrompt.chars > 0)
                  assertTrue(usage.skills.chars > 0)
                  assertTrue(usage.memoryRag.chars > 0)
                  assertTrue(usage.history.chars > 0)
                  assertTrue(usage.tools.bytes > 0)
                  assertEquals("current question".length, usage.currentUserPrompt.chars)
                  assertEquals(1, usage.attachmentCount)
                  assertEquals(4L, usage.attachmentBytes)
              }

              private fun message(role: String, text: String) = JsonObject().apply {
                  addProperty("role", role)
                  addProperty("content", text)
              }
          }
          '''.replace('\n          ', '\n'), encoding='utf-8')
          PY

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Commit source changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/context-usage-patch.yml .github/workflows/context-usage-patch-v2.yml
          git add app/src/main/java app/src/test/java
          git commit -m "Add persisted context usage breakdown"
          git push origin HEAD:work/local-shell-mvp

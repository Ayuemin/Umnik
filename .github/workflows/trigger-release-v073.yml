name: Trigger Umnik v0.7.3 release

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/trigger-release-v073.yml"

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create release tag on prepared commit
        shell: bash
        run: |
          set -euo pipefail
          TARGET="$(git rev-parse HEAD^)"
          VERSION="$(git show "$TARGET:app/build.gradle.kts" | sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' | head -n1)"
          if [ "$VERSION" != "0.7.3" ]; then
            echo "Prepared commit has version $VERSION, expected 0.7.3"
            exit 1
          fi
          if git rev-parse "refs/tags/v0.7.3" >/dev/null 2>&1; then
            echo "Tag v0.7.3 already exists"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a v0.7.3 "$TARGET" -m "Umnik v0.7.3"
          git push origin v0.7.3

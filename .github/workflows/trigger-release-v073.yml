name: Trigger Umnik v0.7.3 release

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/trigger-release-v073.yml"

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch signed release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run android-release.yml --repo "$GITHUB_REPOSITORY" -f tag=v0.7.3

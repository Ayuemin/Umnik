name: Apply and verify Umnik v1.19.0

on:
  push:
    branches:
      - work/android-only-v1.19.0
    paths:
      - .github/workflows/apply-v119.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout work branch
        uses: actions/checkout@v4
        with:
          ref: work/android-only-v1.19.0
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Reconstruct and verify patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .github/patch-transfer-v119-final/patch.xz.b64 | xz -d > /tmp/umnik-v1.19.patch
          echo "7b8465dd45ee384fb9db21e19525462edfec8562972a28ea68b95eab6cc4b502  /tmp/umnik-v1.19.patch" | sha256sum -c -
          git apply --check /tmp/umnik-v1.19.patch
          git apply /tmp/umnik-v1.19.patch
          git diff --check

      - name: Unit tests, Android Lint and debug APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug

      - name: Upload verified debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Umnik-v1.19.0-debug-verified
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Commit verified v1.19.0 work
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/patch-transfer-v119 .github/patch-transfer-v119-final
          rm -f .github/workflows/apply-v119.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Prepare Umnik v1.19.0 Android-only release"
          git push origin HEAD:work/android-only-v1.19.0

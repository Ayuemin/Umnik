name: One-off settings cleanup

on:
  push:
    branches:
      - work/modernize-sdk37
    paths:
      - tools/cleanup-settings-refactor.py

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/modernize-sdk37
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python tools/cleanup-settings-refactor.py
      - name: Commit cleanup
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/ayuemin/ymnik/ui/SettingsScreen.kt
          git commit -m "Clean extracted settings references"
          git push origin HEAD:work/modernize-sdk37

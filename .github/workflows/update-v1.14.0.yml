name: Apply Umnik v1.14.0 knowledge base RAG

on:
  push:
    branches: [ "feature/knowledge-base-rag-v1.14.0" ]

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          ref: feature/knowledge-base-rag-v1.14.0
          fetch-depth: 0

      - name: Repair updater targeting
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/update_v1_14_0.py')
          text = path.read_text(encoding='utf-8')
          old = "project_ui = replace_once(project_ui, profile_anchor, profile_replacement, 'ordinary chat knowledge section')"
          new = """profile_start = project_ui.index('private fun ChatProfileDialog(')\nprofile_end = project_ui.index('\\n}\\n\\n@Composable\\nfun ProjectsDialog', profile_start)\nprofile_segment = project_ui[profile_start:profile_end]\nprofile_segment = replace_once(profile_segment, profile_anchor, profile_replacement, 'ordinary chat knowledge section')\nproject_ui = project_ui[:profile_start] + profile_segment + project_ui[profile_end:]"""
          if old not in text:
              raise SystemExit('Updater repair anchor not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Apply source update
        run: python3 .github/scripts/update_v1_14_0.py

      - name: Check whitespace
        run: git diff --check

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Unit tests and debug APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Remove temporary updater
        run: rm -f .github/scripts/update_v1_14_0.py .github/workflows/update-v1.14.0.yml

      - name: Commit v1.14.0 implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Umnik 1.14.0: local RAG knowledge bases"
          git push origin HEAD:feature/knowledge-base-rag-v1.14.0

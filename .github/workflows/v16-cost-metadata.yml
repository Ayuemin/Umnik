name: Add v1.6 response metadata

on:
  push:
    branches:
      - "feature/openrouter-full-v1.6.0"

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[v16-cost]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/openrouter-full-v1.6.0
          fetch-depth: 0

      - name: Persist and display OpenRouter usage metadata
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Patch point not found: {label} in {path}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'app/src/main/java/com/ayuemin/ymnik/model/Models.kt',
              '''    // Null means an existing/completed message; older stored chats need no migration.\n    val deliveryState: String? = null\n)\n''',
              '''    // Null means an existing/completed message; older stored chats need no migration.\n    val deliveryState: String? = null,\n    val modelId: String? = null,\n    val providerName: String? = null,\n    val costUsd: Double? = null,\n    val inputTokens: Int? = null,\n    val outputTokens: Int? = null\n)\n''',
              'chat message metadata'
          )

          replace_once(
              'app/src/main/java/com/ayuemin/ymnik/network/OpenRouterResponseParser.kt',
              '''        val provider: String,\n        val finishReason: String,\n        val nativeFinishReason: String,\n        val completionTokens: Int?,\n        val reasoningTokens: Int?\n''',
              '''        val provider: String,\n        val model: String,\n        val finishReason: String,\n        val nativeFinishReason: String,\n        val promptTokens: Int?,\n        val completionTokens: Int?,\n        val totalTokens: Int?,\n        val reasoningTokens: Int?,\n        val costUsd: Double?\n''',
              'parser completion fields'
          )

          replace_once(
              'app/src/main/java/com/ayuemin/ymnik/network/OpenRouterResponseParser.kt',
              '''            provider = root.get("provider")?.takeUnless { it.isJsonNull }?.asString.orEmpty(),\n            finishReason = finish,\n            nativeFinishReason = nativeFinish,\n            completionTokens = runCatching { usage?.get("completion_tokens")?.asInt }.getOrNull(),\n            reasoningTokens = reasoningTokens\n''',
              '''            provider = root.get("provider")?.takeUnless { it.isJsonNull }?.asString.orEmpty(),\n            model = root.get("model")?.takeUnless { it.isJsonNull }?.asString.orEmpty(),\n            finishReason = finish,\n            nativeFinishReason = nativeFinish,\n            promptTokens = runCatching { usage?.get("prompt_tokens")?.asInt }.getOrNull(),\n            completionTokens = runCatching { usage?.get("completion_tokens")?.asInt }.getOrNull(),\n            totalTokens = runCatching { usage?.get("total_tokens")?.asInt }.getOrNull(),\n            reasoningTokens = reasoningTokens,\n            costUsd = runCatching { usage?.get("cost")?.asDouble }.getOrNull()\n                ?: runCatching { root.get("cost")?.takeUnless { it.isJsonNull }?.asDouble }.getOrNull()\n''',
              'parser metadata values'
          )

          replace_once(
              'app/src/main/java/com/ayuemin/ymnik/network/OpenRouterClient.kt',
              '''    data class Result(val text: String, val files: List<GeneratedFile>)\n''',
              '''    data class Result(\n        val text: String,\n        val files: List<GeneratedFile>,\n        val modelId: String? = null,\n        val providerName: String? = null,\n        val costUsd: Double? = null,\n        val inputTokens: Int? = null,\n        val outputTokens: Int? = null\n    )\n''',
              'client result metadata'
          )

          replace_once(
              'app/src/main/java/com/ayuemin/ymnik/network/OpenRouterClient.kt',
              '''            val responseMessage = requestCompletion(apiKey, baseUrl, payload, allowEmpty = created.isNotEmpty())\n            val toolCalls = responseMessage.get("tool_calls")?.takeIf { it.isJsonArray }?.asJsonArray\n''',
              '''            val completion = requestCompletion(apiKey, baseUrl, payload, allowEmpty = created.isNotEmpty())\n            val responseMessage = completion.message\n            val toolCalls = responseMessage.get("tool_calls")?.takeIf { it.isJsonArray }?.asJsonArray\n''',
              'chat completion object'
          )

          replace_once(
              'app/src/main/java/com/ayuemin/ymnik/network/OpenRouterClient.kt',
              '''                return@withContext Result(content, created)\n''',
              '''                return@withContext Result(\n                    text = content,\n                    files = created,\n                    modelId = completion.model.ifBlank { model },\n                    providerName = completion.provider.takeIf { it.isNotBlank() },\n                    costUsd = completion.costUsd,\n                    inputTokens = completion.promptTokens,\n                    outputTokens = completion.completionTokens\n                )\n''',
              'chat result metadata'
          )

          replace_once(
              'app/src/main/java/com/ayuemin/ymnik/network/OpenRouterClient.kt',
              '''    private fun requestCompletion(apiKey: String, baseUrl: String, payload: JsonObject, allowEmpty: Boolean): JsonObject {\n''',
              '''    private fun requestCompletion(apiKey: String, baseUrl: String, payload: JsonObject, allowEmpty: Boolean): OpenRouterResponseParser.Completion {\n''',
              'completion return type'
          )

          replace_once(
              'app/src/main/java/com/ayuemin/ymnik/network/OpenRouterClient.kt',
              '''                return completion.message\n''',
              '''                return completion\n''',
              'completion return value'
          )

          replace_once(
              'app/src/main/java/com/ayuemin/ymnik/ChatViewModel.kt',
              '''                val assistant = ChatMessage(\n                    id = UUID.randomUUID().toString(),\n                    role = "assistant",\n                    text = finalText.ifBlank { "Готово." },\n                    generatedFiles = result.files\n                )\n''',
              '''                val assistant = ChatMessage(\n                    id = UUID.randomUUID().toString(),\n                    role = "assistant",\n                    text = finalText.ifBlank { "Готово." },\n                    generatedFiles = result.files,\n                    modelId = result.modelId ?: if (mode == ChatMode.TEXT) textModel else imageModel,\n                    providerName = result.providerName,\n                    costUsd = result.costUsd,\n                    inputTokens = result.inputTokens,\n                    outputTokens = result.outputTokens\n                )\n''',
              'assistant metadata'
          )

          # Show compact metadata only when at least one real value is available.
          replace_once(
              'app/src/main/java/com/ayuemin/ymnik/ui/YmnikApp.kt',
              '''                message.generatedFiles.forEach { file ->\n                    Spacer(Modifier.height(10.dp))\n                    GeneratedFileCard(file, onSaveGenerated)\n                }\n            }\n        }\n\n        if (user && message.text.isNotBlank()) {\n''',
              '''                message.generatedFiles.forEach { file ->\n                    Spacer(Modifier.height(10.dp))\n                    GeneratedFileCard(file, onSaveGenerated)\n                }\n                val usageMeta = listOfNotNull(\n                    message.modelId?.takeIf { it.isNotBlank() }?.substringAfterLast('/'),\n                    message.providerName?.takeIf { it.isNotBlank() },\n                    message.inputTokens?.let { "in $it" },\n                    message.outputTokens?.let { "out $it" },\n                    message.costUsd?.takeIf { it >= 0.0 }?.let { formatUsd(it) }\n                ).joinToString(" · ")\n                if (usageMeta.isNotBlank()) {\n                    Spacer(Modifier.height(6.dp))\n                    Text(\n                        usageMeta,\n                        style = MaterialTheme.typography.labelSmall,\n                        color = MaterialTheme.colorScheme.onSurfaceVariant.copy(alpha = 0.72f)\n                    )\n                }\n            }\n        }\n\n        if (user && message.text.isNotBlank()) {\n''',
              'message usage metadata UI'
          )

          # Parser regression test for usage metadata.
          test = Path('app/src/test/java/com/ayuemin/ymnik/network/OpenRouterResponseParserTest.kt')
          if test.exists():
              text = test.read_text()
              if 'costUsd' not in text:
                  insert_at = text.rfind('}')
                  extra = '''\n    @Test\n    fun `parses OpenRouter usage metadata`() {\n        val parsed = OpenRouterResponseParser.parse("""{\n          "id":"gen_1",\n          "model":"openai/test",\n          "provider":"Provider X",\n          "choices":[{"finish_reason":"stop","message":{"role":"assistant","content":"ok"}}],\n          "usage":{"prompt_tokens":12,"completion_tokens":7,"total_tokens":19,"cost":0.00123}\n        }""")\n        assertEquals("openai/test", parsed.model)\n        assertEquals("Provider X", parsed.provider)\n        assertEquals(12, parsed.promptTokens)\n        assertEquals(7, parsed.completionTokens)\n        assertEquals(19, parsed.totalTokens)\n        assertEquals(0.00123, parsed.costUsd!!, 0.0000001)\n    }\n'''
                  test.write_text(text[:insert_at] + extra + text[insert_at:])
          PY
          git diff --check

      - name: Commit response metadata
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name "Ayuemin"
          git config user.email "105455063+Ayuemin@users.noreply.github.com"
          git add app/src/main/java app/src/test/java
          git commit -m "feat: show OpenRouter response cost and usage [v16-cost]"
          git push origin HEAD:feature/openrouter-full-v1.6.0

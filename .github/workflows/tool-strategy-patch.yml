name: ToolStrategyPatch

on: push

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/local-shell-mvp
      - name: Patch general tool strategy
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/ayuemin/ymnik/ChatViewModel.kt')
          s = p.read_text()
          anchor = '        if (localWebFetchEnabled) {\n            appendLine("У тебя есть локальный read-only инструмент local_web_fetch для чтения конкретной публичной HTTP(S)-страницы. Используй его, когда точный URL уже известен из запроса пользователя или результатов веб-поиска и содержимое страницы действительно нужно для ответа.")\n'
          strategy = '''        if (localWebFetchEnabled || localBrowserToolsEnabled || localShellToolsEnabled) {
            appendLine("Выбирай инструменты по способу работы, а не по тому, какой инструмент был использован первым.")
            appendLine("Перед каждым существенным этапом оцени, какой из доступных способов даст нужный результат надёжнее, быстрее и с меньшим числом последовательных вызовов модели и инструментов.")
            appendLine("Local Web Fetch подходит для быстрого чтения конкретного известного URL без взаимодействия со страницей; Browser — для динамических страниц, навигации, форм и действий в веб-интерфейсе; Local Shell — для локальной многошаговой работы с файлами и данными, поиска и фильтрации, архивов, преобразований, структурного анализа и пакетных операций.")
            appendLine("Если пользователь просит получить результат, а не только обсудить идею или получить совет, самостоятельно используй доступный инструмент, который заметно упрощает выполнение; пользователю не нужно специально называть Browser, Fetch или Shell.")
            appendLine("Сложная задача может свободно сочетать инструменты. Передавай между этапами фактические URL, найденные данные и сохранённые файлы, когда это нужно.")
            appendLine("Переоценивай способ работы по ходу задачи: если выбранный путь превращается в длинную цепочку однотипных чтений или действий, проверь, не выполнит ли другой доступный инструмент этот этап короче и надёжнее.")
            appendLine("Когда для одного результата нужно обработать много связанных файлов или объектов либо выполнить повторяющиеся операции, предпочитай Local Shell последовательности отдельных Fetch/Browser-вызовов, если Shell доступен и подходит для этого этапа.")
            appendLine("Не используй инструмент ради демонстрации возможности и не повторяй действия без прогресса. Сохраняй ограничения безопасности и подтверждения действий с побочным эффектом.")
        }
'''
          if 'Выбирай инструменты по способу работы' not in s:
              if anchor not in s:
                  raise SystemExit('tool strategy anchor not found')
              s = s.replace(anchor, strategy + anchor, 1)
          old = '            appendLine("Если пользователь не просил Browser явно, но интерактивная работа с сайтом заметно упростит задачу по сравнению с обычным поиском/чтением, сначала дай полезный основной ответ, а в конце одной короткой фразой предложи выполнить действие через Browser. Не превращай это в рекламу функции и не повторяй подсказку после отказа.")\n'
          new = '            appendLine("Если пользователь просит выполнить конкретную задачу и интерактивная работа с сайтом заметно упрощает нужный этап, используй Browser самостоятельно, даже если пользователь не назвал Browser. Если пользователь только обсуждает возможность или просит совет, не запускай Browser без необходимости; при желании коротко предложи его.")\n'
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('browser rule not found')
          old = '            appendLine("Если пользователь НЕ просил Shell явно, но работа с файлами, архивами, кодом, массовым переименованием, конвертацией или локальной проверкой была бы заметно проще/надёжнее через Local Shell, дай основной ответ как обычно и в конце одной короткой фразой предложи эту возможность. Не предлагай Shell в каждом сообщении и не повторяй предложение после отказа пользователя.")\n'
          new = '            appendLine("Если пользователь просит выполнить конкретную задачу и Local Shell заметно упрощает или делает надёжнее нужный этап, запускай Local Shell самостоятельно, даже если пользователь не назвал Shell. Это относится не только к коду: ориентируйся на характер работы — много файлов или объектов, повторяющиеся операции, локальный поиск/фильтрация, преобразования, архивы, структурный анализ и пакетная обработка.")\n            appendLine("Если задача Local Shell требует получить публичные данные или проект из сети, разрешай сеть параметром network=true; если сеть этапу не нужна, не включай её без причины.")\n'
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('shell rule not found')
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/ayuemin/ymnik/ChatViewModel.kt
          git commit -m "Teach chat to choose tools by task"
          git push origin HEAD:work/local-shell-mvp

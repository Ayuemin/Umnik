name: Release v1.6.3 once

on:
  push:
    branches: [main]
    paths: [".github/workflows/release-v1.6.3-once.yml"]

permissions:
  contents: write
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Create v1.6.3 tag and start signed release
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: 0858e084b150cc42b1ca59de147bd356c19cac94
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref='refs/tags/v1.6.3' \
            -f sha="$TARGET_SHA"
          gh workflow run android-release.yml --repo "$GITHUB_REPOSITORY" --ref main -f tag=v1.6.3

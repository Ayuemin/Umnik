name: Dispatch v1.10.0 Release

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/dispatch-v1.10.0-release.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch signed release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run android-release.yml --repo "$GITHUB_REPOSITORY" -f tag=v1.10.0

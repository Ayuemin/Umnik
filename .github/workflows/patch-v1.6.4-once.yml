name: Patch v1.6.4 once

on:
  push:
    branches: [fix/remove-client-limits-batch-ux-v1.6.4]
    paths: [".github/workflows/patch-v1.6.4-once.yml"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/remove-client-limits-batch-ux-v1.6.4
          fetch-depth: 0
      - name: Apply v1.6.4 changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace(path, old, new, count=1):
              p = Path(path)
              s = p.read_text()
              n = s.count(old)
              if n < count:
                  raise SystemExit(f"{path}: expected at least {count} occurrences, found {n}: {old[:80]!r}")
              p.write_text(s.replace(old, new, count))

          # 1) No client-side attachment-size cap and no artificial context ceiling/headroom.
          p = Path('app/src/main/java/com/ayuemin/ymnik/network/ConversationContext.kt')
          s = p.read_text()
          s = s.replace('    private const val DEFAULT_WINDOW = 128_000\n    private const val MAX_WINDOW = 1_048_576\n\n', '')
          old = '''    fun checkTransferSize(attachments: List<PendingAttachment>) {
              val total = attachments.sumOf { attachment ->
                  attachment.localPath?.let { File(it).takeIf(File::isFile)?.length() }
                      ?: attachment.size.coerceAtLeast(0L)
              }
              require(total <= 32L * 1024 * 1024) {
                  "Общий объём файлов в одном запросе превышает 32 МБ. Уберите часть файлов из чата или проекта."
              }
          }
'''
          if old not in s: raise SystemExit('ConversationContext: transfer-size block not found')
          s = s.replace(old, '''    /** No Umnik size cap: provider/model/device limits are authoritative. */
          fun checkTransferSize(attachments: List<PendingAttachment>) = Unit
''')
          old = '''        val window = (contextLength ?: DEFAULT_WINDOW).coerceIn(8_192, MAX_WINDOW)
              val inputBudget = ((window - outputTokens - 1_024).coerceAtLeast(0) * 0.85).toInt()
              val fixed = estimateTokens(systemPrompt).toLong() + estimateTokens(prompt) + attachmentTokens + 256
              require(fixed <= inputBudget) {
                  "Инструкции, запрос и файлы превышают контекстное окно модели. Уберите часть файлов из чата/проекта или выберите модель с большим контекстом."
              }

              val completed = completedTextTurns(history)
'''
          new = '''        val completed = completedTextTurns(history)
              // When the provider does not publish a context length, send the complete stored
              // conversation and let the provider enforce its own limits. For known windows we
              // only trim the oldest completed turns; fixed prompt/files are never blocked here.
              val inputBudget = contextLength?.takeIf { it > 0 }?.toLong() ?: return completed
              val fixed = estimateTokens(systemPrompt).toLong() + estimateTokens(prompt) + attachmentTokens + 256
'''
          if old not in s: raise SystemExit('ConversationContext: budget block not found')
          s = s.replace(old, new)
          p.write_text(s)

          # 2) OpenRouter: do not impose 8K/12K max_tokens. Provider/model owns output budget.
          p = Path('app/src/main/java/com/ayuemin/ymnik/network/OpenRouterClient.kt')
          s = p.read_text()
          old = '''        ConversationContext.checkTransferSize(attachments)
              val outputTokens = (if (reasoningEnabled || modelInfo?.reasoningMandatory == true) 12_000 else 8_000)
                  .coerceAtMost(modelInfo?.maxCompletionTokens ?: 12_000)
              val selectedHistory = ConversationContext.select(
                  history, systemPrompt, prompt, ConversationContext.attachmentTokens(attachments),
                  modelInfo?.contextLength, outputTokens
              )'''
          new = '''        val selectedHistory = ConversationContext.select(
                  history, systemPrompt, prompt, ConversationContext.attachmentTokens(attachments),
                  modelInfo?.contextLength, 0
              )'''
          if old not in s: raise SystemExit('OpenRouterClient: output budget block not found')
          s = s.replace(old, new)
          s = s.replace('DiagnosticLog.record(context, "CONTEXT", "OpenRouter model=$model; stored=${history.size}; sent=${selectedHistory.size}; window=${modelInfo?.contextLength ?: 128_000}; output=$outputTokens; attachments=${attachments.size}")',
                        'DiagnosticLog.record(context, "CONTEXT", "OpenRouter model=$model; stored=${history.size}; sent=${selectedHistory.size}; window=${modelInfo?.contextLength ?: "provider"}; output=provider; attachments=${attachments.size}")')
          if '                addProperty("max_tokens", outputTokens)\n' not in s: raise SystemExit('OpenRouterClient: max_tokens line not found')
          s = s.replace('                addProperty("max_tokens", outputTokens)\n', '')
          p.write_text(s)

          # 3) Batch follows the same no-cap policy.
          p = Path('app/src/main/java/com/ayuemin/ymnik/network/OpenRouterBatchBodyBuilder.kt')
          s = p.read_text()
          old = '''        ConversationContext.checkTransferSize(attachments)
              val outputTokens = (if (reasoningEnabled || modelInfo?.reasoningMandatory == true) 12_000 else 8_000)
                  .coerceAtMost(modelInfo?.maxCompletionTokens ?: 12_000)
              val selectedHistory = ConversationContext.select(
                  history,
                  systemPrompt,
                  prompt,
                  ConversationContext.attachmentTokens(attachments),
                  modelInfo?.contextLength,
                  outputTokens
              )'''
          new = '''        val selectedHistory = ConversationContext.select(
                  history,
                  systemPrompt,
                  prompt,
                  ConversationContext.attachmentTokens(attachments),
                  modelInfo?.contextLength,
                  0
              )'''
          if old not in s: raise SystemExit('OpenRouterBatchBodyBuilder: output budget block not found')
          s = s.replace(old, new)
          if '            addProperty("max_tokens", outputTokens)\n' not in s: raise SystemExit('OpenRouterBatchBodyBuilder: max_tokens line not found')
          s = s.replace('            addProperty("max_tokens", outputTokens)\n', '')
          p.write_text(s)

          # 4) Compatible/NVIDIA chat: remove 4K client max_tokens and client transfer cap.
          p = Path('app/src/main/java/com/ayuemin/ymnik/network/CompatibleApiClient.kt')
          s = p.read_text()
          s = s.replace('            ConversationContext.checkTransferSize(attachments)\n', '')
          old = '''            val selectedHistory = ConversationContext.select(
                  history, systemPrompt, prompt, ConversationContext.attachmentTokens(attachments),
                  modelInfo?.contextLength, if (isNvidia) 8_192 else 4_096
              )'''
          new = '''            val selectedHistory = ConversationContext.select(
                  history, systemPrompt, prompt, ConversationContext.attachmentTokens(attachments),
                  modelInfo?.contextLength, 0
              )'''
          if old not in s: raise SystemExit('CompatibleApiClient: context block not found')
          s = s.replace(old, new)
          s = s.replace('                if (!isNvidia) addProperty("max_tokens", 4096)\n', '')
          p.write_text(s)

          # 5) Batch UX: a :batch model is sent with the normal Send button. Remove the misleading
          # composer shortcut that opened the legacy multi-job screen.
          p = Path('app/src/main/java/com/ayuemin/ymnik/ui/YmnikApp.kt')
          s = p.read_text()
          pattern = re.compile(r'''\n\s*ComposerActionTile\(\n\s*icon = Icons\.Outlined\.SwapHoriz,\n\s*label = "Batch",\n\s*enabled = !state\.isLoading && !imagePromptMode && \(state\.currentChatTextModel \?: state\.textModel\)\.endsWith\(":batch", ignoreCase = true\),\n\s*modifier = Modifier\.weight\(1f\),\n\s*onClick = \{\n\s*actionsOpen = false\n\s*com\.ayuemin\.ymnik\.AsyncJobEvents\.requestHub\("jobs"\)\n\s*\}\n\s*\)''')
          s, n = pattern.subn('', s, count=1)
          if n != 1: raise SystemExit(f'YmnikApp: expected one Batch composer tile, removed {n}')
          p.write_text(s)

          # 6) Make it explicit that Hub/Jobs is only the advanced multi-request tool.
          p = Path('app/src/main/java/com/ayuemin/ymnik/ui/OpenRouterHub.kt')
          s = p.read_text()
          s = s.replace('Text("Umnik 1.6.2 · полный каталог и возможности"', 'Text("Umnik 1.6.4 · полный каталог и возможности"')
          s = s.replace('Text("Пакетная обработка", style = MaterialTheme.typography.titleMedium, fontWeight = FontWeight.Bold)',
                        'Text("Пакет из нескольких заданий", style = MaterialTheme.typography.titleMedium, fontWeight = FontWeight.Bold)')
          marker = 'Text("Модель: ${state.media.batchModel.ifBlank { "не выбрана" }}", style = MaterialTheme.typography.bodySmall, color = MaterialTheme.colorScheme.onSurfaceVariant)'
          addition = marker + '\n                Text("Один Batch-запрос отправляйте прямо из обычного чата кнопкой отправки. Этот экран нужен только для нескольких независимых заданий.", style = MaterialTheme.typography.bodySmall, color = MaterialTheme.colorScheme.onSurfaceVariant)'
          if marker not in s: raise SystemExit('OpenRouterHub: jobs model marker not found')
          s = s.replace(marker, addition, 1)
          p.write_text(s)

          # 7) Tests now verify provider-owned limits instead of the old Umnik rejection.
          p = Path('app/src/test/java/com/ayuemin/ymnik/network/ConversationContextTest.kt')
          s = p.read_text()
          s = s.replace('import org.junit.Assert.assertTrue\n', '')
          old = '''    @Test fun oversizedFixedContextFailsClearly() {
              val error = runCatching {
                  ConversationContext.select(emptyList(), "", "привет", 80_000, 32_000, 8_000)
              }.exceptionOrNull()
              assertTrue(error is IllegalArgumentException)
              assertTrue(error?.message.orEmpty().contains("файлы"))
          }
'''
          new = '''    @Test fun oversizedFixedContextIsSentToProviderWithoutClientRejection() {
              val selected = ConversationContext.select(emptyList(), "", "привет", 80_000, 32_000, 8_000)
              assertEquals(emptyList<ChatMessage>(), selected)
          }

              @Test fun unknownProviderWindowKeepsCompleteHistory() {
                  val history = (1..90).flatMap { listOf(user(it), answer(it)) }
                  val selected = ConversationContext.select(history, "инструкция", "вопрос", 0, null, 0)
                  assertEquals(180, selected.size)
              }
'''
          if old not in s: raise SystemExit('ConversationContextTest: old cap test not found')
          s = s.replace(old, new)
          p.write_text(s)

          # 8) Version + changelog.
          p = Path('app/build.gradle.kts')
          s = p.read_text().replace('// Umnik v1.6.3', '// Umnik v1.6.4', 1)
          s = s.replace('versionCode = 63', 'versionCode = 64', 1).replace('versionName = "1.6.3"', 'versionName = "1.6.4"', 1)
          p.write_text(s)

          p = Path('CHANGELOG.md')
          s = p.read_text()
          heading = '## Unreleased\n\n'
          section = '''## v1.6.4 - 2026-09-14

          - Убраны искусственные лимиты Umnik на 8K/12K выходных токенов OpenRouter и 4K для совместимых API: приложение больше не отправляет свой `max_tokens` и оставляет лимит ответа модели/провайдеру.
          - Убран потолок контекстного окна Umnik в 1 048 576 токенов и 85-процентный запас. При известном окне модели сокращается только самая старая завершённая история; фиксированный запрос и файлы клиент больше не блокирует.
          - Полностью снят лимит Umnik в 32 МБ на суммарный размер вложений. Ограничения памяти Android и самого API/провайдера по-прежнему могут применяться.
          - Batch-модель теперь не имеет отдельной кнопки «Batch» в меню `+`: для одного Batch-запроса используется обычное поле чата, вложения и стандартная кнопка отправки.
          - Экран Hub → «Задания» переименован и пояснён как инструмент только для нескольких независимых Batch-заданий.
          - Версия: 1.6.4 / versionCode 64.

          '''
          if heading not in s: raise SystemExit('CHANGELOG: Unreleased heading not found')
          p.write_text(s.replace(heading, heading + section, 1))
          PY

          git config user.name "Ayuemin"
          git config user.email "105455063+Ayuemin@users.noreply.github.com"
          git add app CHANGELOG.md
          git commit -m "fix: remove client caps and simplify Batch UX"
          git push origin HEAD:fix/remove-client-limits-batch-ux-v1.6.4

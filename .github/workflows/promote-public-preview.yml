name: Promote current public preview

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/promote-public-preview.yml"

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Make v0.6.7 visible as the current release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit v0.6.7 \
            --repo "$GITHUB_REPOSITORY" \
            --title "Umnik v0.6.7 — Public Preview" \
            --prerelease=false \
            --latest

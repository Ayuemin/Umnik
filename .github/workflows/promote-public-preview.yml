name: Polish current public preview

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/promote-public-preview.yml"

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare release notes
        run: |
          cat > release-notes.md <<'EOF'
          ## Umnik v0.6.7 — Public Preview

          Первый оформленный публичный preview-релиз Umnik — Android-клиента для OpenRouter, ориентированного на рабочие диалоги, проекты, файлы и смену моделей без потери контекста.

          ### Что умеет Umnik

          - переключать текстовые модели прямо внутри одного чата;
          - сохранять текстовую историю при смене модели;
          - держать текстовые документы и PDF в контексте текущего чата;
          - работать с проектами, собственными инструкциями, навыками и постоянными файлами;
          - отправлять изображения, аудио, видео, PDF и текстовые файлы в соответствии с возможностями выбранной модели;
          - использовать камеру для моделей с image input;
          - вручную включать reasoning и web search;
          - останавливать активный запрос кнопкой Stop;
          - озвучивать ответы через Android Text-to-Speech;
          - хранить API-ключ OpenRouter локально с шифрованием через Android Keystore.

          ### Что исправлено в v0.6.7

          - постоянные файлы чата теперь отображаются в сообщении, вместе с которым реально уходят модели;
          - перед отправкой проверяется наличие локальной копии файла;
          - убрано лишнее Base64-кодирование текстовых вложений;
          - повторный запрос корректно работает, пока необходимые файлы остаются в контексте чата.

          ### Установка

          1. Скачайте `Umnik-v0.6.7.apk` в блоке **Assets** ниже.
          2. Установите APK на Android 8.0 или новее.
          3. Откройте настройки Umnik, укажите свой API-ключ OpenRouter и выберите модель.

          ### Проверка APK

          Рядом с APK опубликован файл `Umnik-v0.6.7.apk.sha256` с SHA-256 контрольной суммой.

          ### Важно

          Это **Public Preview**, а не финальная стабильная версия. Сборки ветки v0.6.x создавались во время активной разработки и подписывались тестовым ключом сборочной среды. Android может потребовать удалить более раннюю тестовую установку перед установкой другой сборки этой серии.

          Следующие публичные релизы подготовлены к отдельной постоянной подписи и нормальному обновлению поверх установленной версии.

          Проект создан Александром (Ayuemin) в соавторстве с ChatGPT от OpenAI.
          EOF

      - name: Update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit v0.6.7 \
            --repo "$GITHUB_REPOSITORY" \
            --title "Umnik v0.6.7 — Public Preview" \
            --notes-file release-notes.md \
            --prerelease=false \
            --latest

name: Dispatch Umnik v1.10.8 release

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/dispatch-v1.10.8-release.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch signed Android release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run android-release.yml --repo Ayuemin/Umnik --ref main -f tag=v1.10.8

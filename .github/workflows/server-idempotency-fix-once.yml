name: Harden server idempotency once

on:
  push:
    branches:
      - "test/server-mode-v1.18"
    paths:
      - ".github/workflows/server-idempotency-fix-once.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: test/server-mode-v1.18
          fetch-depth: 0
      - name: Patch stable request key
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("app/src/main/java/com/ayuemin/ymnik/network/OpenRouterClient.kt")
          text = path.read_text()
          old = "private fun stableServerRequestId(payloadJson: String): String {\n    val digest = MessageDigest.getInstance(\"SHA-256\")\n        .digest(payloadJson.toByteArray(Charsets.UTF_8))\n        .joinToString(\"\") { byte -> \"%02x\".format(byte) }\n        .take(24)\n    val requestPart = requestId?.takeIf { it.isNotBlank() } ?: \"local\"\n    return \"$requestPart-$digest\"\n}\n"
          new = "private fun stableServerRequestId(payloadJson: String): String {\n    val normalized = runCatching {\n        gson.fromJson(payloadJson, JsonObject::class.java).deepCopy().apply {\n            getAsJsonObject(\"metadata\")?.remove(\"umnik_request_id\")\n        }\n    }.getOrElse { JsonObject().apply { addProperty(\"payload\", payloadJson) } }\n    val canonical = gson.toJson(normalized)\n    val digest = MessageDigest.getInstance(\"SHA-256\")\n        .digest(canonical.toByteArray(Charsets.UTF_8))\n        .joinToString(\"\") { byte -> \"%02x\".format(byte) }\n        .take(32)\n    val chatPart = requestChatId?.takeIf { it.isNotBlank() } ?: \"global\"\n    return \"$chatPart-$digest\"\n}\n"
          assert old in text
          path.write_text(text.replace(old, new, 1))
          Path(".github/workflows/server-idempotency-fix-once.yml").unlink()
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Keep server job idempotency across manual retries"
          git push origin HEAD:test/server-mode-v1.18

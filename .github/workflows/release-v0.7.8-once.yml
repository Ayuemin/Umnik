name: Prepare and publish Umnik v0.7.8

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/release-v0.7.8-once.yml"

permissions:
  contents: write
  actions: write

jobs:
  prepare-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch chat screen
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("app/src/main/java/com/ayuemin/ymnik/ui/YmnikApp.kt")
          text = path.read_text(encoding="utf-8")
          old_import = "import androidx.compose.material.icons.outlined.CropFree\n"
          new_import = "import androidx.compose.material.icons.outlined.AddComment\n"
          if old_import not in text:
              raise SystemExit("CropFree import not found")
          text = text.replace(old_import, new_import, 1)
          old_empty = "item { EmptyChatWelcome(Modifier.fillParentMaxHeight()) }"
          new_empty = "item { EmptyChatWelcome(Modifier.fillParentMaxSize()) }"
          if old_empty not in text:
              raise SystemExit("Empty chat modifier not found")
          text = text.replace(old_empty, new_empty, 1)
          old_icon = 'Icon(Icons.Outlined.CropFree, contentDescription = "Новый чат", modifier = Modifier.size(24.dp))'
          new_icon = 'Icon(Icons.Outlined.AddComment, contentDescription = "Новый чат", modifier = Modifier.size(24.dp))'
          if old_icon not in text:
              raise SystemExit("New chat icon call not found")
          text = text.replace(old_icon, new_icon, 1)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Verify debug build
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Commit UI change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/ayuemin/ymnik/ui/YmnikApp.kt
          git commit -m "Center empty chat and clarify new chat action"
          git push origin HEAD:main

      - name: Create v0.7.8 tag
        shell: bash
        run: |
          set -euo pipefail
          git tag v0.7.8
          git push origin v0.7.8

      - name: Dispatch signed release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run android-release.yml -f tag=v0.7.8

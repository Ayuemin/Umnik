name: Fix Umnik 1.6 changelog encoding

on:
  push:
    branches:
      - "feature/openrouter-full-v1.6.0"

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[v16-changelog-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/openrouter-full-v1.6.0
          fetch-depth: 0
      - name: Fix text
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('CHANGELOG.md')
          text = p.read_text()
          text = text.replace('остаЎтся', 'остаются')
          p.write_text(text)
          PY
          git diff --check
      - name: Commit fix
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name "Ayuemin"
          git config user.email "105455063+Ayuemin@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "fix: changelog encoding [v16-changelog-fix]"
          git push origin HEAD:feature/openrouter-full-v1.6.0

name: Prepare Umnik 1.6 changelog

on:
  push:
    branches:
      - "feature/openrouter-full-v1.6.0"

permissions:
  contents: write

jobs:
  prep:
    if: ${{ !contains(github.event.head_commit.message, '[v16-changelog]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/openrouter-full-v1.6.0
          fetch-depth: 0
      - name: Insert changelog sections
        env:
          SECTION_B64: ""
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          path = Path('CHANGELOG.md')
          text = path.read_text()
          if '## v1.6.0 - 2026-09-13' not in text:
              marker = '## Unreleased\n'
              if marker not in text:
                  raise SystemExit('Unreleased section not found')
              section = base64.b64decode(os.environ['SECTION_B64']).decode('utf-8')
              path.write_text(text.replace(marker, marker + section, 1))
          PY
          git diff --check
      - name: Commit changelog
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name "Ayuemin"
          git config user.email "105455063+Ayuemin@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "Document Umnik 1.6.0 [v16-changelog]"
          git push origin HEAD:feature/openrouter-full-v1.6.0

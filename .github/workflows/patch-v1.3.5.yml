name: Apply v1.3.5 patch

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/patch-v1.3.5.yml"

permissions:
  contents: write

jobs:
  patch-and-tag:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply source patch
        run: python3 tools/apply_v1_3_5.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Compile debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Commit v1.3.5
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/ayuemin/ymnik/ui/YmnikApp.kt \
                  app/src/main/java/com/ayuemin/ymnik/network/NvidiaImageClient.kt \
                  app/src/main/java/com/ayuemin/ymnik/network/OpenRouterClient.kt \
                  app/src/main/res/xml/file_paths.xml \
                  docs/provider-registry.json \
                  app/build.gradle.kts \
                  CHANGELOG.md
          git diff --cached --check
          git commit -m "Release v1.3.5"
          git tag -a v1.3.5 -m "Umnik v1.3.5"
          git push origin HEAD:main
          git push origin v1.3.5

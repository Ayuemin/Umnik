name: Release v1.6.2 once

on:
  push:
    branches: [main]
    paths: [".github/workflows/release-v1.6.2-once.yml"]

permissions:
  contents: write
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Create v1.6.2 tag and start signed release
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: abbb972e9be34fca1df36c22dbc4852a60a4a08d
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref='refs/tags/v1.6.2' \
            -f sha="$TARGET_SHA"
          gh workflow run android-release.yml --repo "$GITHUB_REPOSITORY" --ref main -f tag=v1.6.2

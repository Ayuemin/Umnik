name: Fix v1.6.1 Hub strings once

on:
  push:
    branches: [main]
    paths: [".github/workflows/fix-v1.6.1-strings-once.yml"]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v1.6.1-hub-polish
          fetch-depth: 0
      - name: Fix Kotlin price strings
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/ayuemin/ymnik/ui/OpenRouterHub.kt')
          s = p.read_text()
          replacements = {
              '"≤ $0.5"': '"≤ \\$0.5"',
              '"≤ $1"': '"≤ \\$1"',
              '"≤ $5"': '"≤ \\$5"',
              '"≤ $10"': '"≤ \\$10"',
              'value == 0.0 -> "$0"': 'value == 0.0 -> "\\$0"',
              'Text("Umnik 1.6 · полный каталог и возможности"': 'Text("Umnik 1.6.1 · полный каталог и возможности"',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'missing pattern: {old}')
              s = s.replace(old, new)
          p.write_text(s)
          PY
          git config user.name "Ayuemin"
          git config user.email "105455063+Ayuemin@users.noreply.github.com"
          git add app/src/main/java/com/ayuemin/ymnik/ui/OpenRouterHub.kt
          git commit -m "Fix v1.6.1 Hub price labels"
          git push origin HEAD:fix/v1.6.1-hub-polish

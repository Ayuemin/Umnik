name: Apply multi-request v1.17.0

on:
  push:
    branches:
      - feature/multi-request-v1.17.0
    paths:
      - "tools/apply_multi_request_core.py"
      - ".github/workflows/apply-multi-request-v1170.yml"

permissions:
  contents: write

jobs:
  migrate-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: feature/multi-request-v1.17.0
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Adapt migration to current Orchestrator layout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("tools/apply_multi_request_core.py")
          text = path.read_text(encoding="utf-8")

          old = '''    count = text.count(old)\n    if count != 1:\n        raise RuntimeError(f"{label}: expected 1 occurrence, got {count}")\n    return text.replace(old, new, 1)'''
          new = '''    count = text.count(old)\n    if label == "execute chat network signature" and count == 2:\n        return text.replace(old, new, 1)\n    if label == "stage sequence global guard" and count == 2:\n        head, sep, tail = text.rpartition(old)\n        return head + new + tail\n    if count != 1:\n        raise RuntimeError(f"{label}: expected 1 occurrence, got {count}")\n    return text.replace(old, new, 1)'''
          if old not in text:
              raise SystemExit("replace_once helper shape changed")
          text = text.replace(old, new, 1)

          old_cleanup = '''text = text.replace('                    activeRequestJob = null\\n', '')\ntext = text.replace('                projectStagesJob = null\\n', '')'''
          new_cleanup = '''text = text.replace('                    activeRequestJob = null\\n', '')\ntext = text.replace('                projectStagesJob = null\\n', '')\ntext = re.sub(r'^\\s*(?:activeRequestJob|projectStagesJob) = null\\s*\\n', '', text, flags=re.MULTILINE)'''
          if old_cleanup not in text:
              raise SystemExit("legacy Job cleanup shape changed")
          text = text.replace(old_cleanup, new_cleanup, 1)

          # Four re.sub replacement templates contain \1/\2. They must be raw Python
          # strings; otherwise Python turns them into control characters before re.sub sees them.
          backref_template = re.compile(r"(?ms)^(\s*)'''((?:(?!''').)*?\\[12](?:(?!''').)*)'''")
          text, rawified = backref_template.subn(
              lambda match: match.group(1) + "r'''" + match.group(2) + "'''",
              text
          )
          if rawified != 4:
              raise SystemExit(f"expected 4 regex back-reference replacement strings, got {rawified}")

          path.write_text(text, encoding="utf-8")
          PY

      - name: Apply deterministic multi-request migration
        run: python3 tools/apply_multi_request_core.py

      - name: Finalize OpenRouter request isolation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text(encoding="utf-8")

          def write(path, text):
              Path(path).write_text(text, encoding="utf-8")

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 occurrence, got {count}")
              return text.replace(old, new, 1)

          # ChatViewModel: error state must target the request in this chat, and the
          # model catalog is OpenRouter-only.
          path = "app/src/main/java/com/ayuemin/ymnik/ChatViewModel.kt"
          text = read(path)
          fail_pattern = re.compile(r'(?m)^(\s*)RequestExecutionManager\.fail\(friendlyError\)\s*$')
          def fail_replacement(match):
              indent = match.group(1)
              return (
                  f"{indent}RequestExecutionManager.snapshotForChat(chatId)?.requestId?.let {{ activeRequestId ->\n"
                  f"{indent}    RequestExecutionManager.fail(activeRequestId, friendlyError)\n"
                  f"{indent}}}"
              )
          text, fail_count = fail_pattern.subn(fail_replacement, text)
          if fail_count != 2:
              raise SystemExit(f"per-chat fail migration: expected 2 calls, got {fail_count}")

          models_pattern = re.compile(
              r'    private suspend fun textModelsForProfile\(profile: ConnectionProfile\): List<ModelInfo> \{.*?\n    \}\n\n(?=    private suspend fun imageModelsForProfile)',
              re.S
          )
          models_replacement = '''    private suspend fun textModelsForProfile(profile: ConnectionProfile): List<ModelInfo> {
              require(profile.type == ProviderType.OPENROUTER) { "Umnik использует только OpenRouter" }
              val key = secrets.getProfileApiKey(profile.id).orEmpty()
              return api.models(key, effectiveTextBaseUrl(profile))
                  .filter { ModelCategory.TEXT in it.categories && !it.isBatch }
          }

'''
          text, model_count = models_pattern.subn(models_replacement, text, count=1)
          if model_count != 1:
              raise SystemExit(f"OpenRouter model catalog migration: expected 1 function, got {model_count}")
          if "compatibleApi" in text:
              raise SystemExit("compatibleApi reference survived OpenRouter-only migration")
          write(path, text)

          # Manager: Batch needs an exact request lookup, not an arbitrary active chat.
          path = "app/src/main/java/com/ayuemin/ymnik/RequestExecutionManager.kt"
          text = read(path)
          text = replace_once(
              text,
              '''    fun snapshotForChat(chatId: String): Snapshot? = synchronized(lock) {
                  runtimes.values.firstOrNull { it.snapshot.chatId == chatId }?.snapshot
              }
''',
              '''    fun snapshotForChat(chatId: String): Snapshot? = synchronized(lock) {
                  runtimes.values.firstOrNull { it.snapshot.chatId == chatId }?.snapshot
              }

              fun snapshotForRequest(requestId: String): Snapshot? = synchronized(lock) {
                  runtimes[requestId]?.snapshot
              }
''',
              "request snapshot lookup"
          )
          write(path, text)

          # RequestNetworkSession passes its requestId into every OpenRouter client.
          path = "app/src/main/java/com/ayuemin/ymnik/RequestNetworkSession.kt"
          text = read(path)
          text = replace_once(
              text,
              'private fun openRouter(): OpenRouterClient = OpenRouterClient(app) { label -> updatePhase(label) }',
              'private fun openRouter(): OpenRouterClient = OpenRouterClient(app, requestId) { label -> updatePhase(label) }',
              "request-bound OpenRouter client"
          )
          write(path, text)

          # OpenRouterClient carries request identity into Batch tracking.
          path = "app/src/main/java/com/ayuemin/ymnik/network/OpenRouterClient.kt"
          text = read(path)
          text = replace_once(
              text,
              '''class OpenRouterClient(
                  private val context: Context,
                  private val phaseCallback: (String) -> Unit = {}
              ) {''',
              '''class OpenRouterClient(
                  private val context: Context,
                  private val requestId: String? = null,
                  private val phaseCallback: (String) -> Unit = {}
              ) {''',
              "OpenRouter request identity"
          )
          text = replace_once(
              text,
              'private val chatBatchRunner = OpenRouterChatBatchRunner(context)',
              'private val chatBatchRunner = OpenRouterChatBatchRunner(context, requestId)',
              "Batch request identity"
          )
          write(path, text)

          # Batch must resolve its originating chat/message from this exact request.
          path = "app/src/main/java/com/ayuemin/ymnik/network/OpenRouterChatBatchRunner.kt"
          text = read(path)
          text = replace_once(
              text,
              'internal class OpenRouterChatBatchRunner(private val context: Context) {',
              '''internal class OpenRouterChatBatchRunner(
                  private val context: Context,
                  private val requestId: String? = null
              ) {''',
              "Batch runner constructor"
          )
          text = replace_once(
              text,
              '''        RequestExecutionManager.fail(
                  "Отслеживание Batch остановлено. Задание OpenRouter может продолжать выполняться и тарифицироваться на сервере."
              )''',
              '''        requestId?.let { id ->
                  RequestExecutionManager.fail(
                      id,
                      "Отслеживание Batch остановлено. Задание OpenRouter может продолжать выполняться и тарифицироваться на сервере."
                  )
              }''',
              "Batch per-request failure"
          )
          text = replace_once(
              text,
              '''        val originChatId = RequestExecutionManager.snapshots.value.activeChatId
              val originChat = chats.list().firstOrNull { it.id == originChatId }
              val originMessageId = originChat?.messages
                  ?.lastOrNull { it.role == "user" && it.deliveryState == "pending" }
                  ?.id''',
              '''        val originSnapshot = requestId
                  ?.let(RequestExecutionManager::snapshotForRequest)
                  ?: error("Batch-запрос не привязан к активной сессии")
              val originChatId = originSnapshot.chatId
              val originChat = chats.list().firstOrNull { it.id == originChatId }
              val originMessageId = originSnapshot.messageId''',
              "Batch origin binding"
          )
          write(path, text)
          PY

      - name: Unit tests and debug APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Commit tested production changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/ayuemin/ymnik
          if git diff --cached --quiet; then
            echo "No production changes"
          else
            git commit -m "Apply tested OpenRouter multi-request core"
            git push origin HEAD:feature/multi-request-v1.17.0
          fi

name: Apply multi-request v1.17.0

on:
  push:
    branches:
      - feature/multi-request-v1.17.0
    paths:
      - "tools/apply_multi_request_core.py"
      - ".github/workflows/apply-multi-request-v1170.yml"

permissions:
  contents: write

jobs:
  migrate-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: feature/multi-request-v1.17.0
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Adapt migration to current Orchestrator layout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("tools/apply_multi_request_core.py")
          text = path.read_text(encoding="utf-8")
          old = '''    count = text.count(old)\n    if count != 1:\n        raise RuntimeError(f"{label}: expected 1 occurrence, got {count}")\n    return text.replace(old, new, 1)'''
          new = '''    count = text.count(old)\n    if label == "execute chat network signature" and count == 2:\n        return text.replace(old, new, 1)\n    if label == "stage sequence global guard" and count == 2:\n        head, sep, tail = text.rpartition(old)\n        return head + new + tail\n    if count != 1:\n        raise RuntimeError(f"{label}: expected 1 occurrence, got {count}")\n    return text.replace(old, new, 1)'''
          if old not in text:
              raise SystemExit("replace_once helper shape changed")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Apply deterministic multi-request migration
        run: python3 tools/apply_multi_request_core.py

      - name: Unit tests and debug APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Commit tested production changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/ayuemin/ymnik
          if git diff --cached --quiet; then
            echo "No production changes"
          else
            git commit -m "Apply tested OpenRouter multi-request core"
            git push origin HEAD:feature/multi-request-v1.17.0
          fi

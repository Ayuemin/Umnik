              ('appendLine("Umnik распознаёт :::copy как отдельную карточку с кнопкой копирования. Не утверждай, что показал отдельный блок, если не использовал этот синтаксис.")', 'appendLine("Не утверждай, что показал отдельный copy-блок без этого синтаксиса.")'),
              ('appendLine("Для кода используй обычные fenced Markdown-блоки с тройными обратными кавычками.")', 'appendLine("Код оформляй обычными fenced Markdown-блоками.")'),
              ('appendLine("Подключённые ниже навыки принадлежат текущему чату или текущему специалисту. Следуй им как рабочим правилам, если они не противоречат явному текущему запросу пользователя.")', 'appendLine("Подключённые навыки — рабочие правила текущего чата/специалиста; явный текущий запрос пользователя приоритетнее.")'),
              ('appendLine("Не утверждай, что исполнил код из папки навыка: Umnik передаёт навыкам только разрешённые текстовые материалы.")', 'appendLine("Не утверждай, что исполнил код навыка: Umnik передаёт только разрешённые текстовые материалы.")'),
              ('appendLine("Ты выполняешь задачу пользователя через Local Shell Umnik.")', 'appendLine("Выполняй задачу пользователя через Local Shell Umnik.")'),

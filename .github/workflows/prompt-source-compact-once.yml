              ('appendLine("Исходные вложения уже находятся в папке input. Не проси загрузить их повторно.")', 'appendLine("Вложения уже в input; не проси загружать их повторно.")'),
              ('appendLine("Начни с local_list. Для ZIP/TAR сначала распакуй архив через local_archive в отдельную рабочую папку.")', 'appendLine("Начни с local_list. ZIP/TAR сначала распакуй через local_archive в отдельную рабочую папку.")'),
              ('appendLine("Для поиска по проекту предпочитай local_search/local_read, для малых правок local_replace.")', 'appendLine("Поиск: local_search/local_read; малые правки: local_replace.")'),
              ('appendLine("Группируй независимые local_read/local_search в один модельный шаг, когда пути уже известны.")', 'appendLine("Независимые local_read/local_search с известными путями группируй в один модельный шаг.")'),
              ('appendLine("Python используй для тестов и обработки данных, когда это действительно полезно.")', 'appendLine("Python используй для тестов/обработки данных, когда полезно.")'),
              ('appendLine("Сеть доступна только через local_fetch и public_clone в local_git, если шлюз разрешён.")', 'appendLine("Сеть: только local_fetch и public_clone в local_git, если разрешена.")'),
              ('appendLine("Не загружай локальные файлы в сеть и не пытайся делать Git push.")', 'appendLine("Не загружай локальные файлы в сеть и не делай Git push.")'),
              ('appendLine("Сохраняй исходные файлы проекта, если задача явно не требует удалить или переименовать их.")', 'appendLine("Сохраняй исходники, если задача не требует удалить/переименовать их.")'),
              ('appendLine("local_archive — служебная упаковка/распаковка внутри работы. local_export — публикация итогового пользовательского результата.")', 'appendLine("local_archive — служебная упаковка/распаковка; local_export — итог пользователю.")'),
              ('appendLine("Если работаешь с проектом/ZIP и меняешь его, после всех нужных изменений и проверок вызови local_export и верни полный итоговый ZIP.")', 'appendLine("Изменил проект/ZIP: после правок и проверок вызови local_export и верни полный итоговый ZIP.")'),
              ('appendLine("Старайся делать local_export последним инструментом соответствующего пользовательского результата. После успешного local_export движок переведёт задачу в READY_TO_FINISH.")', 'appendLine("local_export делай последним для результата; после успеха состояние READY_TO_FINISH.")'),
              ('appendLine("В READY_TO_FINISH обычный следующий шаг — финальный ответ без инструментов. Не перечитывай, не листай и не перепроверяй уже проверенное «на всякий случай».")', 'appendLine("В READY_TO_FINISH обычно сразу финальный ответ без tools; не перечитывай и не перепроверяй уже проверенное.")'),
              ('appendLine("Продолжай после успешного local_export только если исходная задача явно требует следующего этапа или отдельного дополнительного пользовательского результата, либо если позже пришло новое указание пользователя.")', 'appendLine("После local_export продолжай только для явно требуемого следующего этапа/результата или нового указания.")'),
              ('appendLine("Для промежуточного архива, который нужен самой работе и не предназначен пользователю как итоговый файл, используй local_archive, а не local_export.")', 'appendLine("Промежуточный архив: local_archive, не local_export.")'),
              ('appendLine("Дополнительные указания из основного чата могут поступать во время работы. Они переводят задачу обратно в WORKING; учитывай их с ближайшего следующего шага.")', 'appendLine("Новые указания (guidance) из основного чата возвращают задачу в WORKING; учитывай их со следующего шага.")'),
              ('appendLine("В финальном ответе кратко перечисли сделанное и результаты проверок. Финальный итог — обычный текст без вызовов инструментов.")', 'appendLine("Финал: кратко сделанное и проверки; обычный текст без tool-вызовов.")'),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one source match, got {count}: {old[:100]}')
              text = text.replace(old, new)

          old_limit = 'appendLine("За один ответ доступно не более ${knowledgeToolSearchLimit.coerceIn(0, 10)} самостоятельных поисков по базе. Это верхний предел, а не требуемое количество.")'
          new_limit = 'appendLine("knowledge_search: максимум ${knowledgeToolSearchLimit.coerceIn(0, 10)} поисков за ответ; это предел, не цель.")'
          if text.count(old_limit) != 1:
              raise SystemExit('knowledge_search dynamic limit line mismatch')
          text = text.replace(old_limit, new_limit)

          old_turns = 'appendLine("Не повторяй одинаковые действия без причины. Максимум модельных шагов: " + maxTurns + ". Это потолок, а не цель.")'
          new_turns = 'appendLine("Максимум модельных шагов: " + maxTurns + "; это потолок, не цель. Не повторяй действия без причины.")'
          if text.count(old_turns) != 1:
              raise SystemExit('Local Shell dynamic max-turns line mismatch')
          text = text.replace(old_turns, new_turns)

          duplicate = '        if (toolsEnabled) appendLine("У тебя есть локальный инструмент create_file. Используй его только для файлового результата, который явно запрошен пользователем или подключённой инструкцией.")\n'
          if text.count(duplicate) != 1:
              raise SystemExit('duplicate create_file line mismatch')
          text = text.replace(duplicate, '')

          path.write_text(text, encoding='utf-8')
          print(f'Compacted {len(replacements) + 3} direct prompt source rules')
          PY

      - name: Validate no hidden Prompt Diet returned
        shell: bash
        run: |
          set -euo pipefail
          test ! -e app/src/main/java/com/ayuemin/ymnik/PromptDiet.kt
          test ! -e app/src/main/java/com/ayuemin/ymnik/network/ToolDescriptionDiet.kt
          grep -F 'Ты работаешь в Android-приложении Umnik.' app/src/main/java/com/ayuemin/ymnik/ChatViewModel.kt
          grep -F 'knowledge_search: максимум' app/src/main/java/com/ayuemin/ymnik/ChatViewModel.kt
          grep -F 'Максимум модельных шагов:' app/src/main/java/com/ayuemin/ymnik/ChatViewModel.kt

      - name: Commit source-only compaction and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/prompt-source-compact-once.yml
          git add app/src/main/java/com/ayuemin/ymnik/ChatViewModel.kt
          git diff --cached --check
          git commit -m "Compact model prompts directly in source"
          git push origin HEAD:work/local-shell-mvp

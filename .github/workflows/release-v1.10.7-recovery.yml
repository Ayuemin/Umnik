name: Release v1.10.7 Recovery

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/release-v1.10.7-recovery.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout v1.10.7
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: v1.10.7

      - name: Validate version
        shell: bash
        run: |
          set -euo pipefail
          APP_VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          test "$APP_VERSION" = "1.10.7"
          git rev-parse "v1.10.7^{commit}"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Restore permanent signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for value in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!value:-}" ]; then
              echo "Missing GitHub Actions secret: $value"
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/umnik-release.jks"
          keytool -list \
            -keystore "$RUNNER_TEMP/umnik-release.jks" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" >/dev/null

      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest --stacktrace

      - name: Build signed release APK
        env:
          UMNIK_KEYSTORE_PATH: ${{ runner.temp }}/umnik-release.jks
          UMNIK_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          UMNIK_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          UMNIK_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease --stacktrace

      - name: Verify APK signature
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          APK_CERT=$("$APKSIGNER" verify --print-certs "$APK" \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' \
            | head -n1 | tr 'A-F' 'a-f' | tr -d ':')
          KEY_CERT=$(keytool -list -v \
            -keystore "$RUNNER_TEMP/umnik-release.jks" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            | sed -n 's/^[[:space:]]*SHA256: //p' \
            | head -n1 | tr 'A-F' 'a-f' | tr -d ':')
          test -n "$APK_CERT"
          test -n "$KEY_CERT"
          test "$APK_CERT" = "$KEY_CERT"
          echo "SIGNING_CERT_SHA256=$APK_CERT" >> "$GITHUB_ENV"

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/Umnik-v1.10.7.apk
          (cd dist && sha256sum Umnik-v1.10.7.apk > Umnik-v1.10.7.apk.sha256)
          printf '%s\n' "$SIGNING_CERT_SHA256" > dist/Umnik-signing-certificate-sha256.txt
          awk -v ver="v1.10.7" '
            $0 ~ "^## " ver "( |$)" { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > dist/changelog-section.md
          {
            echo "## Umnik v1.10.7"
            echo
            if [ -s dist/changelog-section.md ]; then
              cat dist/changelog-section.md
            else
              echo "Список изменений для этой версии см. в CHANGELOG.md."
            fi
            echo
            echo "### Установка"
            echo
            echo "Скачайте **Umnik-v1.10.7.apk** из Assets."
            echo
            echo "Контрольная сумма SHA-256 приложена отдельным файлом **Umnik-v1.10.7.apk.sha256**."
            echo
            echo "SHA-256 сертификата постоянной подписи: \`${SIGNING_CERT_SHA256}\`."
          } > dist/release-notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.10.7 >/dev/null 2>&1; then
            echo "Release v1.10.7 already exists."
            exit 0
          fi
          gh release create v1.10.7 \
            dist/Umnik-v1.10.7.apk \
            dist/Umnik-v1.10.7.apk.sha256 \
            dist/Umnik-signing-certificate-sha256.txt \
            --verify-tag \
            --title "Umnik v1.10.7" \
            --notes-file dist/release-notes.md \
            --latest

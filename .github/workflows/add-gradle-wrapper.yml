name: One-off Gradle Wrapper generation

on:
  push:
    branches:
      - work/modernize-sdk37
    paths:
      - .github/workflows/add-gradle-wrapper.yml

permissions:
  contents: write

jobs:
  wrapper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/modernize-sdk37
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 15859902
          packages: platform-tools
      - name: Install Android 17 platform
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.1"
      - name: Generate wrapper
        run: |
          gradle wrapper --gradle-version 9.6.1 --distribution-type bin
          ./gradlew wrapper --gradle-version 9.6.1 --distribution-type bin
          ./gradlew --version
      - name: Commit wrapper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradlew gradlew.bat gradle/wrapper
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add Gradle 9.6.1 wrapper"
          git push origin HEAD:work/modernize-sdk37

name: Prepare and publish Umnik v1.0.0

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/release-v1.0.0-once.yml"

permissions:
  contents: write

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v1.0.0 UI polish
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          app = Path("app/src/main/java/com/ayuemin/ymnik/ui/YmnikApp.kt")
          text = app.read_text(encoding="utf-8")
          start = text.index("                if (onBranch != null) {\n                    TextButton(")
          end_marker = "                }\n            }\n        }\n    }\n}\n\nprivate enum class MessagePartKind"
          end = text.index(end_marker, start)
          old_block = text[start:end + len("                }\n")]
          new_block = (
              "                if (onBranch != null) {\n"
              "                    IconButton(\n"
              "                        onClick = onBranch,\n"
              "                        modifier = Modifier.size(34.dp)\n"
              "                    ) {\n"
              "                        Icon(\n"
              "                            painter = painterResource(R.drawable.ic_branch_chat),\n"
              "                            contentDescription = \"Ветка в новом чате\",\n"
              "                            modifier = Modifier.size(19.dp),\n"
              "                            tint = MaterialTheme.colorScheme.onSurfaceVariant\n"
              "                        )\n"
              "                    }\n"
              "                }\n"
          )
          text = text[:start] + new_block + text[start + len(old_block):]
          app.write_text(text, encoding="utf-8")

          vector = Path("app/src/main/res/drawable/ic_branch_chat.xml")
          vector.write_text("\n".join([
              '<?xml version="1.0" encoding="utf-8"?>',
              '<vector xmlns:android="http://schemas.android.com/apk/res/android"',
              '    android:width="24dp"',
              '    android:height="24dp"',
              '    android:viewportWidth="24"',
              '    android:viewportHeight="24">',
              '    <path',
              '        android:fillColor="@android:color/transparent"',
              '        android:strokeColor="#FFFFFFFF"',
              '        android:strokeWidth="1.9"',
              '        android:strokeLineCap="round"',
              '        android:strokeLineJoin="round"',
              '        android:pathData="M4,6 H17 M14,3 L17,6 L14,9 M8,6 C8,11 10.5,15 15,15 H17 M14,12 L17,15 L14,18" />',
              '</vector>',
              ''
          ]), encoding="utf-8")

          gradle = Path("app/build.gradle.kts")
          g = gradle.read_text(encoding="utf-8")
          for old, new in [
              ("// Umnik v0.7.9", "// Umnik v1.0.0"),
              ("versionCode = 26", "versionCode = 27"),
              ('versionName = "0.7.9"', 'versionName = "1.0.0"')
          ]:
              if old not in g:
                  raise SystemExit(f"Missing version marker: {old}")
              g = g.replace(old, new, 1)
          gradle.write_text(g, encoding="utf-8")

          changelog = Path("CHANGELOG.md")
          c = changelog.read_text(encoding="utf-8")
          marker = "## Unreleased\n"
          entry = (
              "## Unreleased\n\n"
              "## v1.0.0 - 2026-09-11\n\n"
              "- Первая стабильная версия Umnik 1.0.0.\n"
              "- Действие «Ветка в новом чате» под ответом модели теперь отображается компактным нейтральным значком без длинной подписи и акцентного цвета.\n"
              "- Сохранена возможность создавать независимую ветку диалога от любого ответа модели.\n"
          )
          if marker not in c:
              raise SystemExit("CHANGELOG marker not found")
          changelog.write_text(c.replace(marker, entry, 1), encoding="utf-8")
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Verify debug build
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Commit release changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/ayuemin/ymnik/ui/YmnikApp.kt app/src/main/res/drawable/ic_branch_chat.xml app/build.gradle.kts CHANGELOG.md
          git commit -m "Release Umnik v1.0.0"
          git push origin HEAD:main

      - name: Create v1.0.0 tag
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --tags origin refs/tags/v1.0.0 | grep -q .; then
            echo "Tag v1.0.0 already exists"
            exit 1
          fi
          git tag -a v1.0.0 -m "Umnik v1.0.0"
          git push origin v1.0.0

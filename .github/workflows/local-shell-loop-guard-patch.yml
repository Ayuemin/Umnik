name: Local Shell Loop Guard Patch

on:
  push:
    branches:
      - "work/local-shell-mvp"

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, '[apply-shell-loop-guard]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: work/local-shell-mvp
          fetch-depth: 0

      - name: Apply patch
        run: python .github/scripts/local_shell_loop_guard_patch.py

      - name: Validate diff
        run: |
          git diff --check
          git diff -- app/src/main/java/com/ayuemin/ymnik/network/LocalShellAgentClient.kt
          git diff -- app/src/main/java/com/ayuemin/ymnik/network/LocalShellLoopGuard.kt
          git diff -- app/src/test/java/com/ayuemin/ymnik/network/LocalShellLoopGuardTest.kt

      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/ayuemin/ymnik/network/LocalShellAgentClient.kt
          git add app/src/main/java/com/ayuemin/ymnik/network/LocalShellLoopGuard.kt
          git add app/src/test/java/com/ayuemin/ymnik/network/LocalShellLoopGuardTest.kt
          git commit -m "Add state-aware Local Shell loop protection"
          git push origin HEAD:work/local-shell-mvp

name: Publish v0.7.7 once

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/tag-v0.7.7-once.yml"

permissions:
  contents: write
  actions: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure release tag exists
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/v0.7.7" >/dev/null; then
            echo "Tag v0.7.7 already exists"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag v0.7.7
            git push origin v0.7.7
          fi

      - name: Dispatch signed release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh workflow run android-release.yml -f tag=v0.7.7

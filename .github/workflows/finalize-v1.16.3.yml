name: Finalize v1.16.3

on:
  push:
    branches:
      - fix/background-navigation-v1.16.3
    paths:
      - ".github/workflows/finalize-v1.16.3.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/background-navigation-v1.16.3
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Apply final isolation patch
        run: python3 .github/scripts/finalize_v1163.py

      - name: Unit tests and debug APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Commit tested final patch
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/finalize-v1.16.3.yml .github/scripts/finalize_v1163.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app CHANGELOG.md
          git commit -m "Bind background requests to their originating chat"
          git push origin HEAD:fix/background-navigation-v1.16.3

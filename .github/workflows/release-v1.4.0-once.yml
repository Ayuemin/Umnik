name: Release Umnik 1.4.0 once

on:
  push:
    paths:
      - ".github/run-release-v1.4.0-b"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Bump version and changelog
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's#// Umnik v1.3.9#// Umnik v1.4.0#' app/build.gradle.kts
          sed -i 's/versionCode = 51/versionCode = 52/' app/build.gradle.kts
          sed -i 's/versionName = "1.3.9"/versionName = "1.4.0"/' app/build.gradle.kts
          printf '%s\n' \
            '## v1.4.0 - 2026-09-12' \
            '' \
            '- NVIDIA text больше не ограничивается белым списком Umnik: каталог берётся из `/v1/models`, а из текстового выбора исключаются только очевидные embedding/rerank/image/audio endpoint-ы.' \
            '- Ошибка NVIDIA 404 больше не удаляет модель на 24 часа. Если hosted endpoint недоступен конкретному аккаунту, Umnik показывает причину, но оставляет модель в каталоге.' \
            '- Добавлена поддержка NVIDIA HTTP 202: приложение извлекает `requestId` и автоматически опрашивает `/v1/status/{requestId}` до готового результата.' \
            '- Для DeepSeek V4 в обычном NVIDIA-чате явно используется `reasoning_effort=none`, чтобы простой запрос не запускал скрытый режим high reasoning по умолчанию.' \
            '- Для NVIDIA vision/multimodal моделей добавлена передача изображений в OpenAI-compatible `image_url` формате.' \
            '- NVIDIA-текст и NVIDIA-генерация изображений запускают foreground service на время активного запроса, чтобы запрос продолжал работать при сворачивании приложения.' \
            '- NVIDIA Image API обновлён под текущие hosted-схемы. В каталоге доступны FLUX.2 Klein 4B, FLUX.1 Schnell и FLUX.1 Dev.' \
            '- Для FLUX.1 Schnell используется `mode=base`, для FLUX.2 Klein — `mode=Image Generation`; параметры разных моделей больше не смешиваются.' \
            '- NVIDIA Image API умеет дожидаться асинхронного HTTP 202 и выполняет один безопасный повтор с минимальной схемой при 400/422.' \
            '- Реестр поставщиков поднят до версии 5 и больше не используется как белый список NVIDIA text-моделей.' \
            '- Версия: 1.4.0 / versionCode 52.' \
            '' > /tmp/v140.txt
          awk 'BEGIN{added=0} {print} $0=="## Unreleased" && !added {print ""; while ((getline line < "/tmp/v140.txt") > 0) print line; close("/tmp/v140.txt"); added=1}' CHANGELOG.md > /tmp/changelog
          mv /tmp/changelog CHANGELOG.md

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Compile debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Commit and tag
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts CHANGELOG.md
          git commit -m "Release Umnik v1.4.0"
          git push origin main
          git tag v1.4.0 HEAD
          git push origin v1.4.0

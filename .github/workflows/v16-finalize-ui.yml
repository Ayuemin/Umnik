name: Finalize Umnik 1.6 UI

on:
  push:
    branches:
      - "feature/openrouter-full-v1.6.0"

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[v16-ui]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/openrouter-full-v1.6.0
          fetch-depth: 0

      - name: Apply final UI integration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Patch point not found: {label} in {path}")
              p.write_text(text.replace(old, new, 1))

          # Batch hub request bus, reused by the ordinary composer without coupling ChatViewModel to UI.
          replace_once(
              'app/src/main/java/com/ayuemin/ymnik/AsyncJobEvents.kt',
              '''internal object AsyncJobEvents {\n    private val mutableSequence = MutableStateFlow(0L)\n    val sequence: StateFlow<Long> = mutableSequence\n\n    fun notifyChanged() {\n        mutableSequence.value = mutableSequence.value + 1L\n    }\n}\n''',
              '''internal object AsyncJobEvents {\n    private val mutableSequence = MutableStateFlow(0L)\n    val sequence: StateFlow<Long> = mutableSequence\n\n    private val mutableHubRequest = MutableStateFlow<String?>(null)\n    val hubRequest: StateFlow<String?> = mutableHubRequest\n\n    fun notifyChanged() {\n        mutableSequence.value = mutableSequence.value + 1L\n    }\n\n    fun requestHub(page: String) {\n        mutableHubRequest.value = page.trim().lowercase().ifBlank { "models" }\n    }\n\n    fun consumeHubRequest() {\n        mutableHubRequest.value = null\n    }\n}\n''',
              'hub request bus'
          )

          # Add currently documented OpenRouter route variants.
          replace_once(
              'app/src/main/java/com/ayuemin/ymnik/model/Models.kt',
              '''enum class ModelVariant {\n    STANDARD,\n    BATCH,\n    FREE,\n    THINKING,\n    EXTENDED,\n    ONLINE\n}\n''',
              '''enum class ModelVariant {\n    STANDARD,\n    BATCH,\n    FREE,\n    THINKING,\n    EXTENDED,\n    ONLINE,\n    NITRO,\n    FLOOR\n}\n''',
              'model variants'
          )

          replace_once(
              'app/src/main/java/com/ayuemin/ymnik/network/OpenRouterCatalogClient.kt',
              '''        "thinking" to ModelVariant.THINKING,\n        "extended" to ModelVariant.EXTENDED,\n        "online" to ModelVariant.ONLINE\n''',
              '''        "thinking" to ModelVariant.THINKING,\n        "extended" to ModelVariant.EXTENDED,\n        "online" to ModelVariant.ONLINE,\n        "nitro" to ModelVariant.NITRO,\n        "floor" to ModelVariant.FLOOR\n''',
              'catalog variants'
          )

          # Open the Hub directly on Batch when the composer requests it.
          replace_once(
              'app/src/main/java/com/ayuemin/ymnik/ui/OpenRouterHub.kt',
              '''    var open by remember { mutableStateOf(false) }\n    val asyncSequence by AsyncJobEvents.sequence.collectAsState()\n''',
              '''    var open by remember { mutableStateOf(false) }\n    var requestedPage by remember { mutableStateOf(HubPage.MODELS) }\n    val asyncSequence by AsyncJobEvents.sequence.collectAsState()\n    val hubRequest by AsyncJobEvents.hubRequest.collectAsState()\n''',
              'root hub state'
          )

          replace_once(
              'app/src/main/java/com/ayuemin/ymnik/ui/OpenRouterHub.kt',
              '''    LaunchedEffect(asyncSequence) {\n        if (asyncSequence <= 0L) return@LaunchedEffect\n        repeat(120) {\n            val state = viewModel.state.value\n            if (!state.isLoading && state.pendingAttachments.isEmpty()) {\n                viewModel.switchChat(state.currentChatId)\n                controller.refreshJobs()\n                return@LaunchedEffect\n            }\n            delay(1_000L)\n        }\n    }\n\n    MaterialTheme {\n''',
              '''    LaunchedEffect(asyncSequence) {\n        if (asyncSequence <= 0L) return@LaunchedEffect\n        repeat(120) {\n            val state = viewModel.state.value\n            if (!state.isLoading && state.pendingAttachments.isEmpty()) {\n                viewModel.switchChat(state.currentChatId)\n                controller.refreshJobs()\n                return@LaunchedEffect\n            }\n            delay(1_000L)\n        }\n    }\n\n    LaunchedEffect(hubRequest) {\n        when (hubRequest) {\n            "jobs", "batch" -> {\n                requestedPage = HubPage.JOBS\n                controller.refreshJobs()\n                open = true\n                AsyncJobEvents.consumeHubRequest()\n            }\n            "models" -> {\n                requestedPage = HubPage.MODELS\n                open = true\n                AsyncJobEvents.consumeHubRequest()\n            }\n        }\n    }\n\n    MaterialTheme {\n''',
              'hub request collector'
          )

          replace_once(
              'app/src/main/java/com/ayuemin/ymnik/ui/OpenRouterHub.kt',
              '''            SmallFloatingActionButton(\n                onClick = { open = true; controller.refreshJobs() },\n''',
              '''            SmallFloatingActionButton(\n                onClick = { requestedPage = HubPage.MODELS; open = true; controller.refreshJobs() },\n''',
              'hub fab default page'
          )

          replace_once(
              'app/src/main/java/com/ayuemin/ymnik/ui/OpenRouterHub.kt',
              '''        if (open) {\n            OpenRouterHubDialog(controller = controller, viewModel = viewModel, onDismiss = { open = false })\n        }\n''',
              '''        if (open) {\n            OpenRouterHubDialog(controller = controller, viewModel = viewModel, initialPage = requestedPage, onDismiss = { open = false })\n        }\n''',
              'hub dialog call'
          )

          replace_once(
              'app/src/main/java/com/ayuemin/ymnik/ui/OpenRouterHub.kt',
              '''private fun OpenRouterHubDialog(\n    controller: OpenRouterHubController,\n    viewModel: ChatViewModel,\n    onDismiss: () -> Unit\n) {\n    val state by controller.state.collectAsState()\n    var page by remember { mutableStateOf(HubPage.MODELS) }\n''',
              '''private fun OpenRouterHubDialog(\n    controller: OpenRouterHubController,\n    viewModel: ChatViewModel,\n    initialPage: HubPage,\n    onDismiss: () -> Unit\n) {\n    val state by controller.state.collectAsState()\n    var page by remember(initialPage) { mutableStateOf(initialPage) }\n''',
              'hub initial page'
          )

          replace_once(
              'app/src/main/java/com/ayuemin/ymnik/ui/OpenRouterHub.kt',
              '''            items(listOf(ModelVariant.BATCH, ModelVariant.FREE, ModelVariant.THINKING, ModelVariant.EXTENDED, ModelVariant.ONLINE)) { item ->\n''',
              '''            items(listOf(ModelVariant.BATCH, ModelVariant.FREE, ModelVariant.THINKING, ModelVariant.EXTENDED, ModelVariant.ONLINE, ModelVariant.NITRO, ModelVariant.FLOOR)) { item ->\n''',
              'hub variant chips'
          )

          replace_once(
              'app/src/main/java/com/ayuemin/ymnik/ui/OpenRouterHub.kt',
              '''    ModelVariant.ONLINE -> "Online"\n}\n''',
              '''    ModelVariant.ONLINE -> "Online"\n    ModelVariant.NITRO -> "Nitro"\n    ModelVariant.FLOOR -> "Floor"\n}\n''',
              'hub variant labels'
          )

          # Add Batch to the existing + menu. It is deliberately disabled for non-Batch models.
          path = Path('app/src/main/java/com/ayuemin/ymnik/ui/YmnikApp.kt')
          text = path.read_text()
          marker = '''                    ComposerActionTile(\n                        icon = Icons.Outlined.Image,\n                        label = "Создать",\n                        enabled = !state.isLoading && imageConnectionAvailable,\n                        modifier = Modifier.weight(1f),\n                        onClick = {\n                            actionsOpen = false\n                            if (vm.prepareImageGeneration()) imagePromptMode = true\n                        }\n                    )\n'''
          if marker not in text:
              raise SystemExit('Patch point not found: composer image action')
          addition = marker + '''                    ComposerActionTile(\n                        icon = Icons.Outlined.SwapHoriz,\n                        label = "Batch",\n                        enabled = !state.isLoading && !imagePromptMode && (state.currentChatTextModel ?: state.textModel).endsWith(":batch", ignoreCase = true),\n                        modifier = Modifier.weight(1f),\n                        onClick = {\n                            actionsOpen = false\n                            com.ayuemin.ymnik.AsyncJobEvents.requestHub("jobs")\n                        }\n                    )\n'''
          path.write_text(text.replace(marker, addition, 1))

          # Extend the parser unit test so these route aliases don't regress.
          test = Path('app/src/test/java/com/ayuemin/ymnik/network/OpenRouterModelCatalogTest.kt')
          text = test.read_text()
          anchor = '''    @Test\n    fun `variants are inferred from model id`() {\n'''
          if anchor in text and 'ModelVariant.NITRO' not in text:
              insert_at = text.rfind('}')
              extra = '''\n    @Test\n    fun `nitro and floor variants are inferred from model id`() {\n        assertTrue(ModelVariant.NITRO in OpenRouterModelCatalog.variants("openai/gpt-5:nitro"))\n        assertTrue(ModelVariant.FLOOR in OpenRouterModelCatalog.variants("openai/gpt-5:floor"))\n    }\n'''
              text = text[:insert_at] + extra + text[insert_at:]
              test.write_text(text)
          PY

          git diff --check
          git status --short

      - name: Commit final UI integration
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "Ayuemin"
          git config user.email "105455063+Ayuemin@users.noreply.github.com"
          git add app/src/main/java app/src/test/java
          git commit -m "feat: finalize OpenRouter Hub and Batch composer [v16-ui]"
          git push origin HEAD:feature/openrouter-full-v1.6.0

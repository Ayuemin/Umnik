name: Publish v1.16.1

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v1.16.1.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Android Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run android-release.yml --repo "$GITHUB_REPOSITORY" -f tag=v1.16.1

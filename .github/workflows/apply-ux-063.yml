name: Apply Umnik 0.6.3 patch

on:
  push:
    branches: [ "main" ]
    paths:
      - "scripts/patch_063.py"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        run: python3 scripts/patch_063.py

      - name: Commit app changes
        run: |
          if git diff --quiet -- app; then
            echo "No app changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app
          git commit -m "Make Umnik controls model-capability aware"
          git push

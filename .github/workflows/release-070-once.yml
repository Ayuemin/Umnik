name: Release v0.7.0 signing baseline

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/release-070-once.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify version
        shell: bash
        run: |
          set -euo pipefail
          APP_VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          test "$APP_VERSION" = "0.7.0"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Restore permanent signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for value in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!value:-}" ]; then
              echo "Missing GitHub Actions secret: $value"
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/umnik-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/umnik-release.jks" \
            -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

      - name: Build signed APK
        env:
          UMNIK_KEYSTORE_PATH: ${{ runner.temp }}/umnik-release.jks
          UMNIK_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          UMNIK_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          UMNIK_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease --stacktrace

      - name: Verify APK signature
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          "$APKSIGNER" verify --verbose --print-certs "$APK"

          APK_CERT=$("$APKSIGNER" verify --print-certs "$APK" \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' \
            | head -n1 | tr 'A-F' 'a-f' | tr -d ':')

          KEY_CERT=$(keytool -list -v \
            -keystore "$RUNNER_TEMP/umnik-release.jks" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            | sed -n 's/^[[:space:]]*SHA256: //p' \
            | head -n1 | tr 'A-F' 'a-f' | tr -d ':')

          test -n "$APK_CERT"
          test -n "$KEY_CERT"
          if [ "$APK_CERT" != "$KEY_CERT" ]; then
            echo "APK signing certificate does not match the permanent keystore."
            exit 1
          fi

          echo "SIGNING_CERT_SHA256=$APK_CERT" >> "$GITHUB_ENV"

      - name: Prepare release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/Umnik-v0.7.0.apk
          (
            cd dist
            sha256sum Umnik-v0.7.0.apk > Umnik-v0.7.0.apk.sha256
          )
          printf '%s\n' "$SIGNING_CERT_SHA256" > dist/Umnik-signing-certificate-sha256.txt

          cat > dist/release-notes.md <<EOF
          ## Umnik v0.7.0 — Permanent Signing Baseline

          Эта версия открывает постоянную ветку подписи Umnik. APK собран GitHub Actions с отдельным release keystore и после сборки автоматически проверен через Android apksigner.

          ### Главное

          - введена постоянная release-подпись приложения;
          - APK проверяется после сборки;
          - сертификат APK сверяется с постоянным release keystore;
          - опубликована SHA-256 контрольная сумма APK;
          - опубликован SHA-256 отпечаток сертификата подписи.

          ### Важно при переходе с v0.6.x

          Старые preview-сборки v0.6.x были подписаны временным тестовым ключом. Android может потребовать удалить установленную v0.6.x перед установкой v0.7.0.

          **Начиная с v0.7.0 этот ключ становится постоянным.** Следующие версии Umnik, подписанные тем же ключом, должны устанавливаться поверх v0.7.0 обычным обновлением.

          ### Установка

          Скачайте **Umnik-v0.7.0.apk** из Assets и установите его на Android 8.0 или новее.

          ### Проверка

          - SHA-256 APK: отдельный asset `Umnik-v0.7.0.apk.sha256`.
          - SHA-256 сертификата подписи: `$SIGNING_CERT_SHA256`.

          Проект создан Александром (Ayuemin) в соавторстве с ChatGPT от OpenAI.
          EOF

      - name: Create tag
        shell: bash
        run: |
          set -euo pipefail
          if git rev-parse "v0.7.0" >/dev/null 2>&1; then
            echo "Tag v0.7.0 already exists."
            exit 1
          fi
          git tag -a v0.7.0 "$GITHUB_SHA" -m "Umnik v0.7.0 - permanent signing baseline"
          git push origin v0.7.0

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create v0.7.0 \
            dist/Umnik-v0.7.0.apk \
            dist/Umnik-v0.7.0.apk.sha256 \
            dist/Umnik-signing-certificate-sha256.txt \
            --verify-tag \
            --title "Umnik v0.7.0 — Permanent Signing Baseline" \
            --notes-file dist/release-notes.md \
            --latest

name: Server CI

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - "server/**"
      - ".github/workflows/server-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate shell installer
        run: bash -n server/install.sh

      - name: Compile Python server
        run: python -m py_compile server/app/main.py

      - name: Install server dependencies
        run: pip install -r server/requirements.txt

      - name: Import FastAPI app
        env:
          OPENROUTER_API_KEY: test-key
          UMNIK_SERVER_TOKEN: test-token
          UMNIK_DATA_DIR: ${{ runner.temp }}/umnik-server-test
        run: python -c 'from server.app.main import app; assert app.title'

      - name: Validate Docker Compose
        working-directory: server
        env:
          OPENROUTER_API_KEY: test-key
          UMNIK_SERVER_TOKEN: test-token
        run: docker compose config --quiet

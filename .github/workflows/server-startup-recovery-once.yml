name: Wire server startup recovery once

on:
  push:
    branches:
      - "test/server-mode-v1.18"
    paths:
      - ".github/workflows/server-startup-recovery-once.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: test/server-mode-v1.18
          fetch-depth: 0
      - name: Patch startup recovery
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("app/src/main/java/com/ayuemin/ymnik/RequestExecutionManager.kt")
          text = path.read_text()
          if "import com.ayuemin.ymnik.network.ServerJobRecoveryStore" not in text:
              text = text.replace("import com.ayuemin.ymnik.network.OpenRouterRecoveryStore\n", "import com.ayuemin.ymnik.network.OpenRouterRecoveryStore\nimport com.ayuemin.ymnik.network.ServerJobRecoveryStore\n", 1)
          old = "        val recoveryStore = OpenRouterRecoveryStore(app)\n        var batchCount = 0\n        var recoveryCount = 0\n        var interruptedCount = 0\n"
          new = "        val recoveryStore = OpenRouterRecoveryStore(app)\n        val serverRecoveryStore = ServerJobRecoveryStore(app)\n        var batchCount = 0\n        var recoveryCount = 0\n        var serverRecoveryCount = 0\n        var interruptedCount = 0\n"
          if "val serverRecoveryStore = ServerJobRecoveryStore(app)" not in text:
              assert old in text
              text = text.replace(old, new, 1)
          anchor = "            if (messageId != null && recoveryStore.get(saved.requestId) != null) {\n                recoveryCount += 1\n                OpenRouterRecoveryWorker.schedule(app, saved.requestId, initialDelaySeconds = 0L, replaceExisting = true, expedited = true)\n                return@forEach\n            }\n\n"
          insert = "            if (messageId != null && serverRecoveryStore.get(saved.requestId) != null) {\n                serverRecoveryCount += 1\n                ServerJobRecoveryWorker.schedule(app, saved.requestId, initialDelaySeconds = 0L, replace = true)\n                return@forEach\n            }\n\n" + anchor
          if "serverRecoveryCount += 1" not in text:
              assert anchor in text
              text = text.replace(anchor, insert, 1)
          old_status = "            if (recoveryCount > 0) add(\"$recoveryCount запрос(а) восстанавливаются в фоне после перезапуска приложения.\")\n            if (batchCount > 0) add(\"$batchCount batch-запрос(а) продолжаются на OpenRouter и будут получены автоматически.\")\n"
          new_status = "            if (recoveryCount > 0) add(\"$recoveryCount запрос(а) восстанавливаются в фоне после перезапуска приложения.\")\n            if (serverRecoveryCount > 0) add(\"$serverRecoveryCount серверных запрос(а) продолжаются на VPS и будут получены автоматически.\")\n            if (batchCount > 0) add(\"$batchCount batch-запрос(а) продолжаются на OpenRouter и будут получены автоматически.\")\n"
          if "$serverRecoveryCount серверных" not in text:
              assert old_status in text
              text = text.replace(old_status, new_status, 1)
          path.write_text(text)
          Path(".github/workflows/server-startup-recovery-once.yml").unlink()
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Recognize server jobs during startup recovery"
          git push origin HEAD:test/server-mode-v1.18

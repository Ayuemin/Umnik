name: Apply v1.10.6

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/apply-v1.10.6.yml"

permissions:
  contents: write

jobs:
  apply-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Apply v1.10.6 source migration
        run: python3 tools/patch_v1_10_6.py

      - name: Verify intended changes
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionName = "1.10.6"' app/build.gradle.kts
          grep -q 'openRouterSpeechVoice' app/src/main/java/com/ayuemin/ymnik/model/Models.kt
          grep -q 'reply-speech' app/src/main/java/com/ayuemin/ymnik/ui/OpenRouterHub.kt
          grep -q 'Озвучивание текста и документов' app/src/main/java/com/ayuemin/ymnik/ui/YmnikApp.kt
          grep -q 'replyVoice' app/src/main/java/com/ayuemin/ymnik/ui/OpenRouterSpeechPlayer.kt

      - name: Unit tests and debug APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Commit verified source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts CHANGELOG.md \
            app/src/main/java/com/ayuemin/ymnik/model/Models.kt \
            app/src/main/java/com/ayuemin/ymnik/ChatViewModel.kt \
            app/src/main/java/com/ayuemin/ymnik/ui/OpenRouterSpeechPlayer.kt \
            app/src/main/java/com/ayuemin/ymnik/ui/OpenRouterHubController.kt \
            app/src/main/java/com/ayuemin/ymnik/ui/OpenRouterHub.kt \
            app/src/main/java/com/ayuemin/ymnik/ui/YmnikApp.kt \
            app/src/main/java/com/ayuemin/ymnik/help/UmnikUsageGuide.kt
          git commit -m "release: prepare Umnik v1.10.6"
          git push origin HEAD:main
          git tag -a v1.10.6 -m "Umnik v1.10.6"
          git push origin v1.10.6

      - name: Restore permanent signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for value in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!value:-}" ]; then
              echo "Missing GitHub Actions secret: $value"
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/umnik-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/umnik-release.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

      - name: Build signed release APK
        env:
          UMNIK_KEYSTORE_PATH: ${{ runner.temp }}/umnik-release.jks
          UMNIK_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          UMNIK_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          UMNIK_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease --stacktrace

      - name: Verify APK signature
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          APK_CERT=$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1 | tr 'A-F' 'a-f' | tr -d ':')
          KEY_CERT=$(keytool -list -v -keystore "$RUNNER_TEMP/umnik-release.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" | sed -n 's/^[[:space:]]*SHA256: //p' | head -n1 | tr 'A-F' 'a-f' | tr -d ':')
          test -n "$APK_CERT"
          test "$APK_CERT" = "$KEY_CERT"
          echo "SIGNING_CERT_SHA256=$APK_CERT" >> "$GITHUB_ENV"

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/Umnik-v1.10.6.apk
          (cd dist && sha256sum Umnik-v1.10.6.apk > Umnik-v1.10.6.apk.sha256)
          printf '%s\n' "$SIGNING_CERT_SHA256" > dist/Umnik-signing-certificate-sha256.txt
          awk '
            /^## v1\.10\.6( |$)/ { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > dist/changelog-section.md
          {
            echo "## Umnik v1.10.6"
            echo
            cat dist/changelog-section.md
            echo
            echo "### Установка"
            echo
            echo "Скачайте **Umnik-v1.10.6.apk** из Assets."
            echo
            echo "SHA-256 APK приложен отдельным файлом."
          } > dist/release-notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.10.6 \
            dist/Umnik-v1.10.6.apk \
            dist/Umnik-v1.10.6.apk.sha256 \
            dist/Umnik-signing-certificate-sha256.txt \
            --verify-tag \
            --title "Umnik v1.10.6" \
            --notes-file dist/release-notes.md \
            --latest

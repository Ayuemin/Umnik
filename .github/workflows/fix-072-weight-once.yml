name: Fix Umnik 0.7.2 weight import once

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/fix-072-weight-once.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove invalid explicit weight import
        run: sed -i '/^import androidx\.compose\.foundation\.layout\.weight$/d' app/src/main/java/com/ayuemin/ymnik/ui/ProjectDialogs.kt
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/ayuemin/ymnik/ui/ProjectDialogs.kt
          git commit -m "Fix Compose layout import"
          git push origin main

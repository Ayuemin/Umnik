name: Build and release v1.7.0 once

on:
  push:
    branches: [main]
    paths: [".github/workflows/release-v1.7.0-once.yml"]

permissions:
  contents: write
  actions: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Apply v1.7.0 UX changes
        run: python3 tools/patch_v1_7_0.py

      - name: Verify migration
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionCode = 70' app/build.gradle.kts
          grep -q 'versionName = "1.7.0"' app/build.gradle.kts
          grep -q 'requestHub("stt")' app/src/main/java/com/ayuemin/ymnik/ui/YmnikApp.kt
          grep -q 'requestHub("models-settings")' app/src/main/java/com/ayuemin/ymnik/ui/YmnikApp.kt
          grep -q 'Расшифровка готова и добавлена в чат' app/src/main/java/com/ayuemin/ymnik/ui/OpenRouterHubController.kt
          grep -q 'Аудио создано и добавлено в чат' app/src/main/java/com/ayuemin/ymnik/ui/OpenRouterHubController.kt

      - name: Unit tests and debug build
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Commit tested changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: redesign OpenRouter workflow UX for v1.7.0"
          git push origin HEAD:main
          echo "RELEASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Create v1.7.0 tag and start signed release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref='refs/tags/v1.7.0' \
            -f sha="$RELEASE_SHA"
          gh workflow run android-release.yml --repo "$GITHUB_REPOSITORY" --ref main -f tag=v1.7.0

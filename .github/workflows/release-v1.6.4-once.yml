name: Release v1.6.4 once

on:
  push:
    branches: [main]
    paths: [".github/workflows/release-v1.6.4-once.yml"]

permissions:
  contents: write
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Create v1.6.4 tag and start signed release
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: f58eea9bb55a48d5bf8c0ada882c00053bec3284
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref='refs/tags/v1.6.4' \
            -f sha="$TARGET_SHA"
          gh workflow run android-release.yml --repo "$GITHUB_REPOSITORY" --ref main -f tag=v1.6.4

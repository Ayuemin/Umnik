name: Publish v1.15.1

on:
  push:
    branches: [ "main" ]
    paths: [ ".github/workflows/publish-v1.15.1.yml" ]

permissions:
  contents: write
  actions: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Create v1.15.1 tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref='refs/tags/v1.15.1' \
            -f sha='5103869c453c31a61d6e09ccf2bc6519addb868c'

      - name: Dispatch Android Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/android-release.yml/dispatches" \
            -f ref='main' \
            -f 'inputs[tag]=v1.15.1'

name: Clean merged technical branches

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cleanup-merged-branches.yml"

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged technical branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for branch in "release/v1.16.1-publisher" "fix/background-request-v1.16.2"; do
            ref="repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
            if gh api "$ref" >/dev/null 2>&1; then
              gh api --method DELETE "$ref"
              echo "Deleted $branch"
            else
              echo "Already absent: $branch"
            fi
          done

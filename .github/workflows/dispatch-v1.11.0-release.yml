name: Dispatch Umnik v1.11.0 release

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/dispatch-v1.11.0-release.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch signed Android release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 5
          gh workflow run android-release.yml --repo Ayuemin/Umnik --ref main -f tag=v1.11.0

name: Publish v1.16.2

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-v1.16.2.yml"

permissions:
  contents: write
  actions: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Create clean release tag and dispatch release
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: 85699f89c2e60c81b880d92bcbf15a8722127074
          TAG: v1.16.2
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            EXISTING=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --jq '.object.sha')
            test "$EXISTING" = "$TARGET_SHA"
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${TAG}" \
              -f sha="$TARGET_SHA"
          fi
          gh workflow run android-release.yml --repo "$GITHUB_REPOSITORY" -f tag="$TAG"

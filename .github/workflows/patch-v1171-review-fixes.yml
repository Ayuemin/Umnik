name: Patch v1.17.1 review fixes

on:
  push:
    paths:
      - '.github/workflows/patch-v1171-review-fixes.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: fix/background-recovery-v1.17.1
          fetch-depth: 0
      - name: Apply review fixes
        run: python3 .github/scripts/apply_v1171_review_fixes.py
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Unit tests and debug APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Verify recovery safety wiring
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'captureFinalRecoveryPayload(prepared)' app/src/main/java/com/ayuemin/ymnik/network/OpenRouterClient.kt
          grep -q 'fun updatePayload' app/src/main/java/com/ayuemin/ymnik/network/OpenRouterRecoveryStore.kt
          grep -q 'OpenRouter response cache replay was not a HIT' app/src/main/java/com/ayuemin/ymnik/OpenRouterRecoveryWorker.kt
          grep -q 'CACHE_REPLAY_MAX_AGE_MS = 240_000L' app/src/main/java/com/ayuemin/ymnik/OpenRouterRecoveryWorker.kt
      - name: Commit verified review fixes and remove scaffolding
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/scripts/apply_v1171_review_fixes.py .github/workflows/patch-v1171-review-fixes.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Harden OpenRouter recovery replay safety'
          git push origin HEAD:fix/background-recovery-v1.17.1

name: Dispatch Umnik v1.12.0 Release

on:
  push:
    branches: [ "main" ]
    paths: [ ".github/workflows/dispatch-v1.12.0-release.yml" ]

permissions:
  contents: write
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Create v1.12.0 tag on tested release commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh api "repos/${{ github.repository }}/git/ref/tags/v1.12.0" >/dev/null 2>&1; then
            echo "v1.12.0 already exists"
          else
            gh api --method POST "repos/${{ github.repository }}/git/refs" \
              -f ref='refs/tags/v1.12.0' \
              -f sha='d108a9f76e7cae775eebb4e740ea0c894ac4565c'
          fi
      - name: Dispatch signed Android release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run android-release.yml --repo "${{ github.repository }}" -f tag=v1.12.0
      - name: Remove temporary dispatcher
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          file_sha=$(gh api "repos/${{ github.repository }}/contents/.github/workflows/dispatch-v1.12.0-release.yml?ref=main" --jq .sha)
          gh api --method DELETE "repos/${{ github.repository }}/contents/.github/workflows/dispatch-v1.12.0-release.yml" \
            -f message='Remove temporary v1.12.0 release dispatcher' \
            -f sha="$file_sha" \
            -f branch='main'

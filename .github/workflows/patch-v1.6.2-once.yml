name: Apply v1.6.2 pricing fix once

on:
  push:
    branches: ["fix/v1.6.2-price-context"]
    paths: [".github/workflows/patch-v1.6.2-once.yml"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v1.6.2-price-context
          fetch-depth: 0
      - name: Apply pricing and context-menu fixes
        run: |
          set -euo pipefail
          python3 tools/patch_v162.py
          git config user.name "Ayuemin"
          git config user.email "105455063+Ayuemin@users.noreply.github.com"
          git add -A
          git commit -m "Fix modality-aware pricing and model menu for v1.6.2"
          git push origin HEAD:fix/v1.6.2-price-context

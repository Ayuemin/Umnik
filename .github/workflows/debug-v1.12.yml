name: Debug Umnik v1.12 compile

on:
  push:
    branches: [ "feature/chat-profiles-orchestrator-v1.12.0" ]
    paths-ignore:
      - ".github/debug-v1.12.log"

permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/chat-profiles-orchestrator-v1.12.0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Capture compile log
        id: compile
        shell: bash
        run: |
          set +e
          gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug --stacktrace > .github/debug-v1.12.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Commit log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/debug-v1.12.log
          git commit -m "[debug-log] Capture v1.12 compile output" || true
          git push origin HEAD:feature/chat-profiles-orchestrator-v1.12.0
      - name: Fail if compile failed
        if: steps.compile.outputs.exit_code != '0'
        run: exit 1

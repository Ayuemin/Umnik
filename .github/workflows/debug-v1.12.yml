name: Debug Umnik v1.12 compile

on:
  push:
    branches: [ "feature/chat-profiles-orchestrator-v1.12.0" ]
    paths-ignore:
      - ".github/debug-v1.12.log"
      - ".github/brace-report.txt"

permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/chat-profiles-orchestrator-v1.12.0
      - name: Repair and harden v1.12 source
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('app/src/main/java/com/ayuemin/ymnik/ChatViewModel.kt')
          s=p.read_text()
          duplicate='    fun refreshModels(mode: ChatMode) {\n    fun refreshModels(mode: ChatMode) {\n'
          if duplicate in s:
              s=s.replace(duplicate, '    fun refreshModels(mode: ChatMode) {\n', 1)

          old='''    private fun runtimeProfile(chat: ChatSession): ProjectChatRuntimeProfile =
        projectAutomation.profile(chat.id) ?: defaultRuntimeProfile(chat).also { projectAutomation.saveProfile(chat.id, it) }
'''
          new='''    private fun runtimeProfile(chat: ChatSession): ProjectChatRuntimeProfile {
        val stored = projectAutomation.profile(chat.id) ?: defaultRuntimeProfile(chat)
        val allowedSkills = chat.projectId
            ?.let { projectId -> _state.value.projects.firstOrNull { it.id == projectId }?.skillIds }
            .orEmpty()
        val clean = stored.copy(skillIds = stored.skillIds.intersect(allowedSkills))
        if (projectAutomation.profile(chat.id) != clean) {
            projectAutomation.saveProfile(chat.id, clean)
            prefs.edit().putStringSet(chatSkillsKey(chat.id), clean.skillIds).apply()
        }
        return clean
    }
'''
          if old in s:
              s=s.replace(old,new,1)

          old='''        val clean = profile.copy(modelId = profile.modelId?.trim()?.takeIf { it.isNotBlank() } ?: _state.value.textModel)
'''
          new='''        val allowedSkills = chat.projectId
            ?.let { projectId -> _state.value.projects.firstOrNull { it.id == projectId }?.skillIds }
            .orEmpty()
        val clean = profile.copy(
            modelId = profile.modelId?.trim()?.takeIf { it.isNotBlank() } ?: _state.value.textModel,
            skillIds = profile.skillIds.intersect(allowedSkills)
        )
'''
          if old in s:
              s=s.replace(old,new,1)

          old='''                title = title.trim().ifBlank { "Новый чат" },
'''
          new='''                title = if (isOrchestratorChat(id)) {
                    title.trim().removePrefix("◆").trim().ifBlank { "Оркестратор" }
                } else title.trim().ifBlank { "Новый чат" },
'''
          if old in s:
              s=s.replace(old,new,1)

          start=s.find('    fun selectQuickTextModel(modelRef: String) {')
          end=s.find('    fun useDefaultTextModelForChat()', start)
          if start >= 0 and end > start:
              block=s[start:end]
              marker='''        chatsRepository.save(chats)
        prefs.edit()
'''
              replacement='''        chatsRepository.save(chats)
        val selectedChat = chats.firstOrNull { it.id == _state.value.currentChatId }
        if (selectedChat?.projectId != null) {
            updateCurrentProjectRuntime { it.copy(modelId = clean) }
        }
        prefs.edit()
'''
              if marker in block and replacement not in block:
                  block=block.replace(marker,replacement,1)
                  s=s[:start]+block+s[end:]
          p.write_text(s)

          ui=Path('app/src/main/java/com/ayuemin/ymnik/ui/YmnikApp.kt')
          u=ui.read_text()
          if 'Icons.Outlined.PlayArrow' in u and 'import androidx.compose.material.icons.outlined.PlayArrow' not in u:
              marker='import androidx.compose.material.icons.outlined.Psychology\n'
              if marker in u:
                  u=u.replace(marker, marker+'import androidx.compose.material.icons.outlined.PlayArrow\n',1)
          ui.write_text(u)

          e=Path('app/src/main/java/com/ayuemin/ymnik/network/OpenRouterRequestEnhancer.kt')
          x=e.read_text()
          old='''        val serverTools = requestChatId?.let { ProjectAutomationRepository(context).profile(it)?.tools } ?: prefs.tools()
'''
          new='''        val projectChatProfile = requestChatId?.let { ProjectAutomationRepository(context).profile(it) }
        // Project-chat web search is controlled by the dedicated fixed Search setting.
        // Keep the server-tool web-search switch off here so an old/global tool preset
        // cannot silently override a chat where Search was explicitly disabled.
        val serverTools = projectChatProfile?.tools?.copy(webSearch = WebSearchMode.OFF) ?: prefs.tools()
'''
          if old in x:
              x=x.replace(old,new,1)
          e.write_text(x)
          PY
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Analyze Kotlin brace structure
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/ayuemin/ymnik/ChatViewModel.kt')
          s=p.read_text()
          stack=[]; line=1; i=0; state='code'; snapshots=[]
          while i < len(s):
              c=s[i]; n=s[i+1] if i+1<len(s) else ''
              if c=='\n':
                  if line % 100 == 0: snapshots.append((line,len(stack), stack[-5:]))
                  line+=1
              if state=='code':
                  if s.startswith('"""',i): state='triple'; i+=3; continue
                  if c=='"': state='string'
                  elif c=="'": state='char'
                  elif c=='/' and n=='/': state='linecomment'; i+=2; continue
                  elif c=='/' and n=='*': state='blockcomment'; i+=2; continue
                  elif c=='{': stack.append(line)
                  elif c=='}':
                      if stack: stack.pop()
                      else: snapshots.append(('EXTRA_CLOSE',line,[]))
              elif state=='string':
                  if c=='\\': i+=2; continue
                  if c=='"': state='code'
              elif state=='char':
                  if c=='\\': i+=2; continue
                  if c=="'": state='code'
              elif state=='triple':
                  if s.startswith('"""',i): state='code'; i+=3; continue
              elif state=='linecomment':
                  if c=='\n': state='code'
              elif state=='blockcomment':
                  if c=='*' and n=='/': state='code'; i+=2; continue
              i+=1
          out=['final depth='+str(len(stack)), 'unmatched opens='+repr(stack[-30:]), 'state='+state, '', 'snapshots:']
          out += [repr(x) for x in snapshots]
          Path('.github/brace-report.txt').write_text('\n'.join(out)+'\n')
          PY
      - name: Capture compile log
        id: compile
        shell: bash
        run: |
          set +e
          gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug --stacktrace > .github/debug-v1.12.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Commit repair and diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/ayuemin/ymnik/ChatViewModel.kt app/src/main/java/com/ayuemin/ymnik/network/OpenRouterRequestEnhancer.kt app/src/main/java/com/ayuemin/ymnik/ui/YmnikApp.kt .github/debug-v1.12.log .github/brace-report.txt
          git commit -m "Harden v1.12 project chat runtime profiles" || true
          git push origin HEAD:feature/chat-profiles-orchestrator-v1.12.0
      - name: Fail if compile failed
        if: steps.compile.outputs.exit_code != '0'
        run: exit 1

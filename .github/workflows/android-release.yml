name: Build Android APK and release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  VERSION: "0.3.0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build release APK
        run: gradle --no-daemon :app:assembleRelease --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "Umnik-v${VERSION}.apk"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Umnik-v${{ env.VERSION }}
          path: Umnik-v${{ env.VERSION }}.apk

      - name: Recreate GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "v${VERSION}" --cleanup-tag -y || true
          gh release create "v${VERSION}" "Umnik-v${VERSION}.apk" \
            --target "$GITHUB_SHA" \
            --title "Umnik v${VERSION}" \
            --prerelease \
            --notes "Umnik v0.3.0.

          Главное:
          - строгие Material-иконки вместо emoji
          - кнопки ответа: копировать, поделиться, озвучить/стоп, сохранить текст файлом
          - fenced Markdown-блоки отображаются отдельно с собственной кнопкой копирования
          - отдельные быстрые режимы Текст и Изображение
          - выбор модели прямо сверху в чате
          - отдельный список image-моделей OpenRouter
          - генерация изображений через OpenRouter Image API
          - изображения показываются в чате и сохраняются на устройство
          - поддерживаются изображения-референсы для совместимых image-моделей
          - create_file для длинных текстов и файлов сохранён
          - навыки SKILL.md и Android TTS сохранены"

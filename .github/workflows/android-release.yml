name: Build Android APK and release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Ymnik-v0.1.0.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ymnik-v0.1.0
          path: Ymnik-v0.1.0.apk

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0
          target_commitish: ${{ github.sha }}
          name: "Умник v0.1.0"
          body: |
            Первый рабочий релиз Android-приложения «Умник».

            Возможности:
            - OpenRouter чат и выбор модели
            - локальные навыки SKILL.md/папки навыков
            - прикрепление файлов
            - tool calling
            - создание и сохранение файлов через create_file
            - зашифрованное хранение API-ключа
          prerelease: true
          overwrite_files: true
          files: Ymnik-v0.1.0.apk

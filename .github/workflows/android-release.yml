name: Build Android APK and release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  VERSION: "0.2.0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build release APK
        run: gradle --no-daemon :app:assembleRelease --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "Umnik-v${VERSION}.apk"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Umnik-v${{ env.VERSION }}
          path: Umnik-v${{ env.VERSION }}.apk

      - name: Recreate GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "v${VERSION}" --cleanup-tag -y || true
          gh release create "v${VERSION}" "Umnik-v${VERSION}.apk" \
            --target "$GITHUB_SHA" \
            --title "Umnik v${VERSION}" \
            --prerelease \
            --notes "Umnik v0.2.0.

          Главное:
          - исправлен запрос к OpenRouter: X-Title теперь использует корректное ASCII-значение
          - новый applicationId com.ayuemin.umnik
          - интерфейс переработан в стиле Material You
          - динамические цвета Android 12+
          - светлая и тёмная системные темы
          - обновлены карточки сообщений, ввод, навыки и настройки
          - OpenRouter, файлы, SKILL.md, tool calling, create_file и TTS сохранены"

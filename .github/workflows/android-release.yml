name: Android Release

on:
  push:
    branches:
      - "main"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag, for example v0.7.2"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/v') || startsWith(github.event.head_commit.message, 'Release v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Validate version and tag
        shell: bash
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          APP_VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          test -n "$APP_VERSION"

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$DISPATCH_TAG"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v$APP_VERSION"
          fi

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][A-Za-z0-9._-]+)?$ ]]; then
            echo "Invalid release tag: $TAG"
            exit 1
          fi

          VERSION="${TAG#v}"
          if [ "$VERSION" != "$APP_VERSION" ]; then
            echo "Tag version ($VERSION) does not match app version ($APP_VERSION)."
            exit 1
          fi

          git fetch --tags --force
          HEAD_COMMIT=$(git rev-parse HEAD)

          if git rev-parse "$TAG^{commit}" >/dev/null 2>&1; then
            TAG_COMMIT=$(git rev-parse "$TAG^{commit}")
            if [ "$TAG_COMMIT" != "$HEAD_COMMIT" ]; then
              echo "Existing tag $TAG points to $TAG_COMMIT, but release commit is $HEAD_COMMIT."
              exit 1
            fi
          else
            if [ "$GITHUB_EVENT_NAME" != "push" ] || [[ "$GITHUB_REF" != refs/heads/main ]]; then
              echo "Release tag $TAG does not exist."
              exit 1
            fi
            git tag "$TAG" "$HEAD_COMMIT"
            git push origin "$TAG"
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 15859902
          packages: platform-tools

      - name: Install Android 17 platform
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Restore permanent signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for value in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!value:-}" ]; then
              echo "Missing GitHub Actions secret: $value"
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/umnik-release.jks"
          keytool -list \
            -keystore "$RUNNER_TEMP/umnik-release.jks" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" >/dev/null

      - name: Run lint and unit tests
        run: ./gradlew --no-daemon :app:lintDebug :app:testDebugUnitTest --stacktrace

      - name: Build signed release APK
        env:
          UMNIK_KEYSTORE_PATH: ${{ runner.temp }}/umnik-release.jks
          UMNIK_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          UMNIK_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          UMNIK_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease --stacktrace

      - name: Verify APK signature
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/37.0.0/apksigner"

          "$APKSIGNER" verify --verbose --print-certs "$APK"

          APK_CERT=$("$APKSIGNER" verify --print-certs "$APK" \
            | sed -n 's/^.*certificate SHA-256 digest: //p' \
            | head -n1 | tr 'A-F' 'a-f' | tr -d ':')

          KEY_CERT=$(keytool -list -v \
            -keystore "$RUNNER_TEMP/umnik-release.jks" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            | sed -n 's/^[[:space:]]*SHA256: //p' \
            | head -n1 | tr 'A-F' 'a-f' | tr -d ':')

          test -n "$APK_CERT"
          test -n "$KEY_CERT"
          if [ "$APK_CERT" != "$KEY_CERT" ]; then
            echo "APK signing certificate does not match the permanent Umnik release key."
            exit 1
          fi

          echo "SIGNING_CERT_SHA256=$APK_CERT" >> "$GITHUB_ENV"

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/Umnik-v${VERSION}.apk"
          (
            cd dist
            sha256sum "Umnik-v${VERSION}.apk" > "Umnik-v${VERSION}.apk.sha256"
          )
          printf '%s\n' "$SIGNING_CERT_SHA256" > dist/Umnik-signing-certificate-sha256.txt

          awk -v ver="v${VERSION}" '
            $0 ~ "^## " ver "( |$)" { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > dist/changelog-section.md

          {
            echo "## Umnik v${VERSION}"
            echo
            if [ -s dist/changelog-section.md ]; then
              cat dist/changelog-section.md
            else
              echo "Список изменений для этой версии см. в CHANGELOG.md."
            fi
            echo
            echo "### Установка"
            echo
            echo "Скачайте **Umnik-v${VERSION}.apk** из Assets."
            echo
            echo "Контрольная сумма SHA-256 приложена отдельным файлом **Umnik-v${VERSION}.apk.sha256**."
            echo
            echo "SHA-256 сертификата постоянной подписи: \`${SIGNING_CERT_SHA256}\`."
          } > dist/release-notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$VERSION" == *-* ]]; then
            RELEASE_KIND=(--prerelease)
          else
            RELEASE_KIND=(--latest)
          fi
          ASSETS=(
            "dist/Umnik-v${VERSION}.apk"
            "dist/Umnik-v${VERSION}.apk.sha256"
            "dist/Umnik-signing-certificate-sha256.txt"
          )
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${ASSETS[@]}" --clobber
            gh release edit "$RELEASE_TAG" \
              --title "Umnik v${VERSION}" \
              --notes-file dist/release-notes.md \
              "${RELEASE_KIND[@]}"
          else
            gh release create "$RELEASE_TAG" \
              "${ASSETS[@]}" \
              --verify-tag \
              --title "Umnik v${VERSION}" \
              --notes-file dist/release-notes.md \
              "${RELEASE_KIND[@]}"
          fi

name: Build Android APK and release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  VERSION: "0.5.0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build release APK
        run: gradle --no-daemon :app:assembleRelease --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "Umnik-v${VERSION}.apk"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Umnik-v${{ env.VERSION }}
          path: Umnik-v${{ env.VERSION }}.apk

      - name: Recreate GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "v${VERSION}" --cleanup-tag -y || true
          gh release create "v${VERSION}" "Umnik-v${VERSION}.apk" \
            --target "$GITHUB_SHA" \
            --title "Umnik v${VERSION}" \
            --prerelease \
            --notes "Umnik v0.5.0.

          Главное:
          - исправлено поведение интерфейса при открытии клавиатуры: убрано двойное IME-смещение, нижняя навигация скрывается во время ввода
          - добавлены несколько независимых диалогов с кнопкой Чаты в верхней строке
          - можно создавать новый чат, переключаться между диалогами, очищать текущий и удалять отдельные диалоги
          - старая история автоматически переносится в первый диалог
          - история чатов хранится локально в отдельной базе JSON
          - в настройках добавлен встроенный просмотр хранилища Umnik
          - видно объём сгенерированных файлов, экспорта, навыков и истории чатов
          - файлы можно искать по имени, сохранять наружу и удалять по одному
          - массовая очистка удаляет сгенерированные файлы и временный экспорт, не затрагивая API-ключ, тексты диалогов и навыки
          - существующие функции моделей, изображений, SKILL.md, TTS, цветовых схем и изолированных блоков сохранены"

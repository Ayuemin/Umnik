name: Build Android APK and release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build release APK
        run: gradle --no-daemon :app:assembleRelease --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Ymnik-v0.1.0.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ymnik-v0.1.0
          path: Ymnik-v0.1.0.apk

      - name: Recreate GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v0.1.0 --cleanup-tag -y || true
          gh release create v0.1.0 Ymnik-v0.1.0.apk \
            --target "$GITHUB_SHA" \
            --title "Умник v0.1.0" \
            --prerelease \
            --notes "Первый рабочий релиз Android-приложения «Умник».

          Возможности:
          - OpenRouter чат и выбор модели
          - локальные навыки SKILL.md и папки навыков
          - прикрепление файлов
          - tool calling
          - создание и сохранение файлов через create_file
          - зашифрованное хранение API-ключа
          - озвучивание ответов модели через Android Text-to-Speech"

name: Build Android APK and release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  VERSION: "0.6.2"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build release APK
        run: gradle --no-daemon :app:assembleRelease --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "Umnik-v${VERSION}.apk"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Umnik-v${{ env.VERSION }}
          path: Umnik-v${{ env.VERSION }}.apk

      - name: Recreate GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "v${VERSION}" --cleanup-tag -y || true
          gh release create "v${VERSION}" "Umnik-v${VERSION}.apk" \
            --target "$GITHUB_SHA" \
            --title "Umnik v${VERSION}" \
            --prerelease \
            --notes "Umnik v0.6.2.

          Главное:
          - в строке ввода появилась отдельная кнопка камеры: можно сделать полноценное фото и сразу приложить его к запросу
          - фото с камеры хранится временно и удаляется после отправки или удаления вложения
          - под сообщениями пользователя появилась кнопка копирования
          - для текстовых сообщений пользователя появилась кнопка «Спросить ещё раз»
          - в настройках добавлен необязательный короткий профиль пользователя: имя, пол, возраст, род занятий и короткая установка по стилю общения
          - профиль можно полностью выключить, использовать только в проектах или во всех текстовых чатах
          - явный запрос и мастер-инструкции проекта имеют приоритет над профилем
          - проекты, навыки, веб-поиск, reasoning, TTS, генерация изображений и локальное хранилище сохранены"

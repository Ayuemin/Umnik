name: Build Android APK and release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  VERSION: "0.6.1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build release APK
        run: gradle --no-daemon :app:assembleRelease --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "Umnik-v${VERSION}.apk"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Umnik-v${{ env.VERSION }}
          path: Umnik-v${{ env.VERSION }}.apk

      - name: Recreate GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "v${VERSION}" --cleanup-tag -y || true
          gh release create "v${VERSION}" "Umnik-v${VERSION}.apk" \
            --target "$GITHUB_SHA" \
            --title "Umnik v${VERSION}" \
            --prerelease \
            --notes "Umnik v0.6.1.

          Главное:
          - в верхнюю строку добавлена отдельная кнопка создания нового чата; внутри проекта новый чат остаётся в этом проекте
          - каждый чат запоминает свой режим: текст или изображения
          - нажатие на значок текста/изображения теперь только переключает режим и больше не открывает выбор модели
          - выбор текстовой и графической модели перенесён в Настройки
          - в Настройки добавлен выбор силы размышления: minimal, low, medium, high и xhigh
          - выбранный уровень reasoning передаётся OpenRouter для запросов с включённым размышлением
          - очистка и удаление чата больше не удаляют сгенерированные изображения и файлы
          - экспорт текстовых ответов перенесён из временного cache в постоянное локальное хранилище Umnik
          - сгенерированные материалы удаляются только вручную через Хранилище Umnik
          - проекты, избранное, навыки, веб-поиск, TTS и цветовые схемы сохранены"

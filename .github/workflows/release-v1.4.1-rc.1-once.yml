name: Release v1.4.1-rc.1 once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/release-v1.4.1-rc.1-once.yml"

permissions:
  contents: write
  actions: write

jobs:
  dispatch-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create release tag on reviewed merge commit
        env:
          TARGET_SHA: 087fbd8649fff936e12be249cfb1272bd283a342
          RELEASE_TAG: v1.4.1-rc.1
          EXPECTED_VERSION: 1.4.1-rc.1
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          git cat-file -e "${TARGET_SHA}^{commit}"
          APP_VERSION=$(git show "${TARGET_SHA}:app/build.gradle.kts" | sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' | head -n1)
          if [ "$APP_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "Expected version $EXPECTED_VERSION at $TARGET_SHA, found $APP_VERSION"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/${RELEASE_TAG}" >/dev/null; then
            TAG_SHA=$(git rev-list -n1 "$RELEASE_TAG")
            if [ "$TAG_SHA" != "$TARGET_SHA" ]; then
              echo "Tag $RELEASE_TAG already points to $TAG_SHA instead of $TARGET_SHA"
              exit 1
            fi
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "$RELEASE_TAG" "$TARGET_SHA"
            git push origin "refs/tags/$RELEASE_TAG"
          fi

      - name: Dispatch signed Android release workflow
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v1.4.1-rc.1
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run android-release.yml --ref main -f tag="$RELEASE_TAG"

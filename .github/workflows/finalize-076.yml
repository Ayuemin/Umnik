name: Finalize Umnik v0.7.6

on:
  push:
    paths:
      - ".github/workflows/finalize-076.yml"

permissions:
  contents: write
  actions: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionName = "0.7.6"' app/build.gradle.kts
          if git rev-parse -q --verify refs/tags/v0.7.6 >/dev/null; then
            echo "Tag v0.7.6 already exists"
            exit 1
          fi

      - name: Remove temporary workflow and finalize main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/finalize-076.yml
          git add -A
          git commit -m "Finalize Umnik v0.7.6"
          git push origin HEAD:main

      - name: Create release tag
        shell: bash
        run: |
          set -euo pipefail
          git tag v0.7.6
          git push origin v0.7.6

      - name: Dispatch signed release build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run android-release.yml -f tag=v0.7.6

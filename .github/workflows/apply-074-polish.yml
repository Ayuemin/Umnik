name: Apply Umnik 0.7.4 polish patch

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/apply-074-polish.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        run: python3 scripts/patch_074_polish.py

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/ayuemin/ymnik/model/Models.kt \
                  app/src/main/java/com/ayuemin/ymnik/ChatViewModel.kt \
                  app/src/main/java/com/ayuemin/ymnik/ui/YmnikApp.kt \
                  app/build.gradle.kts \
                  CHANGELOG.md
          git diff --cached --check
          git commit -m "Polish chat controls and Markdown tables for 0.7.4"
          git push origin HEAD:main

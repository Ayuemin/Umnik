name: Release v1.10.4 once

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/release-v1.10.4-once.yml"

permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add changelog entry
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("CHANGELOG.md")
          text = p.read_text(encoding="utf-8")
          marker = "## Unreleased\n\n"
          entry = '''## v1.10.4 - 2026-09-14

- Исправлена нейросетевая озвучка ответов через OpenRouter: длинный ответ больше не ждёт загрузки одного большого MP3 целиком. Текст делится на короткие фрагменты, первый запускается сразу после готовности, а следующий готовится параллельно во время воспроизведения.
- Повторное нажатие на кнопку OR теперь действительно отменяет текущий сетевой запрос озвучивания, поэтому старые запросы не продолжают висеть и конкурировать с новым запуском.
- При кратковременном сетевом обрыве отдельный фрагмент озвучки автоматически повторяется один раз. Временные аудиофайлы по-прежнему живут только в кэше и удаляются после воспроизведения или остановки.
- Версия: 1.10.4 / versionCode 104.

'''
          if "## v1.10.4" not in text:
              if marker not in text:
                  raise SystemExit("Unreleased marker not found")
              text = text.replace(marker, marker + entry, 1)
              p.write_text(text, encoding="utf-8")
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Verify version
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionName = "1.10.4"' app/build.gradle.kts
          grep -q 'versionCode = 104' app/build.gradle.kts
          grep -q 'splitForSpeech' app/src/main/java/com/ayuemin/ymnik/ui/OpenRouterSpeechPlayer.kt
          grep -q 'suspendCancellableCoroutine' app/src/main/java/com/ayuemin/ymnik/network/OpenRouterAudioClient.kt

      - name: Unit tests and debug APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Commit changelog
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          if ! git diff --cached --quiet; then
            git commit -m "docs: add v1.10.4 changelog"
            git push origin HEAD:main
          fi
          echo "RELEASE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Tag tested release
        shell: bash
        run: |
          set -euo pipefail
          if git rev-parse v1.10.4 >/dev/null 2>&1; then
            echo "v1.10.4 already exists"
            exit 1
          fi
          git tag -a v1.10.4 -m "Umnik v1.10.4" "$RELEASE_COMMIT"
          git push origin v1.10.4

      - name: Dispatch signed release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run android-release.yml -f tag=v1.10.4

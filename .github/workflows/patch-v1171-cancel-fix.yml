name: Patch v1.17.1 cancel fix

on:
  push:
    paths:
      - '.github/workflows/patch-v1171-cancel-fix.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: fix/background-recovery-v1.17.1
          fetch-depth: 0
      - name: Apply cancellation safety fix
        run: python3 .github/scripts/apply_v1171_cancel_fix.py
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Unit tests and debug APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Verify cancellation wiring
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'OpenRouterRecoveryStore(runtime.appContext).remove(requestId)' app/src/main/java/com/ayuemin/ymnik/RequestExecutionManager.kt
          grep -q 'OpenRouterRecoveryWorker.cancel(runtime.appContext, requestId)' app/src/main/java/com/ayuemin/ymnik/RequestExecutionManager.kt
          grep -q 'Recovered result discarded after manual cancellation' app/src/main/java/com/ayuemin/ymnik/OpenRouterRecoveryWorker.kt
      - name: Commit verified fix and remove scaffolding
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/scripts/apply_v1171_cancel_fix.py .github/workflows/patch-v1171-cancel-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Make background recovery respect manual Stop'
          git push origin HEAD:fix/background-recovery-v1.17.1

name: Dispatch v1.15.0 release

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/dispatch-v1.15-release.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch existing Android Release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/android-release.yml/dispatches" \
            -f ref='main' \
            -f 'inputs[tag]=v1.15.0'

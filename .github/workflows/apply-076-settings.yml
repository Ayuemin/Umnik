name: Apply Umnik 0.7.6 settings polish

on:
  push:
    paths:
      - ".github/workflows/apply-076-settings.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch settings UI and bump version
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          ui_path = Path("app/src/main/java/com/ayuemin/ymnik/ui/YmnikApp.kt")
          text = ui_path.read_text(encoding="utf-8")
          settings_start = text.index("private fun SettingsScreen")

          old_vars = '''    var quickModelsSettingsOpen by remember { mutableStateOf(false) }\n    var reasoningExpanded by remember { mutableStateOf(false) }\n    var soundExpanded by remember { mutableStateOf(false) }\n    var profileExpanded by remember { mutableStateOf(false) }\n    var apiExpanded by remember(state.apiKeyConfigured) { mutableStateOf(!state.apiKeyConfigured) }\n    var customColorExpanded by remember { mutableStateOf(state.themeChoice == ThemeChoice.CUSTOM) }\n'''
          new_vars = '''    var quickModelsSettingsOpen by remember { mutableStateOf(false) }\n    var modelsExpanded by remember { mutableStateOf(false) }\n    var reasoningExpanded by remember { mutableStateOf(false) }\n    var soundExpanded by remember { mutableStateOf(false) }\n    var storageExpanded by remember { mutableStateOf(false) }\n    var profileExpanded by remember { mutableStateOf(false) }\n    var themeExpanded by remember { mutableStateOf(false) }\n    var apiExpanded by remember(state.apiKeyConfigured) { mutableStateOf(!state.apiKeyConfigured) }\n    var customColorText by remember(state.customThemeColor) {\n        mutableStateOf("#%06X".format(state.customThemeColor and 0xFFFFFF))\n    }\n'''
          if old_vars not in text:
              raise SystemExit("settings state block not found")
          text = text.replace(old_vars, new_vars, 1)

          model_start = text.index('            item {\n                ElevatedCard(', settings_start)
          model_end = text.index('            item {\n                ReasoningSettingsCard', model_start)
          model_block = '''            item {
                ExpandableSettingsCard(
                    title = "Модели",
                    subtitle = state.textModel.substringAfterLast('/'),
                    icon = Icons.Outlined.TextFields,
                    expanded = modelsExpanded,
                    onToggle = { modelsExpanded = !modelsExpanded }
                ) {
                    FilledTonalButton(onClick = { modelPicker = ChatMode.TEXT }, modifier = Modifier.fillMaxWidth()) {
                        Icon(Icons.Outlined.TextFields, contentDescription = null)
                        Spacer(Modifier.width(8.dp))
                        Column(Modifier.weight(1f)) {
                            Text("Текстовая по умолчанию", fontWeight = FontWeight.Medium)
                            Text(state.textModel, style = MaterialTheme.typography.bodySmall, maxLines = 1, overflow = TextOverflow.Ellipsis)
                        }
                    }
                    Spacer(Modifier.height(7.dp))
                    FilledTonalButton(onClick = { quickModelsSettingsOpen = true }, modifier = Modifier.fillMaxWidth()) {
                        Icon(Icons.Outlined.SwapHoriz, contentDescription = null)
                        Spacer(Modifier.width(8.dp))
                        Column(Modifier.weight(1f)) {
                            Text("Быстрые модели", fontWeight = FontWeight.Medium)
                            Text(
                                if (state.quickTextModels.isEmpty()) "Только модель по умолчанию" else "Добавлено: ${state.quickTextModels.size}",
                                style = MaterialTheme.typography.bodySmall
                            )
                        }
                    }
                    Spacer(Modifier.height(7.dp))
                    FilledTonalButton(onClick = { modelPicker = ChatMode.IMAGE }, modifier = Modifier.fillMaxWidth()) {
                        Icon(Icons.Outlined.Image, contentDescription = null)
                        Spacer(Modifier.width(8.dp))
                        Column(Modifier.weight(1f)) {
                            Text("Генерация изображений", fontWeight = FontWeight.Medium)
                            Text(state.imageModel, style = MaterialTheme.typography.bodySmall, maxLines = 1, overflow = TextOverflow.Ellipsis)
                        }
                    }
                }
            }

'''
          text = text[:model_start] + model_block + text[model_end:]

          storage_marker = text.index('Text("Хранилище Umnik"', settings_start)
          storage_start = text.rfind('            item {\n                ElevatedCard(', settings_start, storage_marker)
          storage_end = text.index('            item {\n                ExpandableSettingsCard(\n                    title = "Коротко обо мне"', storage_marker)
          storage_block = '''            item {
                ExpandableSettingsCard(
                    title = "Хранилище Umnik",
                    subtitle = "${state.storedFiles.size} файлов · ${humanSize(state.storageStats.totalBytes)}",
                    icon = Icons.Outlined.Storage,
                    expanded = storageExpanded,
                    onToggle = { storageExpanded = !storageExpanded }
                ) {
                    FilledTonalButton(
                        onClick = {
                            vm.refreshStorage()
                            storageOpen = true
                        },
                        modifier = Modifier.fillMaxWidth()
                    ) {
                        Icon(Icons.Outlined.FolderOpen, contentDescription = null)
                        Spacer(Modifier.width(8.dp))
                        Text("Открыть хранилище")
                    }
                }
            }

'''
          text = text[:storage_start] + storage_block + text[storage_end:]

          theme_marker = text.index('Text("Цветовая схема"', settings_start)
          theme_start = text.rfind('            item {\n                ElevatedCard(', settings_start, theme_marker)
          theme_end = text.index('            item {\n                ExpandableSettingsCard(\n                    title = "API-ключ OpenRouter"', theme_marker)
          theme_block = '''            item {
                ExpandableSettingsCard(
                    title = "Цветовая схема",
                    subtitle = if (state.themeChoice == ThemeChoice.CUSTOM) {
                        "Свой цвет · #%06X".format(state.customThemeColor and 0xFFFFFF)
                    } else {
                        themeLabel(state.themeChoice)
                    },
                    icon = Icons.Outlined.Palette,
                    expanded = themeExpanded,
                    onToggle = { themeExpanded = !themeExpanded }
                ) {
                    LazyRow(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                        items(themes) { choice ->
                            FilterChip(
                                selected = state.themeChoice == choice,
                                onClick = { vm.setThemeChoice(choice) },
                                label = { Text(themeLabel(choice)) },
                                leadingIcon = if (choice == ThemeChoice.CUSTOM) {
                                    {
                                        Surface(
                                            shape = CircleShape,
                                            color = Color(state.customThemeColor),
                                            modifier = Modifier.size(14.dp)
                                        ) {}
                                    }
                                } else null
                            )
                        }
                    }
                    if (state.themeChoice == ThemeChoice.CUSTOM) {
                        Spacer(Modifier.height(10.dp))
                        val cleanHex = customColorText.trim().removePrefix("#")
                        val parsedColor = cleanHex
                            .takeIf { value ->
                                value.length == 6 && value.all { ch -> ch.isDigit() || ch.uppercaseChar() in 'A'..'F' }
                            }
                            ?.toLongOrNull(16)
                            ?.let { rgb -> (0xFF000000L or rgb).toInt() }

                        Row(
                            modifier = Modifier.fillMaxWidth(),
                            verticalAlignment = Alignment.CenterVertically,
                            horizontalArrangement = Arrangement.spacedBy(10.dp)
                        ) {
                            Surface(
                                shape = CircleShape,
                                color = Color(parsedColor ?: state.customThemeColor),
                                modifier = Modifier.size(38.dp)
                            ) {}
                            OutlinedTextField(
                                value = customColorText,
                                onValueChange = { customColorText = it.trim().uppercase().take(7) },
                                modifier = Modifier.weight(1f),
                                label = { Text("HEX-код") },
                                placeholder = { Text("#6750A4") },
                                singleLine = true,
                                isError = customColorText.isNotBlank() && parsedColor == null
                            )
                        }
                        Spacer(Modifier.height(8.dp))
                        FilledTonalButton(
                            onClick = { parsedColor?.let(vm::setCustomThemeColor) },
                            enabled = parsedColor != null,
                            modifier = Modifier.fillMaxWidth()
                        ) {
                            Icon(Icons.Outlined.Check, contentDescription = null)
                            Spacer(Modifier.width(7.dp))
                            Text("Применить цвет")
                        }
                        Text(
                            "Введите стандартный HEX-код цвета, например #1E88E5.",
                            style = MaterialTheme.typography.bodySmall,
                            color = MaterialTheme.colorScheme.onSurfaceVariant,
                            modifier = Modifier.padding(top = 6.dp)
                        )
                    }
                }
            }

'''
          text = text[:theme_start] + theme_block + text[theme_end:]
          ui_path.write_text(text, encoding="utf-8")

          gradle = Path("app/build.gradle.kts")
          g = gradle.read_text(encoding="utf-8")
          g = g.replace("// Umnik v0.7.5", "// Umnik v0.7.6", 1)
          g = g.replace('versionCode = 22', 'versionCode = 23', 1)
          g = g.replace('versionName = "0.7.5"', 'versionName = "0.7.6"', 1)
          gradle.write_text(g, encoding="utf-8")

          changelog = Path("CHANGELOG.md")
          c = changelog.read_text(encoding="utf-8")
          needle = "## Unreleased\n"
          entry = '''## Unreleased\n\n## v0.7.6 - 2026-09-11\n\n- Пункты «Модели», «Хранилище Umnik» и «Цветовая схема» в настройках стали сворачиваемыми.\n- Для схемы «Свой цвет» вместо ограниченной палитры добавлен ввод стандартного HEX-кода `#RRGGBB` с предпросмотром цвета.\n- В свернутой цветовой схеме отображается текущий пользовательский HEX-код.\n'''
          if needle not in c:
              raise SystemExit("CHANGELOG Unreleased heading not found")
          c = c.replace(needle, entry, 1)
          changelog.write_text(c, encoding="utf-8")
          PY

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/ayuemin/ymnik/ui/YmnikApp.kt app/build.gradle.kts CHANGELOG.md
          git diff --cached --check
          git commit -m "Polish Umnik 0.7.6 settings"
          git push origin HEAD:main

name: Apply Umnik 0.7.6 settings polish

on:
  push:
    paths:
      - ".github/workflows/apply-076-settings.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        run: python scripts/patch_076.py

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/ayuemin/ymnik/ui/YmnikApp.kt app/build.gradle.kts CHANGELOG.md
          git diff --cached --check
          git commit -m "Polish Umnik 0.7.6 settings"
          git push origin HEAD:main

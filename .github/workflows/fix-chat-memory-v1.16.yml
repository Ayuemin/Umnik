name: Fix chat memory v1.16 compile

on:
  push:
    branches: [ "feature/chat-memory-v1.16.0" ]
    paths: [ ".github/workflows/fix-chat-memory-v1.16.yml" ]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/chat-memory-v1.16.0
          fetch-depth: 0
      - name: Apply compile fixes
        run: python .github/scripts/fix_chat_memory_compile.py
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix chat memory compilation"
          git push origin HEAD:feature/chat-memory-v1.16.0

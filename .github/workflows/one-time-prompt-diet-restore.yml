name: One-time Prompt Diet restore

on:
  push:
    branches: [ "work/local-shell-mvp" ]
    paths: [ ".github/one-time-prompt-diet-restore.py" ]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/local-shell-mvp
          fetch-depth: 0
      - run: python3 .github/one-time-prompt-diet-restore.py
      - name: Commit and remove temporary helpers
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-prompt-diet-restore.yml .github/one-time-prompt-diet-restore.py
          git add app/src/main/java/com/ayuemin/ymnik/PromptDiet.kt
          git commit -m "Restore beta.33 Prompt Diet baseline"
          git push origin HEAD:work/local-shell-mvp

name: Tag Umnik v0.7.1 once

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/tag-071-once.yml"

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create v0.7.1 tag on clean app commit
        shell: bash
        run: |
          set -euo pipefail
          TARGET_SHA=$(git rev-parse HEAD^)
          APP_VERSION=$(git show "$TARGET_SHA:app/build.gradle.kts" | sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' | head -n 1)
          if [ "$APP_VERSION" != "0.7.1" ]; then
            echo "Expected app version 0.7.1, got $APP_VERSION"
            exit 1
          fi
          if git ls-remote --tags origin refs/tags/v0.7.1 | grep -q .; then
            echo "Tag v0.7.1 already exists"
            exit 1
          fi
          git tag v0.7.1 "$TARGET_SHA"
          git push origin refs/tags/v0.7.1

name: Implement interactive guide v1.15.3

on:
  push:
    branches: [ "feature/interactive-guide-v1.15.3" ]
    paths: [ ".github/workflows/implement-interactive-guide-v1.15.3.yml" ]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/interactive-guide-v1.15.3

      - name: Patch interactive guide navigation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/ayuemin/ymnik/ui/YmnikApp.kt')
          s = path.read_text()

          def replace_once(old, new, label):
              global s
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 occurrence, found {count}')
              s = s.replace(old, new, 1)

          replace_once(
              'import androidx.activity.compose.rememberLauncherForActivityResult\n',
              'import androidx.activity.compose.BackHandler\nimport androidx.activity.compose.rememberLauncherForActivityResult\n',
              'BackHandler import'
          )

          replace_once(
              '    val currentChat = state.chats.firstOrNull { it.id == state.currentChatId }\n    val currentChatFiles = currentChat?.chatFiles.orEmpty()\n',
              '''    val currentChat = state.chats.firstOrNull { it.id == state.currentChatId }\n    val isUsageGuide = currentChat?.title == "Памятка по Umnik"\n    var guideScrollTarget by remember(state.currentChatId) { mutableStateOf<Int?>(null) }\n    LaunchedEffect(guideScrollTarget) {\n        val target = guideScrollTarget ?: return@LaunchedEffect\n        listState.animateScrollToItem(target)\n        guideScrollTarget = null\n    }\n    BackHandler(enabled = isUsageGuide && listState.firstVisibleItemIndex > 0) {\n        guideScrollTarget = 0\n    }\n    val currentChatFiles = currentChat?.chatFiles.orEmpty()\n''',
              'guide navigation state'
          )

          replace_once(
              '''    LaunchedEffect(state.currentChatId, state.messages.lastOrNull()?.id) {\n        if (state.messages.isNotEmpty()) {\n            delay(180)\n            listState.scrollToItem(state.messages.size)\n        }\n    }\n''',
              '''    LaunchedEffect(state.currentChatId, state.messages.lastOrNull()?.id) {\n        if (state.messages.isNotEmpty()) {\n            delay(180)\n            if (isUsageGuide) listState.scrollToItem(0) else listState.scrollToItem(state.messages.size)\n        }\n    }\n''',
              'initial guide position'
          )

          replace_once(
              '''                    onExportText = {\n                        val file = vm.exportMessage(message)\n                        fileToSave = file\n                        save.launch(file.name)\n                    },\nonBranch = if (message.role == "assistant") {\n''',
              '''                    onExportText = {\n                        val file = vm.exportMessage(message)\n                        fileToSave = file\n                        save.launch(file.name)\n                    },\n                    onGuideLink = if (isUsageGuide && message.providerName == "Umnik") {\n                        { target ->\n                            guideScrollTarget = target.coerceIn(0, state.messages.lastIndex.coerceAtLeast(0))\n                        }\n                    } else null,\nonBranch = if (message.role == "assistant") {\n''',
              'MessageCard guide callback'
          )

          replace_once(
              '''    onSaveGenerated: (GeneratedFile) -> Unit,\n    onExportText: () -> Unit,\n    onBranch: (() -> Unit)?,\n''',
              '''    onSaveGenerated: (GeneratedFile) -> Unit,\n    onExportText: () -> Unit,\n    onGuideLink: ((Int) -> Unit)?,\n    onBranch: (() -> Unit)?,\n''',
              'MessageCard signature'
          )

          count = s.count('MessageBody(message.text, content)')
          if count != 2:
              raise SystemExit(f'MessageBody calls: expected 2 occurrences, found {count}')
          s = s.replace('MessageBody(message.text, content)', 'MessageBody(message.text, content, onGuideLink)')

          replace_once(
              'private fun MessageBody(text: String, color: androidx.compose.ui.graphics.Color) {\n',
              'private fun MessageBody(text: String, color: androidx.compose.ui.graphics.Color, onGuideLink: ((Int) -> Unit)? = null) {\n',
              'MessageBody signature'
          )

          replace_once(
              '                    MarkdownText(part.text.trim(), color)\n',
              '                    MarkdownText(part.text.trim(), color, onGuideLink)\n',
              'MarkdownText call'
          )

          replace_once(
              'private fun MarkdownText(text: String, color: androidx.compose.ui.graphics.Color) {\n',
              'private fun MarkdownText(text: String, color: androidx.compose.ui.graphics.Color, onGuideLink: ((Int) -> Unit)? = null) {\n',
              'MarkdownText signature'
          )

          replace_once(
              '''            val horizontalRule = Regex("^\\\\s*((-{3,})|(\\\\*{3,})|(_{3,}))\\\\s*$").matches(line)\n            val possibleHeader = markdownTableCells(line)\n''',
              '''            val horizontalRule = Regex("^\\\\s*((-{3,})|(\\\\*{3,})|(_{3,}))\\\\s*$").matches(line)\n            val guideLink = Regex("^\\\\[([^]]+)]\\\\(umnik://guide/(\\\\d+)\\\\)$").matchEntire(line.trim())\n            val possibleHeader = markdownTableCells(line)\n''',
              'guide link parser'
          )

          replace_once(
              '''            when {\n                tableStart -> {\n''',
              '''            when {\n                guideLink != null -> {\n                    flushParagraph()\n                    val label = guideLink.groupValues[1]\n                    val target = guideLink.groupValues[2].toIntOrNull()\n                    TextButton(\n                        onClick = { target?.let { onGuideLink?.invoke(it) } },\n                        enabled = onGuideLink != null && target != null,\n                        contentPadding = PaddingValues(horizontal = 0.dp, vertical = 2.dp)\n                    ) {\n                        Text(\n                            label,\n                            color = MaterialTheme.colorScheme.primary,\n                            textDecoration = TextDecoration.Underline,\n                            fontWeight = FontWeight.Medium\n                        )\n                    }\n                }\n                tableStart -> {\n''',
              'guide link rendering'
          )

          path.write_text(s)
          PY

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/ayuemin/ymnik/ui/YmnikApp.kt
          git commit -m "Add clickable navigation to Umnik guide"
          git push

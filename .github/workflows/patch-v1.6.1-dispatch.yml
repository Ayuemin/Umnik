name: Patch v1.6.1 Hub polish

on:
  push:
    branches: [main]
    paths: [".github/workflows/patch-v1.6.1-dispatch.yml"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v1.6.1-hub-polish
          fetch-depth: 0
      - name: Apply patch script
        run: |
          set -euo pipefail
          python3 tools/patch_v161.py
          git config user.name "Ayuemin"
          git config user.email "105455063+Ayuemin@users.noreply.github.com"
          git add -A
          git commit -m "Polish OpenRouter Hub for v1.6.1"
          git push origin HEAD:fix/v1.6.1-hub-polish

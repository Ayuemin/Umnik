name: Patch v1.17.1 release prep

on:
  push:
    paths:
      - '.github/workflows/patch-v1171-release-prep.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: fix/background-recovery-v1.17.1
          fetch-depth: 0

      - name: Apply release prep
        run: python3 .github/scripts/apply_v1171_release_prep.py

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Unit tests and debug APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Verify release metadata
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionCode = 124' app/build.gradle.kts
          grep -q 'versionName = "1.17.1"' app/build.gradle.kts
          grep -q '^## v1.17.1$' CHANGELOG.md
          grep -q 'Текущая версия: \*\*1.17.1\*\*' README.md
          ! grep -q 'Другой чат отвечает · здесь можно отправить новый запрос' app/src/main/java/com/ayuemin/ymnik/ui/YmnikApp.kt

      - name: Commit verified release prep and remove scaffolding
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/scripts/apply_v1171_release_prep.py .github/workflows/patch-v1171-release-prep.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Prepare Umnik v1.17.1 release'
          git push origin HEAD:fix/background-recovery-v1.17.1

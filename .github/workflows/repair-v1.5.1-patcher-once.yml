name: Repair v1.5.1 patcher once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/repair-v1.5.1-patcher-once.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair and retrigger main patcher
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/fix-project-priority-background-v1.5.1-once.yml')
          s = p.read_text(encoding='utf-8')
          s = s.replace('if count != 1:', 'if count < 1:', 1)
          s = s.replace('                      android:name="com.ayuemin.ymnik.RequestKeepAliveService"', '            android:name="com.ayuemin.ymnik.RequestKeepAliveService"')
          s = s.replace('                      android:exported="false"', '            android:exported="false"')
          s = s.replace('                      android:stopWithTask="false"', '            android:stopWithTask="false"')
          s = s.replace('                      android:foregroundServiceType="dataSync" />', '            android:foregroundServiceType="dataSync" />')
          p.write_text(s, encoding='utf-8')
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/fix-project-priority-background-v1.5.1-once.yml
          git commit -m "ci: correct v1.5.1 patch markers"
          git push origin HEAD:main

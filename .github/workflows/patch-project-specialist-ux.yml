name: Patch project specialist UX

on:
  push:
    branches: [ "work/modernize-sdk37" ]
    paths: [ ".github/workflows/patch-project-specialist-ux.yml" ]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/modernize-sdk37
          fetch-depth: 0

      - name: Apply focused project UX fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, got {count}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          def sub_once(path, pattern, repl):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              new_text, count = re.subn(pattern, repl, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one regex match: {pattern[:120]!r}")
              p.write_text(new_text, encoding="utf-8")

          # Project specialist settings: all global skills are directly available.
          p = "app/src/main/java/com/ayuemin/ymnik/ui/ProjectChatAutomationDialog.kt"
          replace_once(p,
              "import androidx.compose.material3.Text\n",
              "import androidx.compose.material3.Text\nimport androidx.compose.material3.TextButton\n")
          replace_once(p,
              "    vm: ChatViewModel,\n    onDismiss: () -> Unit\n) {",
              "    vm: ChatViewModel,\n    onDismiss: () -> Unit,\n    onOpenChat: (() -> Unit)? = null\n) {")
          replace_once(p,
              "    val allowedSkills = state.skills.filter { it.id in project.skillIds }\n",
              "")
          replace_once(p,
              "        title = if (isOrchestrator) \"◆ Настройки оркестратора\" else \"Настройки чата\",",
              "        title = if (isOrchestrator) \"◆ Настройки оркестратора\" else \"Настройки специалиста\",")
          replace_once(p,
              "                    label = { Text(if (isOrchestrator) \"Инструкция оркестратора\" else \"Инструкция чата\") },",
              "                    label = { Text(if (isOrchestrator) \"Инструкция оркестратора\" else \"Инструкция специалиста\") },")
          replace_once(p,
              "            item { OutlinedTextField(role, { role = it }, Modifier.fillMaxWidth(), label = { Text(if (isOrchestrator) \"Роль оркестратора\" else \"Роль чата\") }) }",
              "            item { OutlinedTextField(role, { role = it }, Modifier.fillMaxWidth(), label = { Text(if (isOrchestrator) \"Роль оркестратора\" else \"Роль специалиста\") }) }")
          replace_once(p,
              "            if (isOrchestrator) {\n                item {\n                    Text(\n                        \"◆ — системный знак. Оркестратор удаляется только вместе с проектом; имя после знака можно менять.\",",
              "            if (onOpenChat != null) {\n                item {\n                    TextButton(onClick = onOpenChat, modifier = Modifier.fillMaxWidth()) {\n                        Text(\"Перейти в чат без настройки\")\n                    }\n                }\n            }\n            if (isOrchestrator) {\n                item {\n                    Text(\n                        \"◆ — системный знак. Оркестратор удаляется только вместе с проектом; имя после знака можно менять.\",")
          sub_once(p,
              r'''            if \(skillsExpanded\) \{\n                if \(allowedSkills\.isEmpty\(\)\) \{.*?\n            \}\n\n            item \{\n                FilledTonalButton\(''',
              '''            if (skillsExpanded) {\n                item {\n                    ProjectChatSkillsSection(\n                        state = state,\n                        vm = vm,\n                        selectedIds = skillIds,\n                        onSelectedIdsChange = { skillIds = it }\n                    )\n                }\n            }\n\n            item {\n                FilledTonalButton(''')
          sub_once(p,
              r'''(\s+Text\("Сохранить параметры работы"\)\n\s+\}\n\s+\}\n)\n            if \(isOrchestrator\) \{''',
              r'''\1\n            if (onOpenChat != null) {\n                item {\n                    Button(\n                        onClick = {\n                            vm.updateChatProfile(chat.id, title, role, instruction)\n                            if (!isOrchestrator) vm.setChatFavorite(chat.id, favorite)\n                            vm.saveProjectChatRuntimeSettings(\n                                chat.id,\n                                ProjectChatRuntimeProfile(modelId, webSearch, reasoning, effort, tools, skillIds)\n                            )\n                            onOpenChat()\n                        },\n                        enabled = title.isNotBlank() && modelId.isNotBlank() && !state.isLoading && !state.requestActive,\n                        modifier = Modifier.fillMaxWidth()\n                    ) {\n                        Text("Сохранить и перейти в чат")\n                    }\n                }\n            }\n\n            if (isOrchestrator) {''')

          # New project chat opens its settings and starts clean instead of cloning the previous specialist.
          p = "app/src/main/java/com/ayuemin/ymnik/ui/ProjectDialogs.kt"
          replace_once(p,
              "import com.ayuemin.ymnik.model.Project\n",
              "import com.ayuemin.ymnik.model.Project\nimport com.ayuemin.ymnik.model.ProjectChatRuntimeProfile\nimport com.ayuemin.ymnik.model.ReasoningEffort\n")
          replace_once(p,
              '''            onCreateChat = {\n                vm.createChat(project.id)\n                openProjectId = null\n                onDismiss()\n            }''',
              '''            onCreateChat = {\n                val chatId = vm.createChat(project.id)\n                vm.saveProjectChatRuntimeSettings(\n                    chatId,\n                    ProjectChatRuntimeProfile(\n                        modelId = state.textModel,\n                        webSearchEnabled = false,\n                        reasoningEnabled = false,\n                        reasoningEffort = ReasoningEffort.MEDIUM,\n                        tools = vm.globalOpenRouterTools(),\n                        skillIds = emptySet()\n                    )\n                )\n                chatId\n            }''')
          replace_once(p,
              "    onOpenChat: (String) -> Unit,\n    onCreateChat: () -> Unit\n) {",
              "    onOpenChat: (String) -> Unit,\n    onCreateChat: () -> String\n) {")
          replace_once(p,
              "                    FilledTonalButton(onClick = onCreateChat, modifier = Modifier.weight(1f)) {",
              "                    FilledTonalButton(onClick = { chatSettingsId = onCreateChat() }, modifier = Modifier.weight(1f)) {")
          replace_once(p,
              "            vm = vm,\n            onDismiss = { chatSettingsId = null }\n        )",
              "            vm = vm,\n            onDismiss = { chatSettingsId = null },\n            onOpenChat = { onOpenChat(chat.id) }\n        )")

          # The + menu in a project should also see the whole global skill library.
          p = "app/src/main/java/com/ayuemin/ymnik/ui/YmnikApp.kt"
          replace_once(p,
              '''    val projectAvailableSkills = currentProject?.let { project ->\n        state.skills.filter { it.id in project.skillIds }\n    }.orEmpty()''',
              '''    val projectAvailableSkills = if (currentProject != null) state.skills else emptyList()''')
          replace_once(p,
              '"В настройках проекта навыки не выбраны."',
              '"В библиотеке навыков пока нет."')

          # Allow creating a skill directly in the global library too.
          replace_once(p,
              '''private fun SkillsScreen(state: UiState, vm: ChatViewModel, onBack: () -> Unit) {\n    val filePicker = rememberLauncherForActivityResult(ActivityResultContracts.OpenDocument()) { uri ->''',
              '''private fun SkillsScreen(state: UiState, vm: ChatViewModel, onBack: () -> Unit) {\n    val context = LocalContext.current\n    var createSkillOpen by remember { mutableStateOf(false) }\n    val filePicker = rememberLauncherForActivityResult(ActivityResultContracts.OpenDocument()) { uri ->''')
          replace_once(p,
              '''                Spacer(Modifier.height(12.dp))\n                Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {''',
              '''                Spacer(Modifier.height(12.dp))\n                FilledTonalButton(onClick = { createSkillOpen = true }, modifier = Modifier.fillMaxWidth()) {\n                    Icon(Icons.Outlined.Add, contentDescription = null)\n                    Spacer(Modifier.width(7.dp))\n                    Text("Создать навык")\n                }\n                Spacer(Modifier.height(8.dp))\n                Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {''')
          replace_once(p,
              '"Пока навыков нет. Импортируйте SKILL.md или папку навыка."',
              '"Пока навыков нет. Создайте навык здесь или импортируйте SKILL.md/папку."')
          replace_once(p,
              '''                            IconButton(onClick = { vm.deleteSkill(skill.id) }) {\n                                Icon(Icons.Outlined.DeleteOutline, contentDescription = "Удалить навык")\n                            }\n                        }\n                    }\n                }\n            }\n        }\n    }\n}\n\nprivate data class CameraTarget''',
              '''                            IconButton(onClick = { vm.deleteSkill(skill.id) }) {\n                                Icon(Icons.Outlined.DeleteOutline, contentDescription = "Удалить навык")\n                            }\n                        }\n                    }\n                }\n            }\n        }\n    }\n\n    if (createSkillOpen) {\n        InlineSkillCreateDialog(\n            onDismiss = { createSkillOpen = false },\n            onCreate = { name, body ->\n                createInlineSkill(context, vm, name, body)\n                createSkillOpen = false\n            }\n        )\n    }\n}\n\nprivate data class CameraTarget''')
          replace_once(p,
              '"Подключён к каждому чату"',
              '"Включён в текущем чате"')
          replace_once(p,
              '"Подключить к каждому чату"',
              '"Включить в текущем чате"')

          # Fix helper imports/authority.
          p = "app/src/main/java/com/ayuemin/ymnik/ui/ProjectChatSkillsSection.kt"
          replace_once(p,
              "import androidx.compose.foundation.layout.width\n",
              "import androidx.compose.foundation.layout.width\nimport androidx.compose.foundation.layout.weight\n")
          replace_once(p,
              'FileProvider.getUriForFile(context, "${context.packageName}.files", file)',
              'FileProvider.getUriForFile(context, "${context.packageName}.fileprovider", file)')

          # Installed 1.18.0 is already in testers' hands; this fixed build must upgrade it normally.
          p = "app/build.gradle.kts"
          replace_once(p, "// Umnik v1.18.0 — modernization and server-mode test line", "// Umnik v1.18.1 — project specialist UX test line")
          replace_once(p, "versionCode = 129", "versionCode = 130")
          replace_once(p, 'versionName = "1.18.0"', 'versionName = "1.18.1"')

          p = ".github/workflows/android-ci.yml"
          text = Path(p).read_text(encoding="utf-8")
          if "1.18.0" not in text or "versionCode='129'" not in text:
              raise SystemExit("android-ci.yml: expected 1.18.0 test constants not found")
          text = text.replace("1.18.0", "1.18.1").replace("versionCode='129'", "versionCode='130'")
          Path(p).write_text(text, encoding="utf-8")
          PY

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/ayuemin/ymnik/ui/ProjectChatAutomationDialog.kt \
                  app/src/main/java/com/ayuemin/ymnik/ui/ProjectDialogs.kt \
                  app/src/main/java/com/ayuemin/ymnik/ui/YmnikApp.kt \
                  app/src/main/java/com/ayuemin/ymnik/ui/ProjectChatSkillsSection.kt \
                  app/build.gradle.kts .github/workflows/android-ci.yml
          git diff --cached --check
          git commit -m "Fix project specialist setup UX and bump 1.18.1"
          git push origin HEAD:work/modernize-sdk37

name: Release v1.10.5 once

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/release-v1.10.5-once.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Apply v1.10.5 patch
        run: python3 tools/patch_v1_10_5.py

      - name: Verify layout and version
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionName = "1.10.5"' app/build.gradle.kts
          grep -q 'versionCode = 105' app/build.gradle.kts
          grep -q 'if (state.reasoningEnabled) Icons.Outlined.Check else Icons.Outlined.Psychology' app/src/main/java/com/ayuemin/ymnik/ui/YmnikApp.kt
          grep -q 'if (state.webSearchEnabled) Icons.Outlined.Check else Icons.Outlined.Language' app/src/main/java/com/ayuemin/ymnik/ui/YmnikApp.kt

      - name: Unit tests and debug APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Commit tested changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm tools/patch_v1_10_5.py .github/workflows/release-v1.10.5-once.yml
          git add app/build.gradle.kts CHANGELOG.md app/src/main/java/com/ayuemin/ymnik/ui/YmnikApp.kt
          git commit -m "release: Umnik v1.10.5"
          git push origin HEAD:main
          echo "RELEASE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Tag tested release
        shell: bash
        run: |
          set -euo pipefail
          if git rev-parse v1.10.5 >/dev/null 2>&1; then
            echo "v1.10.5 already exists"
            exit 1
          fi
          git tag -a v1.10.5 -m "Umnik v1.10.5" "$RELEASE_COMMIT"
          git push origin v1.10.5

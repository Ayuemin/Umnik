name: Fix image resolution beta7 once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-image-resolution-beta7-once.yml'

permissions:
  contents: write
  actions: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply beta.7 fix
        run: python .github/scripts/fix-image-resolution-beta7.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Ayuemin"
          git config user.email "105455063+Ayuemin@users.noreply.github.com"
          git add app/build.gradle.kts app/src/main/java/com/ayuemin/ymnik/ChatViewModel.kt CHANGELOG.md
          git commit -m "Fix image resolution fallback for constrained ratios"
          git push origin HEAD:main

      - name: Tag beta.7
        shell: bash
        run: |
          set -euo pipefail
          git tag v1.2.0-beta.7
          git push origin v1.2.0-beta.7

      - name: Dispatch signed prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run android-release.yml -f tag=v1.2.0-beta.7

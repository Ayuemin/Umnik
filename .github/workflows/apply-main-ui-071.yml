name: Apply Umnik 0.7.1 main UI redesign

on:
  push:
    branches: [ "main" ]
    paths:
      - "scripts/patch_main_ui_071.py"
      - ".github/workflows/apply-main-ui-071.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        run: python3 scripts/patch_main_ui_071.py

      - name: Commit app changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/ayuemin/ymnik/ui/YmnikApp.kt app/build.gradle.kts CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Redesign Umnik main chat screen"
          git push origin main

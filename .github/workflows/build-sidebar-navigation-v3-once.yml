name: Build sidebar navigation redesign v3 once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-sidebar-navigation-v3-once.yml"

permissions:
  contents: write

jobs:
  build-change:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run corrected patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          wf = Path('.github/workflows/build-sidebar-navigation-v2-once.yml').read_text()
          section = wf.index('      - name: Apply navigation redesign')
          run_at = wf.index('        run: |\n', section) + len('        run: |\n')
          end = wf.index('\n      - name: Open pull request', run_at)
          script = textwrap.dedent(wf[run_at:end])

          start = script.index("favorite = '''")
          finish = script.index("\nconfirm = '''", start)
          corrected = '''favorite_marker = \'''                                contentDescription = "Избранное"
                            )
                        }
                    }
                    HorizontalDivider()\'''
          if favorite_marker not in text:
              raise SystemExit('Project chat favorite marker not found')
          favorite_replacement = \'''                                contentDescription = if (chat.isFavorite) "Открепить чат" else "Закрепить чат"
                            )
                        }
                        IconButton(onClick = { deleteChatTarget = chat }, enabled = !state.isLoading) {
                            Icon(Icons.Outlined.DeleteOutline, contentDescription = "Удалить чат")
                        }
                    }
                    HorizontalDivider()\'''
          text = text.replace(favorite_marker, favorite_replacement, 1)
          '''
          script = script[:start] + corrected + script[finish + 1:]
          script = script.replace(
              'rm .github/workflows/build-sidebar-navigation-v2-once.yml\n',
              'rm .github/workflows/build-sidebar-navigation-v2-once.yml\nrm .github/workflows/build-sidebar-navigation-v3-once.yml\n',
              1,
          )
          Path('/tmp/apply-sidebar.sh').write_text(script)
          PY
          bash /tmp/apply-sidebar.sh

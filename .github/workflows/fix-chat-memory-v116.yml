name: Fix chat memory v1.16

on:
  push:
    branches:
      - feature/chat-memory-v1.16.0
    paths:
      - tools/fix_chat_memory_v116.py
      - .github/workflows/fix-chat-memory-v116.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/chat-memory-v1.16.0
          fetch-depth: 0
      - name: Apply fixes
        run: python3 tools/fix_chat_memory_v116.py
      - name: Commit fixes and remove one-shot files
        run: |
          rm -f tools/fix_chat_memory_v116.py .github/workflows/fix-chat-memory-v116.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Fix v1.16 memory build and checkpoint batching"
            git push origin HEAD:feature/chat-memory-v1.16.0
          fi

name: Patch v1.17.4 review fixes

on:
  push:
    branches: [ "feature/streaming-v1.17.4" ]

permissions:
  contents: write

jobs:
  patch-review-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          ref: feature/streaming-v1.17.4
          fetch-depth: 0

      - name: Apply review fixes
        run: python3 .github/scripts/patch_v1174_review.py

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Unit tests and debug APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Commit verified review fixes and remove helpers
        run: |
          rm -f .github/scripts/patch_v1174_review.py .github/workflows/patch-v1174-review.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Address v1.17.4 streaming review feedback"
          git push origin HEAD:feature/streaming-v1.17.4

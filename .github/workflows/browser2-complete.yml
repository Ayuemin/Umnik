name: Browser 2 completion patch

on:
  push:
    branches:
      - work/local-shell-mvp
    paths:
      - .github/browser2_complete_trigger.txt

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/local-shell-mvp
          fetch-depth: 0
      - name: Apply Browser 2 completion patch
        run: python3 .github/browser2_complete.py

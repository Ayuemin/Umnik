name: Apply Umnik UI refresh

# One-time helper. Remove after the verified UI patch lands.
on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/ui-refresh-once.yml"

permissions:
  contents: write

jobs:
  refresh-ui:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch main chat screen
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/src/main/java/com/ayuemin/ymnik/ui/YmnikApp.kt")
          text = path.read_text(encoding="utf-8")

          if "import androidx.compose.material.icons.outlined.CropFree\n" not in text:
              anchor = "import androidx.compose.material.icons.outlined.ContentCopy\n"
              if text.count(anchor) != 1:
                  raise SystemExit("Could not locate import anchor")
              text = text.replace(
                  anchor,
                  anchor + "import androidx.compose.material.icons.outlined.CropFree\n",
                  1,
              )

          old_empty = "item { EmptyChatCard(state.mode) }"
          new_empty = "item { EmptyChatWelcome(Modifier.fillParentMaxHeight()) }"
          if text.count(old_empty) != 1:
              raise SystemExit(f"Expected one empty-chat call, found {text.count(old_empty)}")
          text = text.replace(old_empty, new_empty, 1)

          old_icon = 'Icon(Icons.Outlined.Add, contentDescription = "Новый чат", modifier = Modifier.size(24.dp))'
          new_icon = 'Icon(Icons.Outlined.CropFree, contentDescription = "Новый чат", modifier = Modifier.size(24.dp))'
          if text.count(old_icon) != 1:
              raise SystemExit(f"Expected one header new-chat icon, found {text.count(old_icon)}")
          text = text.replace(old_icon, new_icon, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Verify debug build
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Commit UI refresh
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/ayuemin/ymnik/ui/YmnikApp.kt
          git commit -m "Refresh Umnik main chat screen"
          git push

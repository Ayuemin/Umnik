name: Release Umnik v0.7.1 once

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/release-071-once.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: v0.7.1
          fetch-depth: 0

      - name: Validate version
        shell: bash
        run: |
          set -euo pipefail
          APP_VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          test "$APP_VERSION" = "0.7.1"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Restore permanent signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for value in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!value:-}" ]; then
              echo "Missing GitHub Actions secret: $value"
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/umnik-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/umnik-release.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

      - name: Build signed APK
        env:
          UMNIK_KEYSTORE_PATH: ${{ runner.temp }}/umnik-release.jks
          UMNIK_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          UMNIK_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          UMNIK_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease --stacktrace

      - name: Verify APK signature
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          APK_CERT=$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1 | tr 'A-F' 'a-f' | tr -d ':')
          KEY_CERT=$(keytool -list -v -keystore "$RUNNER_TEMP/umnik-release.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" | sed -n 's/^[[:space:]]*SHA256: //p' | head -n1 | tr 'A-F' 'a-f' | tr -d ':')
          test -n "$APK_CERT"
          test -n "$KEY_CERT"
          test "$APK_CERT" = "$KEY_CERT"
          echo "SIGNING_CERT_SHA256=$APK_CERT" >> "$GITHUB_ENV"

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/Umnik-v0.7.1.apk
          (cd dist && sha256sum Umnik-v0.7.1.apk > Umnik-v0.7.1.apk.sha256)
          printf '%s\n' "$SIGNING_CERT_SHA256" > dist/Umnik-signing-certificate-sha256.txt
          awk '
            $0 == "## v0.7.1" { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > dist/changelog-section.md
          {
            echo "## Umnik v0.7.1"
            echo
            echo "Главное обновление этой версии — полностью переработанный главный экран чата и более быстрый доступ к основным действиям."
            echo
            cat dist/changelog-section.md
            echo
            echo "### Установка"
            echo
            echo "Скачайте **Umnik-v0.7.1.apk** из Assets. Версия подписана постоянным release-ключом Umnik и должна устанавливаться поверх v0.7.0 обычным обновлением."
            echo
            echo "- SHA-256 APK: отдельный файл **Umnik-v0.7.1.apk.sha256**."
            echo "- SHA-256 сертификата подписи: **$SIGNING_CERT_SHA256**."
            echo
            echo "Проект создан Александром (Ayuemin) в соавторстве с ChatGPT от OpenAI."
          } > dist/release-notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v0.7.1 >/dev/null 2>&1; then
            echo "Release v0.7.1 already exists"
            exit 1
          fi
          gh release create v0.7.1 \
            dist/Umnik-v0.7.1.apk \
            dist/Umnik-v0.7.1.apk.sha256 \
            dist/Umnik-signing-certificate-sha256.txt \
            --verify-tag \
            --title "Umnik v0.7.1 — Новый интерфейс чата" \
            --notes-file dist/release-notes.md \
            --latest

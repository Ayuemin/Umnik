name: Dispatch Umnik 1.3.8 release once

on:
  push:
    paths:
      - ".github/run-dispatch-v1.3.8"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch existing signed release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run android-release.yml \
            --repo "$GITHUB_REPOSITORY" \
            -f tag=v1.3.8

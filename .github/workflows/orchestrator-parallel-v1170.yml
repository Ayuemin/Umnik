name: Orchestrator parallel v1.17.0

on:
  push:
    branches:
      - feature/multi-request-v1.17.0
    paths:
      - "tools/add_orchestrator_parallelism.py"
      - ".github/workflows/orchestrator-parallel-v1170.yml"

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: feature/multi-request-v1.17.0
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Apply safe Orchestrator parallelism
        run: python3 tools/add_orchestrator_parallelism.py

      - name: Unit tests and debug APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Commit tested production changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/ayuemin/ymnik/ChatViewModel.kt app/src/main/java/com/ayuemin/ymnik/data/ChatRepository.kt
          if git diff --cached --quiet; then
            echo "No production changes"
          else
            git commit -m "Run independent Orchestrator workers in parallel"
            git push origin HEAD:feature/multi-request-v1.17.0
          fi

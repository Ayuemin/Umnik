name: Publish Umnik 1.3.7 once

on:
  push:
    branches: [main]
    paths:
      - .github/run-publish-v1.3.7

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tested v1.3.7 source
        uses: actions/checkout@v4
        with:
          ref: 400de854084dc396c20232c9a14c1dd0641b5a1a
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Compile debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Tag v1.3.7
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Ayuemin"
          git config user.email "105455063+Ayuemin@users.noreply.github.com"
          if git rev-parse v1.3.7 >/dev/null 2>&1; then
            echo "Tag v1.3.7 already exists"
            exit 1
          fi
          git tag -a v1.3.7 -m "Umnik v1.3.7" 400de854084dc396c20232c9a14c1dd0641b5a1a
          git push origin v1.3.7

      - name: Restore permanent signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for value in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!value:-}" ]; then
              echo "Missing GitHub Actions secret: $value"
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/umnik-release.jks"
          keytool -list \
            -keystore "$RUNNER_TEMP/umnik-release.jks" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" >/dev/null

      - name: Build signed release APK
        env:
          UMNIK_KEYSTORE_PATH: ${{ runner.temp }}/umnik-release.jks
          UMNIK_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          UMNIK_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          UMNIK_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease --stacktrace

      - name: Verify APK signature
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          APK_CERT=$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1 | tr 'A-F' 'a-f' | tr -d ':')
          KEY_CERT=$(keytool -list -v -keystore "$RUNNER_TEMP/umnik-release.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" | sed -n 's/^[[:space:]]*SHA256: //p' | head -n1 | tr 'A-F' 'a-f' | tr -d ':')
          test -n "$APK_CERT"
          test -n "$KEY_CERT"
          test "$APK_CERT" = "$KEY_CERT"
          echo "SIGNING_CERT_SHA256=$APK_CERT" >> "$GITHUB_ENV"

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          VERSION=1.3.7
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/Umnik-v${VERSION}.apk"
          (cd dist && sha256sum "Umnik-v${VERSION}.apk" > "Umnik-v${VERSION}.apk.sha256")
          printf '%s\n' "$SIGNING_CERT_SHA256" > dist/Umnik-signing-certificate-sha256.txt
          awk -v ver="v${VERSION}" '$0 ~ "^## " ver "( |$)" {found=1; next} found && /^## / {exit} found {print}' CHANGELOG.md > dist/changelog-section.md
          {
            echo "## Umnik v${VERSION}"
            echo
            cat dist/changelog-section.md
            echo
            echo "### Установка"
            echo
            echo "Скачайте **Umnik-v${VERSION}.apk** из Assets."
            echo
            echo "Контрольная сумма SHA-256 приложена отдельным файлом **Umnik-v${VERSION}.apk.sha256**."
            echo
            echo "SHA-256 сертификата постоянной подписи: \`${SIGNING_CERT_SHA256}\`."
          } > dist/release-notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create v1.3.7 \
            dist/Umnik-v1.3.7.apk \
            dist/Umnik-v1.3.7.apk.sha256 \
            dist/Umnik-signing-certificate-sha256.txt \
            --verify-tag \
            --title "Umnik v1.3.7" \
            --notes-file dist/release-notes.md \
            --latest

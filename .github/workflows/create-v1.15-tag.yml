name: Create v1.15.0 tag

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/create-v1.15-tag.yml"

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Create v1.15.0 tag on verified release commit
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: 94c7dac62e37d9f5503f3c522a35b886851816ca
        shell: bash
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v1.15.0" >/dev/null 2>&1; then
            echo "v1.15.0 already exists"
            exit 0
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref='refs/tags/v1.15.0' \
            -f sha="$TARGET_SHA"

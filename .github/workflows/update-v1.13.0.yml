name: Apply Umnik v1.13.0 conversational orchestrator

on:
  push:
    branches: [ "feature/orchestrator-chat-control-v1.13.0" ]

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          ref: feature/orchestrator-chat-control-v1.13.0
          fetch-depth: 0

      - name: Repair updater targeting
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/update_v1_13_0.py')
          s = p.read_text(encoding='utf-8')
          old = """vm = replace_once(
              vm,
              '        val runtime = projectAutomation.profile(chat.id) ?: defaultRuntimeProfile(chat)\\n',
              '        val runtime = runtimeOverride ?: projectAutomation.profile(chat.id) ?: defaultRuntimeProfile(chat)\\n',
              'chat task runtime override'
          )
          """
          new = """vm = replace_once(
              vm,
              '        val all = chatsRepository.list()\\n        val chat = all.firstOrNull { it.id == requested.id } ?: requested\\n        val runtime = projectAutomation.profile(chat.id) ?: defaultRuntimeProfile(chat)\\n',
              '        val all = chatsRepository.list()\\n        val chat = all.firstOrNull { it.id == requested.id } ?: requested\\n        val runtime = runtimeOverride ?: projectAutomation.profile(chat.id) ?: defaultRuntimeProfile(chat)\\n',
              'chat task runtime override'
          )
          """
          if old not in s:
              raise SystemExit('chat runtime updater block not found')
          s = s.replace(old, new, 1)
          old2 = """# This is the second occurrence after the chat-task replacement.
          old_runtime = '            val runtime = projectAutomation.profile(chat.id) ?: defaultRuntimeProfile(chat)\\n'
          if vm.count(old_runtime) < 1:
              raise RuntimeError('stage runtime override: no remaining match')
          vm = vm.replace(old_runtime, '            val runtime = runtimeOverride ?: projectAutomation.profile(chat.id) ?: defaultRuntimeProfile(chat)\\n', 1)
          """
          new2 = """vm = replace_once(
              vm,
              '            val currentChats = chatsRepository.list()\\n            val chat = currentChats.firstOrNull { it.id == first.id } ?: first\\n            val runtime = projectAutomation.profile(chat.id) ?: defaultRuntimeProfile(chat)\\n',
              '            val currentChats = chatsRepository.list()\\n            val chat = currentChats.firstOrNull { it.id == first.id } ?: first\\n            val runtime = runtimeOverride ?: projectAutomation.profile(chat.id) ?: defaultRuntimeProfile(chat)\\n',
              'stage runtime override'
          )
          """
          if old2 not in s:
              raise SystemExit('stage runtime updater block not found')
          s = s.replace(old2, new2, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Apply source update
        run: python3 .github/scripts/update_v1_13_0.py

      - name: Check whitespace
        run: git diff --check

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Unit tests and debug APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Remove temporary updater
        run: rm -f .github/scripts/update_v1_13_0.py .github/workflows/update-v1.13.0.yml

      - name: Commit v1.13.0 implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Umnik 1.13.0: conversational project orchestrator"
          git push origin HEAD:feature/orchestrator-chat-control-v1.13.0

name: Apply Umnik 0.6.5 chat files

on:
  push:
    branches: [ "main" ]
    paths:
      - "scripts/patch_064.py"
      - ".github/workflows/apply-ux-064.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        run: |
          sed -i 's#// Umnik v0.6.4 quick per-chat model switching#// Umnik v0.6.4 per-chat model handoff#' scripts/patch_064.py
          python3 scripts/patch_064.py

      - name: Commit app changes
        run: |
          if git diff --quiet -- app; then
            echo "No app changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app
          git commit -m "Add chat-scoped persistent documents"
          git push

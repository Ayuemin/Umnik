name: Patch v1.17.2

on:
  push:
    branches: [ "fix/background-recovery-stages-v1.17.2" ]
    paths: [ ".github/workflows/patch-v1.17.2.yml" ]

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/background-recovery-stages-v1.17.2
          fetch-depth: 0

      - name: Apply v1.17.2 fixes
        run: python3 tools/patch_v1172.py

      - name: Unit tests and debug APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Commit production patch and remove one-shot tooling
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-v1.17.2.yml tools/patch_v1172.py
          git add app CHANGELOG.md
          git commit -m "Umnik v1.17.2: immediate recovery and live work stages"
          git push origin HEAD:fix/background-recovery-stages-v1.17.2

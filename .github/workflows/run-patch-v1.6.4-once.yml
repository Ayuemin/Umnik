name: Run v1.6.4 patch once

on:
  push:
    branches:
      - fix/remove-client-limits-batch-ux-v1.6.4
    paths:
      - .github/workflows/run-patch-v1.6.4-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/remove-client-limits-batch-ux-v1.6.4
          fetch-depth: 0
      - name: Apply patch
        run: python scripts/patch_v164.py
      - name: Commit patch
        run: |
          git config user.name "Ayuemin"
          git config user.email "105455063+Ayuemin@users.noreply.github.com"
          git add app CHANGELOG.md
          git commit -m "fix: remove client caps and simplify Batch UX"
          git push origin HEAD:fix/remove-client-limits-batch-ux-v1.6.4

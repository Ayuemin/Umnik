name: Dispatch signed v1.5.1 release once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-v1.5.1-once.yml"

permissions:
  contents: write
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create release tag and dispatch signed release
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: 9db8145077032a09d69aaeebff118795ddddad55
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          if git rev-parse -q --verify refs/tags/v1.5.1 >/dev/null; then
            EXISTING=$(git rev-parse v1.5.1^{commit})
            test "$EXISTING" = "$TARGET_SHA"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a v1.5.1 "$TARGET_SHA" -m "Umnik v1.5.1"
            git push origin refs/tags/v1.5.1
          fi
          gh workflow run android-release.yml --ref main -f tag=v1.5.1

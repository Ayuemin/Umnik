name: Move v1.15.0 tag

on:
  push:
    branches: [ "main" ]
    paths: [ ".github/workflows/move-v1.15-tag.yml" ]

permissions:
  contents: write

jobs:
  move-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Point v1.15.0 to clean release commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/v1.15.0" -f sha='537453a85090e0b374ce5f5358ba4446663d7367' -F force=true

name: Release Umnik 1.3.0 once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-1.3.0-once.yml"

permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v1.3.0 image provider changes
        run: |
          set -euo pipefail
          python3 .github/scripts/prepatch-image-providers-1.3.0.py
          python3 .github/scripts/patch-image-providers-1.3.0.py
          python3 .github/scripts/fix-image-patch-1.3.0.py
          git diff --check

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Commit and tag
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Ayuemin"
          git config user.email "105455063+Ayuemin@users.noreply.github.com"
          git rm .github/workflows/release-1.3.0-once.yml
          git rm .github/scripts/prepatch-image-providers-1.3.0.py
          git rm .github/scripts/patch-image-providers-1.3.0.py
          git rm .github/scripts/fix-image-patch-1.3.0.py
          git add -A
          git diff --cached --check
          git commit -m "Add resilient image provider adapters"
          git push origin HEAD:main
          git tag v1.3.0
          git push origin v1.3.0

      - name: Publish signed stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run android-release.yml -f tag=v1.3.0

      # retry 3: duplicate legacy guards are normalized by the prepatch script

name: Apply Markdown rendering v0.7.3

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/apply-markdown-073.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch source
        run: python3 scripts/patch_073_markdown.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/ayuemin/ymnik/ui/YmnikApp.kt
          git commit -m "Render assistant Markdown in chat"
          git push

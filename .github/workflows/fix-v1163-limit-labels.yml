name: Fix v1.16.3 attachment labels

on:
  push:
    branches:
      - fix/background-navigation-v1.16.3
    paths:
      - ".github/workflows/fix-v1163-limit-labels.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/background-navigation-v1.16.3
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Fix stale limit labels
        shell: bash
        run: |
          set -euo pipefail
          FILE=app/src/main/java/com/ayuemin/ymnik/ChatViewModel.kt
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/com/ayuemin/ymnik/ChatViewModel.kt")
          text = p.read_text()
          old1 = '_state.value = _state.value.copy(status = "Фото превышает ограничение 25 МБ")'
          new1 = '_state.value = _state.value.copy(status = "Фото превышает ограничение $MAX_ATTACHMENT_MB МБ")'
          old2 = '_state.value = _state.value.copy(status = "Голосовое сообщение превышает ограничение 25 МБ")'
          new2 = '_state.value = _state.value.copy(status = "Голосовое сообщение превышает ограничение $MAX_ATTACHMENT_MB МБ")'
          if text.count(old1) != 1 or text.count(old2) != 1:
              raise SystemExit("Expected stale 25 MB labels were not found exactly once")
          p.write_text(text.replace(old1, new1, 1).replace(old2, new2, 1))
          PY

      - name: Unit tests and debug APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Commit tested label fix
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/fix-v1163-limit-labels.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/ayuemin/ymnik/ChatViewModel.kt
          git commit -m "Keep attachment limit messages in sync"
          git push origin HEAD:fix/background-navigation-v1.16.3

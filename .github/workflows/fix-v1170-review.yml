name: Fix v1.17.0 review findings

on:
  push:
    branches:
      - feature/multi-request-v1.17.0
    paths:
      - .github/workflows/fix-v1170-review.yml

permissions:
  contents: write

jobs:
  patch-test-clean:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: feature/multi-request-v1.17.0
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Apply review fixes
        run: python3 tools/fix_v1170_review.py

      - name: Resolve enhancer local-name collision
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/ayuemin/ymnik/network/OpenRouterRequestEnhancer.kt')
          text = p.read_text(encoding='utf-8')
          text = text.replace('val snapshot = activeSnapshot()\n        val execution = context.getSharedPreferences("request_execution", Context.MODE_PRIVATE)\n        val chatId = effectiveChatId()\n        val messageId = snapshot?.messageId?.takeIf { chatId == snapshot.chatId }',
                              'val requestSnapshot = activeSnapshot()\n        val execution = context.getSharedPreferences("request_execution", Context.MODE_PRIVATE)\n        val chatId = effectiveChatId()\n        val messageId = requestSnapshot?.messageId?.takeIf { chatId == requestSnapshot.chatId }', 1)
          p.write_text(text, encoding='utf-8')
          PY

      - name: Verify safety wiring
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'requestChatId' app/src/main/java/com/ayuemin/ymnik/network/OpenRouterClient.kt
          grep -q 'effectiveChatId' app/src/main/java/com/ayuemin/ymnik/network/OpenRouterRequestEnhancer.kt
          grep -q 'fun reserveChat' app/src/main/java/com/ayuemin/ymnik/RequestExecutionManager.kt
          grep -q 'network.call(chat.id)' app/src/main/java/com/ayuemin/ymnik/ChatViewModel.kt
          grep -q 'Нельзя удалить чат, пока в нём выполняется работа' app/src/main/java/com/ayuemin/ymnik/ChatViewModel.kt

      - name: Unit tests and debug APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Commit tested fixes and remove temporary files
        shell: bash
        run: |
          set -euo pipefail
          git rm tools/fix_v1170_review.py .github/workflows/fix-v1170-review.yml
          git add app/src/main/java/com/ayuemin/ymnik
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fix v1.17.0 concurrent request safety"
          git push origin HEAD:feature/multi-request-v1.17.0

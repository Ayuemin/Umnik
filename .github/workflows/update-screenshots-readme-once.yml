name: Update screenshots README once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-screenshots-readme-once.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update README
        run: python3 .github/scripts/update-screenshots-readme.py

      - name: Commit README
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Ayuemin"
          git config user.email "105455063+Ayuemin@users.noreply.github.com"
          git add README.md
          git diff --cached --check
          git commit -m "Update screenshots in README"
          git push origin HEAD:main

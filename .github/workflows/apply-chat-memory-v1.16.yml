name: Apply chat memory v1.16

on:
  push:
    branches: [ "feature/chat-memory-v1.16.0" ]
    paths: [ ".github/workflows/apply-chat-memory-v1.16.yml" ]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/chat-memory-v1.16.0
          fetch-depth: 0
      - name: Apply prepared patch
        run: python .github/scripts/apply_chat_memory_v116.py
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add hybrid chat memory and context modes"
          git push origin HEAD:feature/chat-memory-v1.16.0

name: Prepare and publish Umnik v1.1.1

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/release-v1.1.1-once.yml"

permissions:
  contents: write
  actions: write

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump hotfix version and changelog
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's#// Umnik v1.1.0#// Umnik v1.1.1#' app/build.gradle.kts
          sed -i 's/versionCode = 28/versionCode = 29/' app/build.gradle.kts
          sed -i 's/versionName = "1.1.0"/versionName = "1.1.1"/' app/build.gradle.kts
          python3 -c 'from pathlib import Path; p=Path("CHANGELOG.md"); t=p.read_text(encoding="utf-8"); marker="## Unreleased\n"; section="## Unreleased\n\n## v1.1.1 - 2026-09-11\n\n- Дополнительные OpenAI-совместимые профили теперь намеренно работают в безопасном текстовом режиме: Umnik не включает фото, reasoning, tools или другие возможности, пока для них не реализован совместимый формат конкретного провайдера.\n- OpenRouter по-прежнему использует полный набор возможностей и автоматические метаданные моделей.\n"; assert marker in t; p.write_text(t.replace(marker, section, 1), encoding="utf-8")'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Commit and tag v1.1.1
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Ayuemin"
          git config user.email "105455063+Ayuemin@users.noreply.github.com"
          git add app/build.gradle.kts CHANGELOG.md
          git commit -m "Release Umnik v1.1.1"
          git tag v1.1.1
          git push origin HEAD:main
          git push origin v1.1.1

      - name: Dispatch signed release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run android-release.yml -R "${{ github.repository }}" -f tag=v1.1.1

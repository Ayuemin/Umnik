name: Apply Umnik 0.7.2 reasoning settings

on:
  push:
    branches: [ "main" ]
    paths:
      - "scripts/patch_reasoning_072.py"
      - ".github/workflows/apply-reasoning-072.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        run: python3 scripts/patch_reasoning_072.py

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/ayuemin/ymnik/ChatViewModel.kt
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Add per-model reasoning preferences"
          git push origin main

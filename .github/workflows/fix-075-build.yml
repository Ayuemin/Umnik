name: Fix Umnik 0.7.5 build

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fix-075-build.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply build fix
        run: python3 scripts/fix_075_build.py
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/ayuemin/ymnik/ChatViewModel.kt \
                  app/src/main/java/com/ayuemin/ymnik/ui/YmnikApp.kt
          git diff --cached --check
          git commit -m "Fix Umnik 0.7.5 custom sound build"
          git push origin HEAD:main

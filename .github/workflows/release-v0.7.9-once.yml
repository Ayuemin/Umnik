name: Prepare and publish Umnik v0.7.9

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/release-v0.7.9-once.yml"

permissions:
  contents: write
  actions: write

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply chat branching and message styling
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          app = Path("app/src/main/java/com/ayuemin/ymnik/ui/YmnikApp.kt")
          text = app.read_text(encoding="utf-8")

          call_old = '''                    onExportText = {
                        val file = vm.exportMessage(message)
                        fileToSave = file
                        save.launch(file.name)
                    },
                    onRetry = if (
'''
          call_new = '''                    onExportText = {
                        val file = vm.exportMessage(message)
                        fileToSave = file
                        save.launch(file.name)
                    },
                    onBranch = if (message.role == "assistant") {
                        { vm.branchFromMessage(message.id) }
                    } else null,
                    onRetry = if (
'''
          if call_old not in text:
              raise SystemExit("MessageCard call marker not found")
          text = text.replace(call_old, call_new, 1)

          start_marker = '@Composable\nprivate fun MessageCard('
          end_marker = '\nprivate enum class MessagePartKind'
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit("MessageCard block markers not found")

          new_card = r'''@Composable
private fun MessageCard(
    message: ChatMessage,
    tts: TtsController,
    onSaveGenerated: (GeneratedFile) -> Unit,
    onExportText: () -> Unit,
    onBranch: (() -> Unit)?,
    onRetry: (() -> Unit)?
) {
    val context = LocalContext.current
    val user = message.role == "user"
    val content = MaterialTheme.colorScheme.onSurface

    Column(
        modifier = Modifier.fillMaxWidth(),
        horizontalAlignment = if (user) Alignment.End else Alignment.Start
    ) {
        if (user) {
            Surface(
                modifier = Modifier.fillMaxWidth(0.86f),
                color = MaterialTheme.colorScheme.surfaceContainerHigh.copy(alpha = 0.45f),
                shape = RoundedCornerShape(18.dp),
                tonalElevation = 0.dp
            ) {
                Column(Modifier.padding(horizontal = 14.dp, vertical = 10.dp)) {
                    if (message.text.isNotBlank()) {
                        MessageBody(message.text, content)
                    }
                    message.attachmentNames.forEach { name ->
                        Spacer(Modifier.height(7.dp))
                        Row(verticalAlignment = Alignment.CenterVertically) {
                            Icon(
                                Icons.Outlined.AttachFile,
                                contentDescription = null,
                                modifier = Modifier.size(17.dp),
                                tint = MaterialTheme.colorScheme.onSurfaceVariant
                            )
                            Spacer(Modifier.width(5.dp))
                            Text(
                                name,
                                style = MaterialTheme.typography.bodySmall,
                                color = MaterialTheme.colorScheme.onSurfaceVariant
                            )
                        }
                    }
                }
            }
        } else {
            Column(
                modifier = Modifier
                    .fillMaxWidth()
                    .padding(horizontal = 4.dp)
            ) {
                if (message.text.isNotBlank()) {
                    MessageBody(message.text, content)
                }
                message.generatedFiles.forEach { file ->
                    Spacer(Modifier.height(10.dp))
                    GeneratedFileCard(file, onSaveGenerated)
                }
            }
        }

        if (user && message.text.isNotBlank()) {
            Row(
                modifier = Modifier.padding(end = 4.dp, top = 2.dp),
                verticalAlignment = Alignment.CenterVertically
            ) {
                CompactMessageAction(
                    icon = Icons.Outlined.ContentCopy,
                    description = "Копировать своё сообщение",
                    onClick = { copyText(context, message.text) }
                )
                if (onRetry != null) {
                    CompactMessageAction(
                        icon = Icons.Outlined.Refresh,
                        description = "Спросить ещё раз",
                        onClick = onRetry
                    )
                }
            }
        }

        if (!user && (message.text.isNotBlank() || message.generatedFiles.isNotEmpty())) {
            Row(
                modifier = Modifier.padding(start = 4.dp, top = 2.dp),
                verticalAlignment = Alignment.CenterVertically
            ) {
                CompactMessageAction(
                    icon = Icons.Outlined.ContentCopy,
                    description = "Копировать ответ",
                    onClick = { copyText(context, message.text) }
                )
                CompactMessageAction(
                    icon = Icons.Outlined.Share,
                    description = "Поделиться",
                    onClick = { shareText(context, message.text) }
                )
                if (message.text.isNotBlank()) {
                    CompactMessageAction(
                        icon = if (tts.speakingMessageId == message.id) Icons.Outlined.StopCircle else Icons.Outlined.VolumeUp,
                        description = if (tts.speakingMessageId == message.id) "Остановить озвучку" else "Озвучить",
                        active = tts.speakingMessageId == message.id,
                        onClick = { tts.toggle(message.id, message.text) }
                    )
                    CompactMessageAction(
                        icon = Icons.Outlined.Download,
                        description = "Сохранить ответ файлом",
                        onClick = onExportText
                    )
                }
                if (onBranch != null) {
                    TextButton(
                        onClick = onBranch,
                        contentPadding = PaddingValues(horizontal = 8.dp, vertical = 0.dp),
                        modifier = Modifier.height(34.dp)
                    ) {
                        Icon(
                            Icons.Outlined.AddComment,
                            contentDescription = null,
                            modifier = Modifier.size(17.dp)
                        )
                        Spacer(Modifier.width(4.dp))
                        Text("Ветка в новом чате", style = MaterialTheme.typography.labelMedium)
                    }
                }
            }
        }
    }
}
'''
          text = text[:start] + new_card + text[end:]
          app.write_text(text, encoding="utf-8")

          vm = Path("app/src/main/java/com/ayuemin/ymnik/ChatViewModel.kt")
          vm_text = vm.read_text(encoding="utf-8")
          switch_marker = '\n    fun switchChat(id: String) {'
          if switch_marker not in vm_text:
              raise SystemExit("switchChat marker not found")

          branch_method = r'''

    fun branchFromMessage(messageId: String): String? {
        cleanupTempAttachments(_state.value.pendingAttachments)
        if (_state.value.isLoading) return null

        val source = _state.value.chats.firstOrNull { it.id == _state.value.currentChatId } ?: return null
        val messageIndex = source.messages.indexOfFirst { it.id == messageId }
        if (messageIndex < 0) return null

        val branchId = UUID.randomUUID().toString()
        val now = System.currentTimeMillis()
        val branchedMessages = source.messages
            .take(messageIndex + 1)
            .map { message -> message.copy(id = UUID.randomUUID().toString()) }

        val copiedFiles = source.chatFiles.orEmpty().mapNotNull { file ->
            runCatching {
                chatFilesRepository.importFile(
                    branchId,
                    PendingAttachment(
                        uri = "branch://${file.id}",
                        name = file.name,
                        mimeType = file.mimeType,
                        size = file.size,
                        localPath = file.localPath
                    )
                )
            }.getOrNull()
        }

        val branchTitle = "Ветка: ${source.title}".take(80)
        val branch = ChatSession(
            id = branchId,
            title = branchTitle,
            messages = branchedMessages,
            projectId = source.projectId,
            mode = source.mode ?: _state.value.mode,
            textModelOverride = source.textModelOverride,
            chatFiles = copiedFiles,
            assignedRole = source.assignedRole,
            masterPrompt = source.masterPrompt,
            createdAt = now,
            updatedAt = now
        )
        val chats = listOf(branch) + _state.value.chats
        val modelId = branch.textModelOverride ?: _state.value.textModel
        val info = _state.value.availableTextModels.firstOrNull { it.id == modelId }
        val effort = preferredReasoningEffort(modelId, info)
        val keepReasoning = reasoningStillValid(info, effort)

        chatsRepository.save(chats)
        prefs.edit()
            .putString("current_chat_id", branch.id)
            .putString("chat_mode", (branch.mode ?: _state.value.mode).name)
            .putString("reasoning_effort", effort.name)
            .putBoolean("reasoning_enabled", keepReasoning)
            .apply()

        _state.value = _state.value.copy(
            chats = chats,
            currentChatId = branch.id,
            messages = branchedMessages,
            mode = branch.mode ?: _state.value.mode,
            currentChatTextModel = branch.textModelOverride,
            reasoningEffort = effort,
            reasoningEnabled = keepReasoning,
            pendingAttachments = emptyList(),
            storedFiles = storageRepository.list(),
            storageStats = storageRepository.stats(),
            status = "Ветка открыта в новом чате"
        )
        return branch.id
    }
'''
          vm_text = vm_text.replace(switch_marker, branch_method + switch_marker, 1)
          vm.write_text(vm_text, encoding="utf-8")

          gradle = Path("app/build.gradle.kts")
          g = gradle.read_text(encoding="utf-8")
          g = g.replace("// Umnik v0.7.8", "// Umnik v0.7.9", 1)
          g = g.replace("versionCode = 25", "versionCode = 26", 1)
          g = g.replace('versionName = "0.7.8"', 'versionName = "0.7.9"', 1)
          gradle.write_text(g, encoding="utf-8")

          changelog = Path("CHANGELOG.md")
          c = changelog.read_text(encoding="utf-8")
          marker = "## Unreleased\n"
          entry = '''## Unreleased

## v0.7.9 - 2026-09-11

- Ответы модели теперь отображаются прямо на фоне чата без отдельной карточки.
- Сообщения пользователя получили более лёгкое, едва заметное выделение.
- Под ответами модели добавлена кнопка «Ветка в новом чате»: она создаёт независимую копию диалога до выбранного ответа и позволяет продолжить разговор отдельно.
'''
          if marker not in c:
              raise SystemExit("CHANGELOG marker not found")
          c = c.replace(marker, entry, 1)
          changelog.write_text(c, encoding="utf-8")
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Verify debug build
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Commit release changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/ayuemin/ymnik/ui/YmnikApp.kt \
                  app/src/main/java/com/ayuemin/ymnik/ChatViewModel.kt \
                  app/build.gradle.kts CHANGELOG.md
          git commit -m "Add chat branching and modern message styling"
          git push origin HEAD:main

      - name: Create v0.7.9 tag
        shell: bash
        run: |
          set -euo pipefail
          git tag v0.7.9
          git push origin v0.7.9

      - name: Dispatch signed release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run android-release.yml -f tag=v0.7.9

name: Patch Umnik 1.3.7 once

on:
  push:
    branches: [main]
    paths:
      - .github/run-patch-v1.3.7

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply source changes
        shell: bash
        run: |
          set -euo pipefail
          python tools/prepare_v1_3_7.py
          python tools/apply_v1_3_7.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Compile debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Commit v1.3.7 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Ayuemin"
          git config user.email "105455063+Ayuemin@users.noreply.github.com"
          git add \
            app/build.gradle.kts \
            CHANGELOG.md \
            app/src/main/res/xml/file_paths.xml \
            app/src/main/java/com/ayuemin/ymnik/ChatViewModel.kt \
            app/src/main/java/com/ayuemin/ymnik/ui/YmnikApp.kt \
            app/src/main/java/com/ayuemin/ymnik/network/OpenRouterClient.kt \
            app/src/main/java/com/ayuemin/ymnik/network/CompatibleApiClient.kt \
            app/src/main/java/com/ayuemin/ymnik/network/NvidiaImageClient.kt \
            app/src/main/java/com/ayuemin/ymnik/network/ProviderRegistry.kt
          git diff --cached --check
          git commit -m "Prepare v1.3.7 diagnostics"
          git push origin HEAD:main

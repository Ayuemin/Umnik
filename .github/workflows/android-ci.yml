name: Android CI

on:
  push:
    branches: [ "main", "work/**" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    # Every main/PR run is full. Work branches use a fast debug+tests pass
    # unless their HEAD commit contains [full ci], marking a milestone.
    env:
      UMNIK_FULL_CI: ${{ github.ref == 'refs/heads/main' || github.event_name == 'pull_request' || contains(github.event.head_commit.message, '[full ci]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify core contracts architecture
        run: python3 scripts/check_contracts_module.py

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 15859902
          packages: platform-tools

      - name: Install Android 17 platform
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6
        with:
          # Enable branch-scoped cache writes while developing, not just on main.
          cache-read-only: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/heads/work/') }}

      - name: Fast checks - unit tests and debug APK
        if: env.UMNIK_FULL_CI != 'true'
        run: ./gradlew --no-daemon :core:contracts:test :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Full checks - lint, unit tests, debug APK and R8 release APK
        if: env.UMNIK_FULL_CI == 'true'
        run: ./gradlew --no-daemon :core:contracts:test :app:lintDebug :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Verify bundled offline Russian dictation
        if: startsWith(github.ref, 'refs/heads/work/')
        run: python3 scripts/verify_offline_dictation_apk.py app/build/outputs/apk/debug/app-debug.apk

      - name: Upload work-branch debug APK
        if: startsWith(github.ref, 'refs/heads/work/')
        uses: actions/upload-artifact@v4
        with:
          name: Umnik-DEBUG-separate-app
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

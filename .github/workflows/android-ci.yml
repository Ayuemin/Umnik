name: Android CI

on:
  push:
    branches: [ "main", "work/**" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Apply precise OpenRouter usage display on test branch
        if: github.ref == 'refs/heads/work/local-shell-mvp'
        run: |
          FILE=app/src/main/java/com/ayuemin/ymnik/ui/YmnikApp.kt
          sed -i 's/"%.2f".format(Locale.US, value.coerceAtLeast(0.0))/"%.5f".format(Locale.US, value.coerceAtLeast(0.0))/' "$FILE"
          if git diff --quiet -- "$FILE"; then
            echo "Expected formatUsd change was not applied"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          git commit -m "Show OpenRouter usage to five decimals"
          git push origin HEAD:work/local-shell-mvp

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 15859902
          packages: platform-tools

      - name: Install Android 17 platform
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Lint, tests, debug APK and unsigned release APK
        run: ./gradlew --no-daemon :app:lintDebug :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Upload work-branch debug APK
        if: startsWith(github.ref, 'refs/heads/work/')
        uses: actions/upload-artifact@v4
        with:
          name: Umnik-DEBUG-separate-app
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

name: Android CI

on:
  push:
    branches: [ "main", "work/**" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Apply and commit validated beta.29 source patch
        if: github.ref == 'refs/heads/work/local-shell-mvp' && hashFiles('.github/dev/apply_beta29_step1.py') != ''
        run: |
          python3 .github/dev/apply_beta29_step1.py
          rm -f .github/dev/apply_beta29_step1.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app .github/dev
          git commit -m "Apply beta.29 agent safety fixes"
          git push origin "HEAD:${GITHUB_REF_NAME}"

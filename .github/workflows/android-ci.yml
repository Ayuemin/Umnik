name: Android CI

on:
  push:
    branches: [ "main", "work/**" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 15859902
          packages: platform-tools

      - name: Install Android 17 platform
        run: sdkmanager "platforms;android-37" "build-tools;37.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Lint, unit tests and debug APK
        run: ./gradlew --no-daemon :app:lintDebug :app:testDebugUnitTest :app:assembleDebug --stacktrace

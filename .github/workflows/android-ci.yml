name: Android CI

on:
  push:
    branches: [ "main", "work/**" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Apply one-shot beta.29 historical attachment patch
        id: dev_patch
        if: github.ref == 'refs/heads/work/local-shell-mvp' && hashFiles('.github/dev/apply_beta29_step3.py') != ''
        run: |
          python3 .github/dev/apply_beta29_step3.py
          echo "applied=true" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 15859902
          packages: platform-tools

      - name: Install Android 17 platform
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Lint, tests, debug APK and unsigned release APK
        run: ./gradlew --no-daemon :app:lintDebug :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Commit validated beta.29 historical attachment source patch
        if: success() && steps.dev_patch.outputs.applied == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/dev/apply_beta29_step3.py
          git add app .github/dev
          git commit -m "Rehydrate referenced historical chat attachments"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload work-branch debug APK
        if: startsWith(github.ref, 'refs/heads/work/')
        uses: actions/upload-artifact@v4
        with:
          name: Umnik-DEBUG-separate-app
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

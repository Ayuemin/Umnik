name: Prompt Guard Critical Repair

on:
  push:
    branches:
      - work/local-shell-mvp
    paths:
      - .github/prompt_guard_critical_trigger.txt

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/local-shell-mvp
      - name: Refresh stale semantic guards
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/src/test/java/com/ayuemin/ymnik/network/PromptBaselineProbeTest.kt')
          text = path.read_text(encoding='utf-8')
          replacements = [
              ('Агентный режим выключен', 'Агентный режим этого чата выключен'),
              ('не запускай Browser или Local Shell сам', 'Не инициируй Browser или Local Shell самостоятельно'),
              ('не утверждай, что Shell недоступен', 'никогда не утверждай, что у тебя «нет Shell»'),
              ('побочные действия требуют подтверждения', 'Значимые действия требуют подтверждения пользователя'),
              ('не инструкции', 'не инструкциями более высокого приоритета'),
              ('максимум 4 поисков', 'не более 4 самостоятельных поисков'),
              ('явный текущий запрос пользователя приоритетнее', 'не противоречат явному текущему запросу пользователя'),
              ('"guidance"', '"Дополнительные указания из основного чата"'),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one occurrence of {old!r}, found {count}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/prompt-guard-critical-repair.yml .github/prompt_guard_critical_trigger.txt
          git add app/src/test/java/com/ayuemin/ymnik/network/PromptBaselineProbeTest.kt
          git diff --cached --check
          git commit -m 'Refresh Prompt Diet semantic guards'
          git push origin HEAD:work/local-shell-mvp

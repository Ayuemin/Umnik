name: Update Umnik v1.10.9

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-v1.10.9.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply v1.10.9 changes
        run: python3 .github/scripts/update_v1_10_9.py

      - name: Check diff
        run: |
          git diff --check
          git diff --stat

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Compile and test
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Commit tested update
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/update-v1.10.9.yml .github/scripts/update_v1_10_9.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release Umnik 1.10.9: simplify project workflow"
          git push origin HEAD:main

      - name: Create release tag
        shell: bash
        run: |
          set -euo pipefail
          git tag -a v1.10.9 -m "Umnik v1.10.9"
          git push origin v1.10.9

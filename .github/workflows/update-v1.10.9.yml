          s = s.replace('versionName = "1.10.8"', 'versionName = "1.10.9"', 1)
          path.write_text(s)

          # ---------- changelog ----------
          path = Path("CHANGELOG.md")
          s = path.read_text()
          marker = '## Unreleased\n'
          entry = '''## v1.10.9 - 2026-09-15

- Меню `+` окончательно разделяет быстрые действия: «Навыки» управляют навыками только текущего чата, а «Проект» показывает только инструменты текущего проекта и неактивен вне проекта.
- Внутри `+ → Проект` остаются только быстрые действия по рабочему контексту: запуск этапов в текущем чате и включение/выключение навыков этого чата. Настройки проекта из рабочего меню убраны.
- На боковой панели появилась заметная кнопка «Создать проект» над списком проектов.
- Нажатие на существующий проект открывает его рабочее окно: новый чат, кнопка настроек и список чатов проекта. Этапы, постоянные файлы, стартовые навыки и мастер-инструкция перенесены в отдельные настройки проекта.
- Управление общей библиотекой навыков перенесено в сворачиваемый раздел «Настройки → Навыки». Подключение навыков выполняется из текущего чата.
- Версия: 1.10.9 / versionCode 109.

'''
          if entry.splitlines()[0] not in s:
              s = s.replace(marker, marker + '\n' + entry, 1)
          path.write_text(s)
          PY

      - name: Check diff
        run: |
          git diff --check
          git diff --stat

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Compile and test
        run: |
          gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Commit tested update
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/update-v1.10.9.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release Umnik 1.10.9: simplify project workflow"
          git push origin HEAD:main

      - name: Create release tag
        shell: bash
        run: |
          set -euo pipefail
          git tag -a v1.10.9 -m "Umnik v1.10.9"
          git push origin v1.10.9

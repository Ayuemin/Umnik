name: Patch usage guide v1.17.0

on:
  push:
    branches:
      - feature/multi-request-v1.17.0
    paths:
      - "tools/patch_usage_guide_v1170.py"
      - ".github/workflows/patch-usage-guide-v1170.yml"

permissions:
  contents: write

jobs:
  patch-test-clean:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: feature/multi-request-v1.17.0
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Patch in-app guide
        run: python3 tools/patch_usage_guide_v1170.py

      - name: Unit tests and debug APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Commit guide and remove temporary patch files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f tools/patch_usage_guide_v1170.py .github/workflows/patch-usage-guide-v1170.yml
          git add app/src/main/java/com/ayuemin/ymnik/help/UmnikUsageGuide.kt
          git commit -m "Document parallel Orchestrator in the in-app guide"
          git push origin HEAD:feature/multi-request-v1.17.0

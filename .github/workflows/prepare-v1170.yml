name: Prepare v1.17.0

on:
  push:
    branches:
      - feature/multi-request-v1.17.0
    paths:
      - "tools/prepare_v1170_release.py"
      - ".github/workflows/prepare-v1170.yml"

permissions:
  contents: write

jobs:
  prepare-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: feature/multi-request-v1.17.0
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Prepare v1.17.0
        run: python3 tools/prepare_v1170_release.py

      - name: Unit tests and debug APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Commit tested release preparation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts CHANGELOG.md README.md docs/ORCHESTRATOR.md app/src/main/java/com/ayuemin/ymnik/ui/YmnikApp.kt app/src/main/java/com/ayuemin/ymnik/help/UmnikUsageGuide.kt
          if git diff --cached --quiet; then
            echo "No release-preparation changes"
          else
            git commit -m "Prepare Umnik v1.17.0"
            git push origin HEAD:feature/multi-request-v1.17.0
          fi

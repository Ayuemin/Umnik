name: Wire server recovery once

on:
  push:
    branches:
      - "test/server-mode-v1.18"
    paths:
      - ".github/workflows/server-recovery-wire-once.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: test/server-mode-v1.18
          fetch-depth: 0
      - name: Patch OpenRouterClient
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("app/src/main/java/com/ayuemin/ymnik/network/OpenRouterClient.kt")
          text = path.read_text()
          if "import com.ayuemin.ymnik.ServerJobRecoveryWorker" not in text:
              text = text.replace("import com.ayuemin.ymnik.RequestExecutionManager\n", "import com.ayuemin.ymnik.RequestExecutionManager\nimport com.ayuemin.ymnik.ServerJobRecoveryWorker\n", 1)
          if "private val serverRecoveryStore" not in text:
              text = text.replace("    private val serverApi = UmnikServerClient()\n", "    private val serverApi = UmnikServerClient()\n    private val serverRecoveryStore = ServerJobRecoveryStore(context.applicationContext)\n", 1)
          old_cancel = "        requestId?.takeIf { it.isNotBlank() }?.let { id ->\n            recoveryStore.remove(id)\n            OpenRouterRecoveryWorker.cancel(context, id)\n        }\n"
          new_cancel = "        requestId?.takeIf { it.isNotBlank() }?.let { id ->\n            recoveryStore.remove(id)\n            OpenRouterRecoveryWorker.cancel(context, id)\n            serverRecoveryStore.remove(id)\n            ServerJobRecoveryWorker.cancel(context, id)\n        }\n"
          if "ServerJobRecoveryWorker.cancel(context, id)" not in text:
              assert old_cancel in text
              text = text.replace(old_cancel, new_cancel, 1)
          anchor = "    val clientRequestId = stableServerRequestId(payloadJson)\n    phaseCallback(\"Передаю задачу личному серверу…\")\n"
          insert = "    val clientRequestId = stableServerRequestId(payloadJson)\n    val recoverySnapshot = requestId?.takeIf { it.isNotBlank() }\n        ?.let(RequestExecutionManager::snapshotForRequest)\n        ?.takeIf { recoveryEnabled && requestChatId == it.chatId }\n    recoverySnapshot?.let { snapshot ->\n        val record = ServerJobRecoveryRecord(\n            requestId = snapshot.requestId,\n            chatId = snapshot.chatId,\n            messageId = snapshot.messageId,\n            clientRequestId = clientRequestId,\n            serverBaseUrl = serverBaseUrl,\n            payloadJson = payloadJson,\n            modelId = payload.get(\"model\")?.asString.orEmpty()\n        )\n        serverRecoveryStore.put(record)\n        ServerJobRecoveryWorker.schedule(context, snapshot.requestId)\n    }\n    phaseCallback(\"Передаю задачу личному серверу…\")\n"
          if "val recoverySnapshot = requestId?" not in text:
              assert anchor in text
              text = text.replace(anchor, insert, 1)
          old_return = "    DiagnosticLog.record(\n        context,\n        \"SERVER_COMPLETION\",\n        \"Umnik server job=${initial.id.take(12)} model=${payload.get(\"model\")?.asString.orEmpty()} finish=${completion.finishReason}\"\n    )\n    return completion\n"
          new_return = "    DiagnosticLog.record(\n        context,\n        \"SERVER_COMPLETION\",\n        \"Umnik server job=${initial.id.take(12)} model=${payload.get(\"model\")?.asString.orEmpty()} finish=${completion.finishReason}\"\n    )\n    recoverySnapshot?.let { snapshot ->\n        serverRecoveryStore.remove(snapshot.requestId)\n        ServerJobRecoveryWorker.cancel(context, snapshot.requestId)\n    }\n    return completion\n"
          if "serverRecoveryStore.remove(snapshot.requestId)" not in text:
              assert old_return in text
              text = text.replace(old_return, new_return, 1)
          path.write_text(text)
          Path(".github/workflows/server-recovery-wire-once.yml").unlink()
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Recover server jobs after Android process death"
          git push origin HEAD:test/server-mode-v1.18

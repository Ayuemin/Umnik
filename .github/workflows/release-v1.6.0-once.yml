name: Release v1.6.0 once

on:
  push:
    branches: [main]
    paths: [".github/workflows/release-v1.6.0-once.yml"]

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Start signed release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run android-release.yml --repo "$GITHUB_REPOSITORY" --ref main -f tag=v1.6.0

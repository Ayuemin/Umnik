name: Apply v1.10.0

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/apply-v1.10.0.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Apply source migration
        run: python3 tools/patch_v1_10_0.py

      - name: Verify intended changes
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionName = "1.10.0"' app/build.gradle.kts
          grep -q 'versionCode = 100' app/build.gradle.kts
          grep -q 'filter { it.projectId == null }' app/src/main/java/com/ayuemin/ymnik/ui/NavigationSidebar.kt
          grep -q 'Разбить по строкам' app/src/main/java/com/ayuemin/ymnik/ui/OpenRouterHub.kt
          grep -q 'Памятка по использованию Umnik' app/src/main/java/com/ayuemin/ymnik/help/UmnikUsageGuide.kt

      - name: Unit tests and debug APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Commit verified source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts CHANGELOG.md \
            app/src/main/java/com/ayuemin/ymnik/help/UmnikUsageGuide.kt \
            app/src/main/java/com/ayuemin/ymnik/ui/NavigationSidebar.kt \
            app/src/main/java/com/ayuemin/ymnik/ChatViewModel.kt \
            app/src/main/java/com/ayuemin/ymnik/ui/OpenRouterHub.kt \
            app/src/main/java/com/ayuemin/ymnik/ui/OpenRouterHubController.kt \
            app/src/main/java/com/ayuemin/ymnik/OpenRouterBackgroundWorker.kt \
            app/src/main/java/com/ayuemin/ymnik/ui/YmnikApp.kt
          git commit -m "release: prepare Umnik v1.10.0"
          git push origin HEAD:main

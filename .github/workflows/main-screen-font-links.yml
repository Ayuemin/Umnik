name: Main screen links and fonts

on:
  push:
    branches:
      - work/local-shell-mvp
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: "github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[ui-links-fonts-applied]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/local-shell-mvp
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Apply guarded UI edits
        run: python .github/scripts/apply_ui_links_fonts.py
      - name: Build and tests
        run: ./gradlew testDebugUnitTest assembleDebug --no-daemon
      - name: Commit UI changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/ayuemin/ymnik/ui/YmnikApp.kt app/src/main/java/com/ayuemin/ymnik/ui/SettingsScreen.kt
          git diff --cached --check
          git commit -m "[ui-links-fonts-applied] Add clickable links and custom fonts"
          git push origin HEAD:work/local-shell-mvp

name: Mark provider releases as prerelease

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/mark-provider-releases-prerelease-once.yml"

permissions:
  contents: write

jobs:
  fix-release-metadata:
    runs-on: ubuntu-latest
    steps:
      - name: Mark provider builds as testing releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh release edit v1.1.0 --repo "$GH_REPO" --prerelease --title "Umnik v1.1.0 (тестовая)"
          gh release edit v1.1.1 --repo "$GH_REPO" --prerelease --title "Umnik v1.1.1 (тестовая)"
          gh release edit v1.0.0 --repo "$GH_REPO" --latest

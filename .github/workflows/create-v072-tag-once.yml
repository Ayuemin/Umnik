name: Dispatch Umnik v0.7.2 release once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/create-v072-tag-once.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Start signed v0.7.2 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run android-release.yml --repo Ayuemin/Umnik --ref main -f tag=v0.7.2

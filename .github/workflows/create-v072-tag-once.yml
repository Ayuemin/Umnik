name: Create Umnik v0.7.2 tag once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/create-v072-tag-once.yml"

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag clean release commit
        shell: bash
        run: |
          set -euo pipefail
          TARGET=$(git rev-parse HEAD^)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a v0.7.2 "$TARGET" -m "Umnik v0.7.2"
          git push origin v0.7.2

name: Update repository metadata once

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/update-repo-metadata-once.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Update repository description and topics
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PATCH "repos/$GITHUB_REPOSITORY" \
            -f description='Android-клиент для OpenRouter: мультимодальный чат, проекты, навыки, файлы и смена моделей без потери контекста.'
          gh api --method PUT "repos/$GITHUB_REPOSITORY/topics" \
            -f 'names[]=android' \
            -f 'names[]=kotlin' \
            -f 'names[]=jetpack-compose' \
            -f 'names[]=openrouter' \
            -f 'names[]=llm' \
            -f 'names[]=ai-assistant' \
            -f 'names[]=multimodal' \
            -f 'names[]=material3' \
            -f 'names[]=local-first'

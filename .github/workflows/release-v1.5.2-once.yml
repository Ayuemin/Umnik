name: Release v1.5.2 once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/release-v1.5.2-once.yml"

permissions:
  contents: write
  actions: write

jobs:
  dispatch:
    runs-on: macos-latest
    steps:
      - name: Create v1.5.2 tag and start signed release
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: b35d2c592ef6f178194a9edad6b473b2863e8e51
        run: |
          set -euo pipefail
          if gh release view v1.5.2 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v1.5.2 already exists"
            exit 0
          fi
          if ! gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v1.5.2" >/dev/null 2>&1; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref='refs/tags/v1.5.2' \
              -f sha="$TARGET_SHA"
          fi
          gh workflow run android-release.yml --repo "$GITHUB_REPOSITORY" --ref main -f tag=v1.5.2

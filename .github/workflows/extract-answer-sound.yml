name: One-off answer sound extraction

on:
  push:
    branches:
      - work/modernize-sdk37
    paths:
      - tools/extract-answer-sound.py

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/modernize-sdk37
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python tools/extract-answer-sound.py
      - name: Commit refactor
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/ayuemin/ymnik/ChatViewModel.kt
          git commit -m "Use dedicated answer sound player"
          git push origin HEAD:work/modernize-sdk37

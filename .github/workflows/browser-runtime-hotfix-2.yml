name: Browser Runtime Hotfix 2

on:
  push:
    branches:
      - "work/local-shell-mvp"
    paths:
      - ".github/workflows/browser-runtime-hotfix-2.yml"

permissions:
  contents: write

jobs:
  patch-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: work/local-shell-mvp
          fetch-depth: 0

      - name: Patch blank snapshot guard
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/src/main/java/com/ayuemin/ymnik/browser/LocalBrowserRuntime.kt")
          text = path.read_text(encoding="utf-8")
          old = "\n".join([
              "        fun snapshotMatchesWebView(value: JsonObject, actualUrl: String): Boolean {",
              "            val pageUrl = value.get(\"url\")?.asString.orEmpty()",
              "            if (pageUrl.isBlank() || actualUrl.isBlank() || actualUrl == \"about:blank\") return true",
              "            if (!pageUrl.startsWith(\"http://\") && !pageUrl.startsWith(\"https://\")) return true",
              "            return sameDocumentUrl(pageUrl, actualUrl)",
              "        }",
          ])
          new = "\n".join([
              "        fun snapshotMatchesWebView(value: JsonObject, actualUrl: String): Boolean {",
              "            val pageUrl = value.get(\"url\")?.asString.orEmpty()",
              "            fun isWebUrl(url: String): Boolean =",
              "                url.startsWith(\"http://\") || url.startsWith(\"https://\")",
              "",
              "            val expectedWebUrl = sequenceOf(",
              "                session.lastNavigationFinishedUrl,",
              "                session.lastNavigationStartedUrl,",
              "                session.currentUrl",
              "            ).firstOrNull(::isWebUrl).orEmpty()",
              "",
              "            if (expectedWebUrl.isNotBlank()) {",
              "                if (!isWebUrl(actualUrl) || !isWebUrl(pageUrl)) return false",
              "                return sameDocumentUrl(pageUrl, actualUrl) &&",
              "                    sameDocumentUrl(pageUrl, expectedWebUrl)",
              "            }",
              "",
              "            if (pageUrl.isBlank() || actualUrl.isBlank()) return true",
              "            if (pageUrl == \"about:blank\" || actualUrl == \"about:blank\") return pageUrl == actualUrl",
              "            if (!isWebUrl(pageUrl) || !isWebUrl(actualUrl)) return pageUrl == actualUrl",
              "            return sameDocumentUrl(pageUrl, actualUrl)",
              "        }",
          ])
          if text.count(old) != 1:
              raise SystemExit(f"Expected snapshot guard exactly once, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Verify patch
        shell: bash
        run: |
          grep -n "expectedWebUrl" app/src/main/java/com/ayuemin/ymnik/browser/LocalBrowserRuntime.kt
          git diff --check

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/ayuemin/ymnik/browser/LocalBrowserRuntime.kt
          git commit -m "Fix Local Browser blank snapshot race"
          git push origin HEAD:work/local-shell-mvp

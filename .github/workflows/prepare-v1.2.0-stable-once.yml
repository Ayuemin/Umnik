name: Prepare v1.2.0 stable once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/prepare-v1.2.0-stable-once.yml"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare stable version and docs
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          build = Path('app/build.gradle.kts')
          text = build.read_text()
          text = text.replace('// Umnik v1.2.0-beta.7', '// Umnik v1.2.0')
          text = text.replace('versionCode = 36', 'versionCode = 37')
          text = text.replace('versionName = "1.2.0-beta.7"', 'versionName = "1.2.0"')
          build.write_text(text)

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text()
          marker = '## Unreleased\n'
          stable = '''## v1.2.0 - 2026-09-11\n\n- Стабильный релиз после серии beta 1.2.0.\n- Добавлены несколько подключений: встроенный OpenRouter и произвольные OpenAI-совместимые API, с автоматическим выбором нужного подключения при переключении быстрой модели.\n- Генерация изображений работает как изолированный запрос внутри обычного чата; модель изображений выбирается отдельно, а для OpenRouter доступны поддерживаемые моделью соотношение сторон и разрешение.\n- Для несовместимых сочетаний размера и формата Umnik умеет безопасно повторить запрос с разрешением «Авто», сохраняя выбранное соотношение сторон.\n- Добавлены голосовые сообщения: микрофон активен только у моделей OpenRouter с аудиовходом, запись отправляется как WAV без предварительного распознавания в текст.\n- Исправлен звук готового ответа и упрощены уведомления интерфейса.\n- Сохранены проекты, навыки, локальные файлы, ветвление чатов, Markdown, TTS, reasoning и web search.\n\n'''
          if '## v1.2.0 - 2026-09-11' not in text:
              text = text.replace(marker, marker + '\n' + stable, 1)
          changelog.write_text(text)

          privacy = Path('PRIVACY.md')
          text = privacy.read_text()
          section = '''## Микрофон и голосовые сообщения\n\nРазрешение на микрофон используется только после явного запуска записи пользователем. Umnik не ведёт постоянную или фоновую запись. Голосовое сообщение сначала создаётся локально на устройстве в виде WAV-файла и отправляется во внешний API только после действия пользователя на отправку. При отмене записи она не отправляется модели.\n\n'''
          if '## Микрофон и голосовые сообщения' not in text:
              text = text.replace('## Web search\n', section + '## Web search\n', 1)
          privacy.write_text(text)

          readme = Path('README.md')
          text = readme.read_text()
          text = text.replace(
              'A local-first Android client for OpenRouter with multimodal chat, projects, skills and per-chat model switching.',
              'A local-first Android client for OpenRouter and OpenAI-compatible APIs with multimodal chat, projects, skills and per-chat model switching.'
          )
          needle = '- панель действий по кнопке `+`: файл, камера, создание изображений, web search и reasoning;\n'
          addition = needle + '- голосовые сообщения через микрофон для моделей OpenRouter с поддержкой аудиовхода;\n- отдельные параметры генерации изображений, включая поддерживаемые моделью соотношение сторон и разрешение;\n'
          if '- голосовые сообщения через микрофон' not in text:
              text = text.replace(needle, addition, 1)
          text = text.replace(
              '- собственный API-ключ OpenRouter;\n- интернет для запросов к OpenRouter.\n\nПосле установки откройте **Настройки**, добавьте API-ключ, обновите список моделей и выберите основную модель.',
              '- настроенное подключение: API-ключ OpenRouter или адрес OpenAI-совместимого API;\n- доступ к сети для облачных API (для локального совместимого API требования зависят от его размещения).\n\nПосле установки откройте **Настройки → Подключения**, настройте нужный API, обновите список моделей и выберите основную модель.'
          )
          text = text.replace(
              'При обращении к модели текст и выбранные вложения отправляются в OpenRouter и далее могут обрабатываться выбранным провайдером модели. Подробности: [PRIVACY.md](PRIVACY.md).',
              'При обращении к модели текст и выбранные вложения отправляются в активное подключение. Для OpenRouter данные далее могут обрабатываться выбранным провайдером модели; для другого профиля они отправляются на указанный пользователем API-адрес. Подробности: [PRIVACY.md](PRIVACY.md).'
          )
          readme.write_text(text)
          PY

          git diff --check
          grep -q 'versionName = "1.2.0"' app/build.gradle.kts
          grep -q '^## v1.2.0 - 2026-09-11$' CHANGELOG.md
          grep -q '^## Микрофон и голосовые сообщения$' PRIVACY.md

      - name: Repository sanity checks
        shell: bash
        run: |
          set -euo pipefail
          test ! -n "$(git ls-files | grep -E '\.(jks|keystore|p12|pfx|pem|apk)$' || true)"
          if git grep -n -E 'sk-or-v1-[A-Za-z0-9_-]{20,}|AIza[0-9A-Za-z_-]{20,}' -- ':!CHANGELOG.md' ':!README.md'; then
            echo 'Possible secret found in tracked files.'
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Commit stable preparation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Ayuemin"
          git config user.email "105455063+Ayuemin@users.noreply.github.com"
          git add app/build.gradle.kts CHANGELOG.md PRIVACY.md README.md
          git commit -m "Prepare Umnik v1.2.0 stable"
          git push origin HEAD:main

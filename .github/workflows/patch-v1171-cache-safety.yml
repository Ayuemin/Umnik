name: Patch v1.17.1 cache safety

on:
  push:
    branches: [ "fix/background-recovery-v1.17.1" ]
    paths:
      - ".github/scripts/apply_v1171_cache_safety.py"
      - ".github/workflows/patch-v1171-cache-safety.yml"

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: fix/background-recovery-v1.17.1
          fetch-depth: 0

      - name: Apply cache safety patch
        run: python3 .github/scripts/apply_v1171_cache_safety.py

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Unit tests and debug APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Commit verified cache safety and remove scaffolding
        run: |
          rm -f .github/scripts/apply_v1171_cache_safety.py
          rm -f .github/workflows/patch-v1171-cache-safety.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Require confirmed response cache for recovery"
          git push origin HEAD:fix/background-recovery-v1.17.1

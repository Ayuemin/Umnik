name: Patch v1.16.3

on:
  push:
    branches: ["fix/background-navigation-v1.16.3"]
    paths:
      - ".github/workflows/patch-v1.16.3.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/background-navigation-v1.16.3
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Apply patch
        run: python3 tools/patch_v1_16_3.py
      - name: Unit tests and debug APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Commit tested patch
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/patch-v1.16.3.yml tools/patch_v1_16_3.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app CHANGELOG.md
          git commit -m "Fix background navigation and attachments for v1.16.3"
          git push origin HEAD:fix/background-navigation-v1.16.3

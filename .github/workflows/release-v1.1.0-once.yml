name: Prepare and publish Umnik v1.1.0

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/release-v1.1.0-once.yml"

permissions:
  contents: write
  actions: write

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply provider profiles patch
        run: python3 .github/patches/prepare-v1.1.0.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Commit and tag v1.1.0
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Ayuemin"
          git config user.email "105455063+Ayuemin@users.noreply.github.com"
          git add app CHANGELOG.md README.md PRIVACY.md
          git commit -m "Add connection profiles and compatible API support"
          git tag v1.1.0
          git push origin HEAD:main
          git push origin v1.1.0

      - name: Dispatch signed release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run android-release.yml -R "${{ github.repository }}" -f tag=v1.1.0

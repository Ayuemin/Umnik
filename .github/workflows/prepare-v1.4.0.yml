- Добавлена обработка NVIDIA HTTP 202: Umnik извлекает `requestId` и автоматически опрашивает `/v1/status/{requestId}` до готового результата.
- Для DeepSeek V4 обычный чат теперь явно запускается с `reasoning_effort=none`; при включённом усиленном рассуждении используются `high` и `max`. Это устраняет скрытый дефолт NVIDIA `high`, из-за которого простой запрос мог выполняться несколько минут.
- NVIDIA vision/multimodal модели получают изображения в OpenAI-compatible `image_url` формате, когда модель определена как мультимодальная.
- Долгий запрос теперь защищён foreground-service: при сворачивании Umnik Android видит активную передачу данных, показывает тихое уведомление и не должен замораживать обычный запрос как cached-приложение.
- NVIDIA Image API приведён к актуальным схемам hosted API Catalog. Поддержаны все три текущих публичных генератора: FLUX.2 Klein 4B, FLUX.1 Schnell и FLUX.1 Dev.
- Для FLUX.1 Schnell отправляется официальный `mode=base`, для FLUX.2 Klein — `mode=Image Generation`; параметры больше не смешиваются между моделями. При 400/422 выполняется один безопасный повтор с минимальной схемой.
- NVIDIA Image API также умеет дожидаться асинхронного HTTP 202 через status polling и сохраняет подробные диагностические события.
- Реестр поставщиков поднят до версии 5. Он больше не служит белым списком NVIDIA text-моделей и используется для адресов и возможностей image-моделей.
- Версия: 1.4.0 / versionCode 52.

'''

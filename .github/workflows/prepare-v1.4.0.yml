name: Prepare Umnik 1.4.0 once

on:
  push:
    paths:
      - ".github/run-v1.4.0"

permissions:
  contents: write
  actions: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Add NVIDIA 2.0 adapter and background keep-alive
        shell: bash
        run: |
          set -euo pipefail

          cat > app/src/main/java/com/ayuemin/ymnik/network/NvidiaApiClient.kt <<'KOTLIN'
          package com.ayuemin.ymnik.network

          import android.content.Context
          import android.net.Uri
          import android.util.Base64
          import com.ayuemin.ymnik.diagnostics.DiagnosticHttpInterceptor
          import com.ayuemin.ymnik.diagnostics.DiagnosticLog
          import com.ayuemin.ymnik.diagnostics.DiagnosticNetworkEventListener
          import com.ayuemin.ymnik.model.ChatMessage
          import com.ayuemin.ymnik.model.ModelInfo
          import com.ayuemin.ymnik.model.PendingAttachment
          import com.google.gson.Gson
          import com.google.gson.JsonArray
          import com.google.gson.JsonElement
          import com.google.gson.JsonObject
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.delay
          import kotlinx.coroutines.withContext
          import okhttp3.Call
          import okhttp3.MediaType.Companion.toMediaType
          import okhttp3.OkHttpClient
          import okhttp3.Request
          import okhttp3.RequestBody.Companion.toRequestBody
          import java.io.File
          import java.util.concurrent.TimeUnit

          /**
           * NVIDIA hosted NIM adapter.
           *
           * NVIDIA looks OpenAI-compatible at first glance, but hosted NIM also has:
           * - account-specific 404s that must not mutate the public catalogue;
           * - model-specific reasoning controls (DeepSeek V4);
           * - asynchronous HTTP 202 responses with /v1/status/{requestId} polling;
           * - multimodal chat models mixed into /v1/models.
           *
           * Keep these differences here instead of leaking them into the generic
           * OpenAI-compatible adapter.
           */
          class NvidiaApiClient(private val context: Context) {
              private val gson = Gson()
              private val http = OkHttpClient.Builder()
                  .addInterceptor(DiagnosticHttpInterceptor(context, "NVIDIA text"))
                  .eventListenerFactory { DiagnosticNetworkEventListener(context, "NVIDIA text") }
                  .connectTimeout(30, TimeUnit.SECONDS)
                  .readTimeout(600, TimeUnit.SECONDS)
                  .writeTimeout(600, TimeUnit.SECONDS)
                  .build()

              private val activeCallLock = Any()
              @Volatile private var activeCall: Call? = null

              private data class RawResponse(val code: Int, val body: String) {
                  val successful: Boolean get() = code in 200..299
              }

              fun cancelActiveRequest() {
                  synchronized(activeCallLock) { activeCall?.cancel() }
                  http.dispatcher.cancelAll()
              }

              suspend fun models(apiKey: String, baseUrl: String): List<ModelInfo> = withContext(Dispatchers.IO) {
                  val request = Request.Builder()
                      .url(endpoint(baseUrl, "models"))
                      .header("Authorization", "Bearer $apiKey")
                      .header("Accept", "application/json")
                      .get()
                      .build()
                  val call = http.newCall(request)
                  synchronized(activeCallLock) { activeCall = call }
                  try {
                      call.execute().use { response ->
                          val body = response.body?.string().orEmpty()
                          if (!response.isSuccessful) error(apiError(response.code, body))
                          val root = gson.fromJson(body, JsonElement::class.java)
                          val data = when {
                              root.isJsonObject -> root.asJsonObject.getAsJsonArray("data")
                              root.isJsonArray -> root.asJsonArray
                              else -> null
                          } ?: return@withContext emptyList()

                          val result = data.mapNotNull { element ->
                              val item = element.takeIf { it.isJsonObject }?.asJsonObject ?: return@mapNotNull null
                              val id = item.get("id")?.takeIf { it.isJsonPrimitive }?.asString
                                  ?.trim()?.takeIf { it.isNotBlank() } ?: return@mapNotNull null
                              if (!isLikelyChatModel(id)) return@mapNotNull null
                              modelInfo(id)
                          }.distinctBy { it.id }.sortedBy { it.id }

                          DiagnosticLog.record(
                              context,
                              "MODEL CATALOG",
                              "NVIDIA /models returned=${data.size()}; chatCandidates=${result.size}; no whitelist/quarantine"
                          )
                          result
                      }
                  } finally {
                      synchronized(activeCallLock) { activeCall = null }
                  }
              }

              suspend fun chat(
                  apiKey: String,
                  baseUrl: String,
                  model: String,
                  history: List<ChatMessage>,
                  prompt: String,
                  attachments: List<PendingAttachment>,
                  systemPrompt: String,
                  reasoningEnabled: Boolean,
                  reasoningEffort: String?
              ): OpenRouterClient.Result = withContext(Dispatchers.IO) {
                  val messages = JsonArray()
                  if (systemPrompt.isNotBlank()) messages.add(simpleMessage("system", systemPrompt))

                  history.takeLast(30)
                      .dropLastWhile { it.role == "user" }
                      .filter { it.role == "user" || it.role == "assistant" }
                      .forEach { messages.add(simpleMessage(it.role, it.text)) }

                  messages.add(userMessage(prompt, attachments))

                  val payload = JsonObject().apply {
                      addProperty("model", model)
                      add("messages", messages)
                      addProperty("stream", false)
                      if (isDeepSeekV4(model)) {
                          addProperty("reasoning_effort", deepSeekReasoning(reasoningEnabled, reasoningEffort))
                      }
                  }

                  DiagnosticLog.record(
                      context,
                      "NVIDIA REQUEST",
                      "start model=$model; messages=${messages.size()}; attachments=${attachments.size}; reasoning=${if (isDeepSeekV4(model)) deepSeekReasoning(reasoningEnabled, reasoningEffort) else "provider-default"}"
                  )

                  val first = executeChat(apiKey, endpoint(baseUrl, "chat/completions"), payload)
                  val final = if (first.code == 202) pollUntilReady(apiKey, baseUrl, first.body) else first
                  if (!final.successful) {
                      val detail = apiError(final.code, final.body)
                      when (final.code) {
                          404 -> error("NVIDIA не дала этому аккаунту доступ к модели «${model.substringAfterLast('/')}» через Chat API. Модель останется в каталоге. $detail")
                          429 -> error("NVIDIA временно перегружена или исчерпан лимит запросов. Повторите позже. $detail")
                          else -> error(detail)
                      }
                  }

                  val text = parseCompletionText(final.body)
                  if (text.isBlank()) error("NVIDIA вернула успешный ответ без текста")
                  DiagnosticLog.record(context, "NVIDIA REQUEST", "success model=$model; responseChars=${text.length}")
                  OpenRouterClient.Result(text, emptyList())
              }

              private fun executeChat(apiKey: String, url: String, payload: JsonObject): RawResponse {
                  val request = Request.Builder()
                      .url(url)
                      .header("Authorization", "Bearer $apiKey")
                      .header("Accept", "application/json")
                      .header("Content-Type", "application/json")
                      .post(gson.toJson(payload).toRequestBody("application/json".toMediaType()))
                      .build()
                  val call = http.newCall(request)
                  synchronized(activeCallLock) { activeCall = call }
                  return call.execute().use { response -> RawResponse(response.code, response.body?.string().orEmpty()) }
              }

              private suspend fun pollUntilReady(apiKey: String, baseUrl: String, firstBody: String): RawResponse {
                  val requestId = extractRequestId(firstBody)
                      ?: error("NVIDIA вернула HTTP 202 без requestId")
                  DiagnosticLog.record(context, "NVIDIA REQUEST", "pending requestId=${requestId.take(8)}…")
                  val statusUrl = endpoint(baseUrl, "status/$requestId")
                  repeat(MAX_POLL_ATTEMPTS) { attempt ->
                      delay(POLL_DELAY_MS)
                      val request = Request.Builder()
                          .url(statusUrl)
                          .header("Authorization", "Bearer $apiKey")
                          .header("Accept", "application/json")
                          .get()
                          .build()
                      val call = http.newCall(request)
                      synchronized(activeCallLock) { activeCall = call }
                      val response = call.execute().use { RawResponse(it.code, it.body?.string().orEmpty()) }
                      when (response.code) {
                          200 -> {
                              DiagnosticLog.record(context, "NVIDIA REQUEST", "poll ready after=${attempt + 1}")
                              return response
                          }
                          202 -> if ((attempt + 1) % 10 == 0) {
                              DiagnosticLog.record(context, "NVIDIA REQUEST", "poll still pending attempt=${attempt + 1}")
                          }
                          else -> return response
                      }
                  }
                  error("NVIDIA слишком долго не завершает асинхронный запрос")
              }

              private fun extractRequestId(body: String): String? = runCatching {
                  val root = gson.fromJson(body, JsonObject::class.java)
                  listOf("requestId", "request_id", "id")
                      .asSequence()
                      .mapNotNull { key -> root.get(key)?.takeIf { it.isJsonPrimitive }?.asString }
                      .firstOrNull { it.isNotBlank() }
              }.getOrNull()

              private fun parseCompletionText(body: String): String {
                  val root = runCatching { gson.fromJson(body, JsonObject::class.java) }.getOrNull() ?: return ""
                  val message = root.getAsJsonArray("choices")?.firstOrNull()?.takeIf { it.isJsonObject }
                      ?.asJsonObject?.getAsJsonObject("message")
                  return extractText(message?.get("content")).ifBlank {
                      extractText(message?.get("reasoning_content"))
                  }
              }

              private fun userMessage(prompt: String, attachments: List<PendingAttachment>): JsonObject {
                  val text = buildPromptWithTextAttachments(prompt, attachments)
                  val images = attachments.filter { it.mimeType.lowercase().startsWith("image/") }
                  if (images.isEmpty()) return simpleMessage("user", text)

                  val content = JsonArray().apply {
                      add(JsonObject().apply {
                          addProperty("type", "text")
                          addProperty("text", text)
                      })
                      images.forEach { attachment ->
                          val bytes = readAttachment(attachment)
                          val encoded = Base64.encodeToString(bytes, Base64.NO_WRAP)
                          val mime = attachment.mimeType.ifBlank { "image/jpeg" }
                          add(JsonObject().apply {
                              addProperty("type", "image_url")
                              add("image_url", JsonObject().apply {
                                  addProperty("url", "data:$mime;base64,$encoded")
                              })
                          })
                      }
                  }
                  return JsonObject().apply {
                      addProperty("role", "user")
                      add("content", content)
                  }
              }

              private fun buildPromptWithTextAttachments(prompt: String, attachments: List<PendingAttachment>): String = buildString {
                  append(prompt.ifBlank { "Изучи вложения и помоги мне с ними." })
                  attachments.forEach { attachment ->
                      val mime = attachment.mimeType.lowercase()
                      val name = attachment.name.lowercase()
                      val textLike = mime.startsWith("text/") || name.endsWith(".md") || name.endsWith(".json") ||
                          name.endsWith(".csv") || name.endsWith(".yaml") || name.endsWith(".yml") || name.endsWith(".xml")
                      if (textLike) {
                          val value = runCatching { String(readAttachment(attachment), Charsets.UTF_8) }.getOrDefault("")
                          append("\n\n--- Вложение: ${attachment.name} ---\n")
                          append(value)
                          append("\n--- Конец вложения ---")
                      }
                  }
              }

              private fun readAttachment(attachment: PendingAttachment): ByteArray {
                  attachment.localPath?.takeIf { it.isNotBlank() }?.let { path ->
                      val file = File(path)
                      if (file.isFile) return file.readBytes()
                  }
                  val uri = Uri.parse(attachment.uri)
                  return context.contentResolver.openInputStream(uri)?.use { it.readBytes() }
                      ?: error("Не удалось прочитать ${attachment.name}")
              }

              private fun simpleMessage(role: String, text: String) = JsonObject().apply {
                  addProperty("role", role)
                  addProperty("content", text)
              }

              private fun modelInfo(id: String): ModelInfo {
                  val value = id.lowercase()
                  val multimodal = listOf("vision", "vlm", "multimodal", "vila", "fuyu", "kosmos", "paligemma", "neva")
                      .any { it in value }
                  val deepSeek = isDeepSeekV4(id)
                  return ModelInfo(
                      id = id,
                      inputModalities = if (multimodal) setOf("text", "image") else setOf("text"),
                      supportedParameters = if (deepSeek) setOf("reasoning", "reasoning_effort") else emptySet(),
                      reasoningEfforts = if (deepSeek) setOf("high", "xhigh") else emptySet()
                  )
              }

              private fun isLikelyChatModel(id: String): Boolean {
                  val value = id.lowercase()
                  val nonChatMarkers = listOf(
                      "embed", "embedding", "rerank", "re-rank", "retriever", "retrieval", "reward",
                      "nvclip", "/clip", "flux.", "stable-diffusion", "image-detection", "deepfake",
                      "synthetic-video-detector", "object-detection", "ocr", "riva-translate", "whisper",
                      "parakeet", "text-embedding"
                  )
                  return nonChatMarkers.none { it in value }
              }

              private fun isDeepSeekV4(model: String): Boolean = model.lowercase().contains("deepseek-v4")

              private fun deepSeekReasoning(enabled: Boolean, effort: String?): String {
                  if (!enabled) return "none"
                  return if (effort.equals("xhigh", true) || effort.equals("max", true)) "max" else "high"
              }

              private fun extractText(content: JsonElement?): String = when {
                  content == null || content.isJsonNull -> ""
                  content.isJsonPrimitive -> content.asString
                  content.isJsonArray -> content.asJsonArray.mapNotNull { part ->
                      when {
                          part.isJsonPrimitive -> part.asString
                          part.isJsonObject -> part.asJsonObject.get("text")?.takeIf { it.isJsonPrimitive }?.asString
                          else -> null
                      }
                  }.joinToString("\n")
                  else -> content.toString()
              }

              private fun endpoint(baseUrl: String, path: String): String = baseUrl.trim().trimEnd('/') + "/" + path

              private fun apiError(code: Int, body: String): String {
                  val message = runCatching {
                      val root = gson.fromJson(body, JsonObject::class.java)
                      root.getAsJsonObject("error")?.get("message")?.takeIf { it.isJsonPrimitive }?.asString
                          ?: root.get("detail")?.let { if (it.isJsonPrimitive) it.asString else it.toString() }
                          ?: root.get("message")?.takeIf { it.isJsonPrimitive }?.asString
                          ?: root.get("title")?.takeIf { it.isJsonPrimitive }?.asString
                  }.getOrNull()?.trim()?.takeIf { it.isNotBlank() }
                      ?: body.trim().replace(Regex("\\s+"), " ").take(300).takeIf { it.isNotBlank() }
                  return if (message.isNullOrBlank()) "NVIDIA API: HTTP $code" else "NVIDIA API: HTTP $code · $message"
              }

              private companion object {
                  const val POLL_DELAY_MS = 1200L
                  const val MAX_POLL_ATTEMPTS = 500
              }
          }
          KOTLIN

          cat > app/src/main/java/com/ayuemin/ymnik/RequestKeepAliveService.kt <<'KOTLIN'
          package com.ayuemin.ymnik

          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.os.Build
          import android.os.IBinder
          import androidx.core.content.ContextCompat

          /** Keeps an explicitly started model request alive while the app is minimized. */
          class RequestKeepAliveService : Service() {
              override fun onCreate() {
                  super.onCreate()
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val manager = getSystemService(NotificationManager::class.java)
                      manager.createNotificationChannel(
                          NotificationChannel(
                              CHANNEL_ID,
                              "Работа модели",
                              NotificationManager.IMPORTANCE_LOW
                          ).apply {
                              description = "Активный запрос Umnik в фоне"
                              setShowBadge(false)
                          }
                      )
                  }
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  val label = intent?.getStringExtra(EXTRA_LABEL).orEmpty().ifBlank { "Модель отвечает…" }
                  val notification = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      android.app.Notification.Builder(this, CHANNEL_ID)
                          .setSmallIcon(android.R.drawable.stat_sys_upload)
                          .setContentTitle("Umnik")
                          .setContentText(label)
                          .setOngoing(true)
                          .build()
                  } else {
                      @Suppress("DEPRECATION")
                      android.app.Notification.Builder(this)
                          .setSmallIcon(android.R.drawable.stat_sys_upload)
                          .setContentTitle("Umnik")
                          .setContentText(label)
                          .setOngoing(true)
                          .build()
                  }
                  startForeground(NOTIFICATION_ID, notification)
                  return START_NOT_STICKY
              }

              override fun onBind(intent: Intent?): IBinder? = null

              companion object {
                  private const val CHANNEL_ID = "umnik_active_request"
                  private const val NOTIFICATION_ID = 4107
                  private const val EXTRA_LABEL = "label"

                  fun start(context: Context, label: String) {
                      val intent = Intent(context, RequestKeepAliveService::class.java)
                          .putExtra(EXTRA_LABEL, label)
                      ContextCompat.startForegroundService(context, intent)
                  }

                  fun stop(context: Context) {
                      context.stopService(Intent(context, RequestKeepAliveService::class.java))
                  }
              }
          }
          KOTLIN

          cat > app/src/main/java/com/ayuemin/ymnik/network/NvidiaImageClient.kt <<'KOTLIN'
          package com.ayuemin.ymnik.network

          import android.content.Context
          import android.util.Base64
          import com.ayuemin.ymnik.diagnostics.DiagnosticHttpInterceptor
          import com.ayuemin.ymnik.diagnostics.DiagnosticLog
          import com.ayuemin.ymnik.diagnostics.DiagnosticNetworkEventListener
          import com.ayuemin.ymnik.model.GeneratedFile
          import com.ayuemin.ymnik.model.PendingAttachment
          import com.google.gson.Gson
          import com.google.gson.JsonElement
          import com.google.gson.JsonObject
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.delay
          import kotlinx.coroutines.withContext
          import okhttp3.Call
          import okhttp3.MediaType.Companion.toMediaType
          import okhttp3.OkHttpClient
          import okhttp3.Request
          import okhttp3.RequestBody.Companion.toRequestBody
          import java.io.File
          import java.net.URL
          import java.util.UUID
          import java.util.concurrent.TimeUnit

          class NvidiaImageClient(private val context: Context) {
              private val gson = Gson()
              private val http = OkHttpClient.Builder()
                  .addInterceptor(DiagnosticHttpInterceptor(context, "NVIDIA image"))
                  .eventListenerFactory { DiagnosticNetworkEventListener(context, "NVIDIA image") }
                  .connectTimeout(30, TimeUnit.SECONDS)
                  .readTimeout(600, TimeUnit.SECONDS)
                  .writeTimeout(600, TimeUnit.SECONDS)
                  .build()
              private val activeCallLock = Any()
              @Volatile private var activeCall: Call? = null

              private data class RawResponse(val code: Int, val body: String) {
                  val successful: Boolean get() = code in 200..299
              }

              fun cancelActiveRequest() {
                  synchronized(activeCallLock) { activeCall?.cancel() }
                  http.dispatcher.cancelAll()
              }

              suspend fun generateImage(
                  apiKey: String,
                  baseUrl: String,
                  model: String,
                  prompt: String,
                  attachments: List<PendingAttachment> = emptyList(),
                  aspectRatio: String? = null
              ): OpenRouterClient.Result = withContext(Dispatchers.IO) {
                  if (attachments.isNotEmpty()) {
                      error("Облачный NVIDIA API Catalog сейчас не принимает произвольные пользовательские референсы для выбранного hosted endpoint. Используйте текстовый промпт.")
                  }

                  val url = modelEndpoint(baseUrl, model)
                  val primary = payload(model, prompt, aspectRatio)
                  val minimal = minimalPayload(model, prompt)
                  DiagnosticLog.record(context, "NVIDIA IMAGE", "start model=$model; aspect=${aspectRatio ?: "auto"}")

                  try {
                      var response = execute(url, apiKey, primary)
                      if (response.code == 202) response = pollUntilReady(apiKey, baseUrl, response.body)

                      if (!response.successful && response.code in setOf(400, 422) && gson.toJson(primary) != gson.toJson(minimal)) {
                          DiagnosticLog.record(context, "NVIDIA IMAGE", "validation retry model=$model with minimal payload")
                          response = execute(url, apiKey, minimal)
                          if (response.code == 202) response = pollUntilReady(apiKey, baseUrl, response.body)
                      }

                      if (!response.successful) error(apiError(response.code, response.body))
                      val root = gson.fromJson(response.body, JsonObject::class.java)
                      val files = extractImages(root)
                      if (files.isEmpty()) error("NVIDIA NIM вернул успешный ответ без изображения")
                      DiagnosticLog.record(context, "NVIDIA IMAGE", "success model=$model; files=${files.size}")
                      OpenRouterClient.Result("Изображение создано.", files)
                  } finally {
                      synchronized(activeCallLock) { activeCall = null }
                  }
              }

              private fun execute(url: String, apiKey: String, payload: JsonObject): RawResponse {
                  val request = Request.Builder()
                      .url(url)
                      .header("Authorization", "Bearer $apiKey")
                      .header("Accept", "application/json")
                      .header("Content-Type", "application/json")
                      .post(gson.toJson(payload).toRequestBody("application/json".toMediaType()))
                      .build()
                  val call = http.newCall(request)
                  synchronized(activeCallLock) { activeCall = call }
                  return call.execute().use { RawResponse(it.code, it.body?.string().orEmpty()) }
              }

              private suspend fun pollUntilReady(apiKey: String, baseUrl: String, firstBody: String): RawResponse {
                  val requestId = extractRequestId(firstBody) ?: error("NVIDIA Image API вернул HTTP 202 без requestId")
                  val statusUrl = statusEndpoint(baseUrl, requestId)
                  repeat(MAX_POLL_ATTEMPTS) { attempt ->
                      delay(POLL_DELAY_MS)
                      val request = Request.Builder()
                          .url(statusUrl)
                          .header("Authorization", "Bearer $apiKey")
                          .header("Accept", "application/json")
                          .get()
                          .build()
                      val call = http.newCall(request)
                      synchronized(activeCallLock) { activeCall = call }
                      val response = call.execute().use { RawResponse(it.code, it.body?.string().orEmpty()) }
                      when (response.code) {
                          200 -> return response
                          202 -> if ((attempt + 1) % 10 == 0) DiagnosticLog.record(context, "NVIDIA IMAGE", "pending attempt=${attempt + 1}")
                          else -> return response
                      }
                  }
                  error("NVIDIA слишком долго не завершает генерацию изображения")
              }

              private fun payload(model: String, prompt: String, aspectRatio: String?): JsonObject {
                  val (width, height) = dimensions(aspectRatio)
                  return when {
                      model.contains("flux.1-schnell") -> JsonObject().apply {
                          addProperty("prompt", prompt)
                          addProperty("height", height)
                          addProperty("width", width)
                          addProperty("cfg_scale", 0)
                          addProperty("mode", "base")
                          addProperty("samples", 1)
                          addProperty("seed", 0)
                          addProperty("steps", 4)
                      }
                      model.contains("flux.1-dev") -> JsonObject().apply {
                          addProperty("prompt", prompt)
                          addProperty("height", height)
                          addProperty("width", width)
                          addProperty("cfg_scale", 5)
                          addProperty("mode", "base")
                          addProperty("samples", 1)
                          addProperty("seed", 0)
                          addProperty("steps", 50)
                      }
                      model.contains("flux.2-klein-4b") -> JsonObject().apply {
                          addProperty("mode", "Image Generation")
                          addProperty("prompt", prompt)
                          addProperty("height", height)
                          addProperty("width", width)
                          addProperty("cfg_scale", 0)
                          addProperty("samples", 1)
                          addProperty("seed", 0)
                          addProperty("steps", 4)
                      }
                      else -> JsonObject().apply { addProperty("prompt", prompt) }
                  }
              }

              private fun minimalPayload(model: String, prompt: String): JsonObject = when {
                  model.contains("flux.1-schnell") -> JsonObject().apply {
                      addProperty("prompt", prompt)
                      addProperty("mode", "base")
                      addProperty("seed", 0)
                      addProperty("steps", 4)
                  }
                  model.contains("flux.1-dev") -> JsonObject().apply {
                      addProperty("prompt", prompt)
                      addProperty("mode", "base")
                  }
                  model.contains("flux.2-klein-4b") -> JsonObject().apply {
                      addProperty("mode", "Image Generation")
                      addProperty("prompt", prompt)
                  }
                  else -> JsonObject().apply { addProperty("prompt", prompt) }
              }

              private fun dimensions(aspectRatio: String?): Pair<Int, Int> = when (aspectRatio) {
                  "16:9" -> 1344 to 768
                  "9:16" -> 768 to 1344
                  "5:4" -> 1152 to 896
                  "4:5" -> 896 to 1152
                  "3:2" -> 1216 to 832
                  "2:3" -> 832 to 1216
                  else -> 1024 to 1024
              }

              private fun extractImages(root: JsonObject): List<GeneratedFile> {
                  val out = mutableListOf<GeneratedFile>()
                  fun consume(element: JsonElement, index: Int) {
                      when {
                          element.isJsonPrimitive -> {
                              val raw = element.asString
                              if (raw.startsWith("http://") || raw.startsWith("https://")) out += downloadImage(raw, index)
                              else if (raw.isNotBlank()) out += saveEncodedImage(raw, null, index)
                          }
                          element.isJsonObject -> {
                              val obj = element.asJsonObject
                              val encoded = listOf("base64", "b64_json", "image", "data")
                                  .asSequence()
                                  .mapNotNull { name -> obj.get(name)?.takeIf { it.isJsonPrimitive }?.asString }
                                  .firstOrNull { it.isNotBlank() && !it.startsWith("http") }
                              val url = obj.get("url")?.takeIf { it.isJsonPrimitive }?.asString
                              val mime = listOf("media_type", "mime_type", "mimeType", "content_type")
                                  .asSequence()
                                  .mapNotNull { name -> obj.get(name)?.takeIf { it.isJsonPrimitive }?.asString }
                                  .firstOrNull()
                              when {
                                  !encoded.isNullOrBlank() -> out += saveEncodedImage(encoded, mime, index)
                                  !url.isNullOrBlank() -> out += downloadImage(url, index)
                              }
                          }
                      }
                  }
                  listOf("artifacts", "images", "data").forEach { name ->
                      root.get(name)?.takeIf { it.isJsonArray }?.asJsonArray?.forEachIndexed { index, item -> consume(item, index) }
                  }
                  if (out.isEmpty()) {
                      listOf("base64", "b64_json", "image").forEachIndexed { index, name -> root.get(name)?.let { consume(it, index) } }
                  }
                  return out.distinctBy { it.localPath }
              }

              private fun saveEncodedImage(raw: String, mimeHint: String?, index: Int): GeneratedFile {
                  val cleaned = raw.substringAfter("base64,", raw).trim()
                  return saveImageBytes(Base64.decode(cleaned, Base64.DEFAULT), mimeHint, index)
              }

              private fun downloadImage(url: String, index: Int): GeneratedFile {
                  val connection = URL(url).openConnection().apply {
                      connectTimeout = 30_000
                      readTimeout = 300_000
                  }
                  val mime = connection.contentType
                  val bytes = connection.getInputStream().use { it.readBytes() }
                  return saveImageBytes(bytes, mime, index)
              }

              private fun saveImageBytes(bytes: ByteArray, mimeHint: String?, index: Int): GeneratedFile {
                  if (bytes.isEmpty()) error("NVIDIA NIM вернул пустое изображение")
                  val mime = detectMime(bytes, mimeHint)
                  val ext = when (mime) {
                      "image/jpeg" -> "jpg"
                      "image/webp" -> "webp"
                      "image/svg+xml" -> "svg"
                      else -> "png"
                  }
                  val dir = File(context.filesDir, "generated").apply { mkdirs() }
                  val file = File(dir, "nvidia_${System.currentTimeMillis()}_${index}.$ext")
                  file.writeBytes(bytes)
                  return GeneratedFile(UUID.randomUUID().toString(), file.name, mime, file.absolutePath, file.length())
              }

              private fun detectMime(bytes: ByteArray, hint: String?): String {
                  val normalized = hint?.substringBefore(';')?.lowercase()?.takeIf { it.startsWith("image/") }
                  if (normalized != null) return normalized
                  if (bytes.size >= 3 && bytes[0] == 0xFF.toByte() && bytes[1] == 0xD8.toByte() && bytes[2] == 0xFF.toByte()) return "image/jpeg"
                  if (bytes.size >= 12 && String(bytes.copyOfRange(0, 4), Charsets.US_ASCII) == "RIFF" && String(bytes.copyOfRange(8, 12), Charsets.US_ASCII) == "WEBP") return "image/webp"
                  val prefix = runCatching { String(bytes.take(200).toByteArray(), Charsets.UTF_8).trimStart() }.getOrDefault("")
                  if (prefix.startsWith("<svg") || prefix.startsWith("<?xml") && "<svg" in prefix) return "image/svg+xml"
                  return "image/png"
              }

              private fun modelEndpoint(baseUrl: String, model: String): String {
                  val clean = baseUrl.trim().trimEnd('/')
                  return if (clean.endsWith(model)) clean else "$clean/${model.trimStart('/')}"
              }

              private fun statusEndpoint(baseUrl: String, requestId: String): String {
                  val clean = baseUrl.trim().trimEnd('/')
                  return when {
                      "/v1/genai" in clean -> clean.substringBefore("/v1/genai") + "/v1/status/$requestId"
                      clean.endsWith("/v1") -> "$clean/status/$requestId"
                      else -> "$clean/status/$requestId"
                  }
              }

              private fun extractRequestId(body: String): String? = runCatching {
                  val root = gson.fromJson(body, JsonObject::class.java)
                  listOf("requestId", "request_id", "id").asSequence()
                      .mapNotNull { key -> root.get(key)?.takeIf { it.isJsonPrimitive }?.asString }
                      .firstOrNull { it.isNotBlank() }
              }.getOrNull()

              private fun apiError(code: Int, body: String): String {
                  val detail = runCatching {
                      val root = gson.fromJson(body, JsonObject::class.java)
                      root.getAsJsonObject("error")?.get("message")?.takeIf { it.isJsonPrimitive }?.asString
                          ?: root.get("detail")?.let { if (it.isJsonPrimitive) it.asString else it.toString() }
                          ?: root.get("message")?.takeIf { it.isJsonPrimitive }?.asString
                  }.getOrNull()?.takeIf { it.isNotBlank() }
                  return "NVIDIA NIM: HTTP $code${detail?.let { " · $it" }.orEmpty()}"
              }

              private companion object {
                  const val POLL_DELAY_MS = 1200L
                  const val MAX_POLL_ATTEMPTS = 500
              }
          }

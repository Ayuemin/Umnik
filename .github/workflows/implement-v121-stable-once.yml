name: Implement v1.2.1 stable once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/implement-v121-stable-once.yml"

permissions:
  contents: write
  actions: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Apply stable patch
        run: python3 .github/scripts/implement-v121-stable.py

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Ayuemin"
          git config user.email "105455063+Ayuemin@users.noreply.github.com"
          git add app/build.gradle.kts CHANGELOG.md app/src/main/java/com/ayuemin/ymnik/ChatViewModel.kt
          git diff --cached --check
          git commit -m "Release Umnik v1.2.1"
          git push origin HEAD:main
          echo "IMPLEMENTATION_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Tag stable release
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          if git rev-parse -q --verify refs/tags/v1.2.1 >/dev/null; then
            echo "Tag already exists"
            exit 1
          fi
          git tag -a v1.2.1 "$IMPLEMENTATION_SHA" -m "Umnik v1.2.1"
          git push origin refs/tags/v1.2.1

      - name: Dispatch signed release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run android-release.yml -f tag=v1.2.1

name: BrowserBannerHotfix

on: push

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/local-shell-mvp
      - name: Make Browser banner clickable
        run: >-
          python3 -c "from pathlib import Path; p=Path('app/src/main/java/com/ayuemin/ymnik/ui/YmnikApp.kt'); s=p.read_text(); marker='    val waiting = activity.lifecycle == LocalBrowserLifecycle.WAITING_USER\n    Surface(\n'; assert s.count(marker) == 1, s.count(marker); p.write_text(s.replace(marker, marker + '        onClick = onShowPage,\n', 1))"
      - name: Commit source patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/ayuemin/ymnik/ui/YmnikApp.kt
          git commit -m "Make Local Browser banner open current page"
          git push origin HEAD:work/local-shell-mvp

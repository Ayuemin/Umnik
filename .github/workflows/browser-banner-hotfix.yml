name: BrowserBannerHotfix

on: push

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/local-shell-mvp
      - name: Patch Browser autonomy
        run: python3 .github/scripts/browser_autonomy_patch.py
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/ayuemin/ymnik/browser/LocalBrowserRuntime.kt app/src/main/java/com/ayuemin/ymnik/network/OpenRouterClient.kt
          git commit -m "Allow long Browser tasks with loop protection"
          git push origin HEAD:work/local-shell-mvp

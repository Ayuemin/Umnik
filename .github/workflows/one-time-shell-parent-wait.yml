name: One-time Local Shell parent wait patch

on:
  push:
    branches: [ "work/local-shell-mvp" ]
    paths: [ ".github/workflows/one-time-shell-parent-wait.yml" ]

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: work/local-shell-mvp
          fetch-depth: 0

      - name: Apply narrow source patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {count}")
              return text.replace(old, new, 1)

          # OpenRouter: after local_shell_start, suspend locally for the same worker's
          # terminal result instead of giving the model a chance to poll status.
          path = Path("app/src/main/java/com/ayuemin/ymnik/network/OpenRouterClient.kt")
          text = path.read_text()
          text = replace_once(
              text,
              "import com.ayuemin.ymnik.OpenRouterRecoveryWorker\n",
              "import com.ayuemin.ymnik.OpenRouterRecoveryWorker\nimport com.ayuemin.ymnik.LocalShellRuntime\n",
              "OpenRouter import"
          )
          old = '''                    "local_shell_start" -> {
                        val callback = localShellStart
                        if (callback == null) {
                            gson.toJson(mapOf("ok" to false, "error" to "Local Shell недоступен"))
                        } else {
                            runCatching {
                                val args = gson.fromJson(argsRaw, JsonObject::class.java)
                                val task = args.get("task")?.asString.orEmpty().trim()
                                require(task.isNotBlank()) { "Не передана задача для Local Shell" }
                                val network = runCatching { args.get("network")?.asBoolean ?: false }.getOrDefault(false)
                                val files = args.getAsJsonArray("files")
                                    ?.mapNotNull { item -> item.takeIf { it.isJsonPrimitive }?.asString?.trim() }
                                    ?.filter { it.isNotBlank() }
                                    .orEmpty()
                                callback(task, network, files)
                            }.getOrElse {
                                gson.toJson(mapOf("ok" to false, "error" to (it.message ?: "Не удалось запустить Local Shell")))
                            }
                        }
                    }
'''
          new = '''                    "local_shell_start" -> {
                        val callback = localShellStart
                        if (callback == null) {
                            gson.toJson(mapOf("ok" to false, "error" to "Local Shell недоступен"))
                        } else {
                            runCatching {
                                val args = gson.fromJson(argsRaw, JsonObject::class.java)
                                val task = args.get("task")?.asString.orEmpty().trim()
                                require(task.isNotBlank()) { "Не передана задача для Local Shell" }
                                val network = runCatching { args.get("network")?.asBoolean ?: false }.getOrDefault(false)
                                val files = args.getAsJsonArray("files")
                                    ?.mapNotNull { item -> item.takeIf { it.isJsonPrimitive }?.asString?.trim() }
                                    ?.filter { it.isNotBlank() }
                                    .orEmpty()
                                val startResult = callback(task, network, files)
                                val startObject = runCatching {
                                    gson.fromJson(startResult, JsonObject::class.java)
                                }.getOrNull()
                                val started = runCatching {
                                    startObject?.get("started")?.asBoolean
                                }.getOrNull() == true
                                val startOk = runCatching {
                                    startObject?.get("ok")?.asBoolean
                                }.getOrNull()
                                if (!started || startOk == false) {
                                    startResult
                                } else {
                                    LocalShellRuntime.markParentConsumesTerminal()
                                    phaseCallback("Local Shell работает…")
                                    DiagnosticLog.record(
                                        context,
                                        "LOCAL_SHELL_PARENT_WAIT",
                                        "suspend; request=$requestRunId; step=$loops"
                                    )
                                    val terminal = LocalShellRuntime.awaitTerminal()
                                    terminal.costUsd?.let { shellCost ->
                                        costSink?.invoke(RequestCostKind.PRIMARY, shellCost.toString())
                                    }
                                    terminal.files.forEach { file ->
                                        if (created.none { existing -> existing.id == file.id }) created += file
                                    }
                                    DiagnosticLog.record(
                                        context,
                                        "LOCAL_SHELL_PARENT_WAIT",
                                        "resume; state=${terminal.state.name}; turns=${terminal.turns}; tools=${terminal.toolCalls}; files=${terminal.files.size}; request=$requestRunId"
                                    )
                                    gson.toJson(
                                        linkedMapOf<String, Any?>(
                                            "ok" to terminal.ok,
                                            "source" to "local_shell",
                                            "state" to terminal.state.name,
                                            "result" to terminal.text.takeIf { it.isNotBlank() },
                                            "error" to terminal.error?.takeIf { it.isNotBlank() },
                                            "model" to terminal.modelId,
                                            "turns" to terminal.turns,
                                            "tool_calls" to terminal.toolCalls,
                                            "files" to terminal.files.map { file ->
                                                mapOf(
                                                    "name" to file.name,
                                                    "mime_type" to file.mimeType,
                                                    "size" to file.size
                                                )
                                            }
                                        ).filterValues { it != null }
                                    )
                                }
                            }.getOrElse {
                                gson.toJson(mapOf("ok" to false, "error" to (it.message ?: "Не удалось запустить Local Shell")))
                            }
                        }
                    }
'''
          text = replace_once(text, old, new, "OpenRouter local_shell_start")
          text = replace_once(
              text,
              'description = "Запустить асинхронный Local Shell на устройстве пользователя. Используй, когда пользователь явно просит выполнить, реализовать, исправить, собрать или проверить работу, которую разумно передать локальному агенту. Не запускай только потому, что это могло бы быть полезно. Сформулируй task из уже согласованного контекста диалога.",',
              'description = "Запустить Local Shell на устройстве пользователя. Worker работает асинхронно для UI, но этот tool-вызов сам дождётся его значимого завершения без платного status-поллинга и вернёт итог. После собственного local_shell_start не вызывай local_shell_status в этом же ответе. Сформулируй task из уже согласованного контекста диалога.",',
              "local_shell_start description"
          )
          text = replace_once(
              text,
              'description = "Получить компактный статус Local Shell, запущенного в этом чате: этап, модель, шаги и локальные действия.",',
              'description = "Получить компактный статус уже работающего Local Shell из другого шага диалога. Не используй сразу после собственного local_shell_start: тот вызов сам ждёт терминальный результат.",',
              "local_shell_status description"
          )
          path.write_text(text)

          # ChatViewModel: when a parent Agent is consuming the terminal result, suppress
          # the legacy standalone Local Shell assistant message (success and failure).
          path = Path("app/src/main/java/com/ayuemin/ymnik/ChatViewModel.kt")
          text = path.read_text()
          anchor = text.index("localShellClient.run(")
          success_marker = "            }.onSuccess { result ->\n"
          success_at = text.index(success_marker, anchor)
          success_insert = success_marker + '''                if (LocalShellRuntime.parentConsumesTerminal()) {
                    DiagnosticLog.record(
                        context,
                        "LOCAL_SHELL_CHAT",
                        "terminal result delegated to parent Agent; duplicate assistant suppressed"
                    )
                    return@onSuccess
                }
'''
          text = text[:success_at] + success_insert + text[success_at + len(success_marker):]
          failure_marker = "            }.onFailure { error ->\n"
          failure_at = text.index(failure_marker, success_at + len(success_insert))
          failure_insert = failure_marker + '''                if (LocalShellRuntime.parentConsumesTerminal()) {
                    DiagnosticLog.record(
                        context,
                        "LOCAL_SHELL_CHAT",
                        "terminal failure delegated to parent Agent; duplicate assistant suppressed",
                        error
                    )
                    return@onFailure
                }
'''
          text = text[:failure_at] + failure_insert + text[failure_at + len(failure_marker):]
          path.write_text(text)

          # Preserve actual child usage in the terminal bridge so request cost accounting
          # includes the Local Shell worker when the parent consumes its result.
          path = Path("app/src/main/java/com/ayuemin/ymnik/network/LocalShellAgentClient.kt")
          text = path.read_text()
          text = replace_once(
              text,
              '''                            modelId = result.model,
                            turns = result.turns,
                            toolCalls = result.toolCalls
''',
              '''                            modelId = result.model,
                            turns = result.turns,
                            toolCalls = result.toolCalls,
                            costUsd = result.costUsd,
                            inputTokens = result.inputTokens,
                            outputTokens = result.outputTokens
''',
              "LocalShell DONE usage"
          )
          old_partial = '''                    modelId = returnedModel ?: model,
                    turns = turn,
                    toolCalls = toolCalls,
                    error = '''
          new_partial = '''                    modelId = returnedModel ?: model,
                    turns = turn,
                    toolCalls = toolCalls,
                    costUsd = totalCost.takeIf { costObserved },
                    inputTokens = totalInputTokens.takeIf { it > 0 },
                    outputTokens = totalOutputTokens.takeIf { it > 0 },
                    error = '''
          count = text.count(old_partial)
          if count != 2:
              raise SystemExit(f"LocalShell partial usage: expected 2 matches, found {count}")
          text = text.replace(old_partial, new_partial)
          path.write_text(text)

          # Prompt Diet: status remains available for an already-running task, but the
          # model must not use it as a timer after starting its own Shell worker.
          path = Path("app/src/main/java/com/ayuemin/ymnik/PromptDiet.kt")
          text = path.read_text()
          text = replace_once(
              text,
              '"Local Shell — асинхронный локальный исполнитель на устройстве пользователя. Он может работать после завершения твоего текущего ответа, а пользователь может продолжать этот же диалог." to "Local Shell — асинхронный локальный исполнитель; он может работать после твоего ответа, пока диалог продолжается.",',
              '"Local Shell — асинхронный локальный исполнитель на устройстве пользователя. Он может работать после завершения твоего текущего ответа, а пользователь может продолжать этот же диалог." to "Local Shell работает асинхронно для UI; после local_shell_start Umnik сам ждёт итог worker без model/status-поллинга.",',
              "Prompt Diet async Shell"
          )
          text = replace_once(
              text,
              '"Если Local Shell уже работает в этом чате, не запускай второй. Используй local_shell_status для проверки состояния, local_shell_note для передачи нового ограничения/уточнения пользователя, local_shell_stop — только по явной просьбе остановить." to "Если Shell уже работает, второй не запускай: status — проверить, note — передать уточнение, stop — только по явной просьбе остановить.",',
              '"Если Local Shell уже работает в этом чате, не запускай второй. Используй local_shell_status для проверки состояния, local_shell_note для передачи нового ограничения/уточнения пользователя, local_shell_stop — только по явной просьбе остановить." to "Если Shell работал ещё до текущего шага, второй не запускай: status — отдельная проверка, note — уточнение, stop — явная остановка. После собственного local_shell_start status не опрашивай: итог вернётся этим же tool-вызовом.",',
              "Prompt Diet Shell status"
          )
          path.write_text(text)

          # Regression tests: slow child wait, terminal states, same-worker guidance and
          # a source guard against reintroducing model-driven status polling.
          Path("app/src/test/java/com/ayuemin/ymnik/LocalShellRuntimeTest.kt").write_text(r'''package com.ayuemin.ymnik

import com.ayuemin.ymnik.model.GeneratedFile
import kotlinx.coroutines.Dispatchers
import kotlinx.coroutines.delay
import kotlinx.coroutines.launch
import kotlinx.coroutines.runBlocking
import org.junit.After
import org.junit.Assert.assertEquals
import org.junit.Assert.assertFalse
import org.junit.Assert.assertTrue
import org.junit.Test

class LocalShellRuntimeTest {
    @After
    fun cleanup() {
        AsyncJobEvents.markLocalShellFinished("test-chat")
        LocalShellRuntime.clear()
    }

    @Test
    fun slowChildSuspendsParentWithoutPolling() = runBlocking {
        LocalShellRuntime.prepareForStart()
        val startedAt = System.nanoTime()
        val child = launch(Dispatchers.Default) {
            delay(250L)
            LocalShellRuntime.completeTerminal(
                LocalShellTerminalResult(
                    state = LocalShellTerminalState.DONE,
                    text = "AGENT TEST OK",
                    files = listOf(GeneratedFile("f1", "agent_test.txt", "text/plain", "/tmp/agent_test.txt", 13L)),
                    turns = 4,
                    toolCalls = 5
                )
            )
        }

        val result = LocalShellRuntime.awaitTerminal()
        val elapsedMs = (System.nanoTime() - startedAt) / 1_000_000L
        child.join()

        assertTrue("parent resumed too early: ${elapsedMs}ms", elapsedMs >= 180L)
        assertEquals(LocalShellTerminalState.DONE, result.state)
        assertEquals("AGENT TEST OK", result.text)
        assertEquals(4, result.turns)
        assertEquals(5, result.toolCalls)
        assertEquals("agent_test.txt", result.files.single().name)
    }

    @Test
    fun failedAndStoppedAreTerminalResults() = runBlocking {
        LocalShellRuntime.prepareForStart()
        LocalShellRuntime.completeTerminal(
            LocalShellTerminalResult(LocalShellTerminalState.FAILED, error = "boom")
        )
        val failed = LocalShellRuntime.awaitTerminal()
        assertFalse(failed.ok)
        assertEquals("boom", failed.error)

        LocalShellRuntime.prepareForStart()
        LocalShellRuntime.completeTerminal(
            LocalShellTerminalResult(LocalShellTerminalState.STOPPED, error = "Local Shell остановлен")
        )
        val stopped = LocalShellRuntime.awaitTerminal()
        assertFalse(stopped.ok)
        assertEquals(LocalShellTerminalState.STOPPED, stopped.state)
    }

    @Test
    fun guidanceStaysOnSameRuntimeAndParentFlagResets() {
        LocalShellRuntime.prepareForStart()
        AsyncJobEvents.markLocalShellRunning("test-chat", "model", 0, 500)
        assertTrue(LocalShellRuntime.addGuidance("continue with the same worker"))
        assertEquals(listOf("continue with the same worker"), LocalShellRuntime.drainGuidance())
        LocalShellRuntime.markParentConsumesTerminal()
        assertTrue(LocalShellRuntime.parentConsumesTerminal())

        LocalShellRuntime.prepareForStart()
        assertFalse(LocalShellRuntime.parentConsumesTerminal())
    }
}
''')

          Path("app/src/test/java/com/ayuemin/ymnik/network/AgentLocalShellAwaitRegressionTest.kt").write_text(r'''package com.ayuemin.ymnik.network

import java.io.File
import org.junit.Assert.assertFalse
import org.junit.Assert.assertTrue
import org.junit.Test

class AgentLocalShellAwaitRegressionTest {
    @Test
    fun localShellStartAwaitsTerminalInsteadOfPollingStatus() {
        val source = sequenceOf(
            File("src/main/java/com/ayuemin/ymnik/network/OpenRouterClient.kt"),
            File("app/src/main/java/com/ayuemin/ymnik/network/OpenRouterClient.kt")
        ).first { it.isFile }.readText()
        val start = source.indexOf("\"local_shell_start\" ->")
        val end = source.indexOf("\"local_shell_status\" ->", start)
        require(start >= 0 && end > start)
        val startBranch = source.substring(start, end)

        assertTrue(startBranch.contains("LocalShellRuntime.awaitTerminal()"))
        assertTrue(startBranch.contains("LocalShellRuntime.markParentConsumesTerminal()"))
        assertFalse(startBranch.contains("localShellStatus"))
        assertTrue(source.contains("localShellToolsEnabled -> 8"))
        assertTrue(source.contains("AgentToolLoopGuard()"))
    }
}
''')
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 15859902
          packages: platform-tools

      - name: Install Android 17 platform
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Run focused unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest --tests 'com.ayuemin.ymnik.LocalShellRuntimeTest' --tests 'com.ayuemin.ymnik.network.AgentLocalShellAwaitRegressionTest' --stacktrace

      - name: Commit tested patch and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-shell-parent-wait.yml
          git add app/src/main/java/com/ayuemin/ymnik/ChatViewModel.kt \
                  app/src/main/java/com/ayuemin/ymnik/PromptDiet.kt \
                  app/src/main/java/com/ayuemin/ymnik/network/OpenRouterClient.kt \
                  app/src/main/java/com/ayuemin/ymnik/network/LocalShellAgentClient.kt \
                  app/src/test/java/com/ayuemin/ymnik/LocalShellRuntimeTest.kt \
                  app/src/test/java/com/ayuemin/ymnik/network/AgentLocalShellAwaitRegressionTest.kt
          git commit -m "Fix Agent wait for Local Shell completion"
          git push origin HEAD:work/local-shell-mvp

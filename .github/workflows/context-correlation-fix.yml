name: Context correlation fix

on:
  push:
    branches: [work/local-shell-mvp]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, 'Apply context correlation fallback')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/local-shell-mvp
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Apply guarded edits
        shell: python
        run: |
          from pathlib import Path

          enhancer = Path('app/src/main/java/com/ayuemin/ymnik/network/OpenRouterRequestEnhancer.kt')
          text = enhancer.read_text()
          old = '''        ContextUsageTracker.capture(requestId, payload)?.let { usage ->\n  com.ayuemin.ymnik.diagnostics.DiagnosticLog.record(\n'''
          new = '''        ContextUsageTracker.capture(requestId, payload)?.let { usage ->\n            val snapshot = activeSnapshot()\n            val messageId = snapshot?.takeIf { it.chatId == activeChatId }?.messageId\n            ContextUsageTracker.linkToMessage(requestId, activeChatId, messageId)\n  com.ayuemin.ymnik.diagnostics.DiagnosticLog.record(\n'''
          if old not in text:
              raise SystemExit('Enhancer anchor not found')
          enhancer.write_text(text.replace(old, new, 1))

          repo = Path('app/src/main/java/com/ayuemin/ymnik/data/ChatRepository.kt')
          text = repo.read_text()
          old = '''                    raw.requestId\n                        ?.let(ContextUsageTracker::consume)\n                        ?.let { usage -> raw.copy(contextUsage = usage) }\n                        ?: raw\n'''
          new = '''                    val usage = raw.requestId\n                        ?.let(ContextUsageTracker::consume)\n                        ?: ContextUsageTracker.consumeForMessage(chatId, messageId)\n                    usage?.let { raw.copy(contextUsage = it) } ?: raw\n'''
          if old not in text:
              raise SystemExit('ChatRepository anchor not found')
          repo.write_text(text.replace(old, new, 1))

          test = Path('app/src/test/java/com/ayuemin/ymnik/network/ContextUsageTrackerTest.kt')
          text = test.read_text()
          anchor = '''    private fun message(role: String, text: String) = JsonObject().apply {\n'''
          addition = '''    @Test\n    fun messageAliasRecoversUsageWhenPersistedRequestIdIsGenerationCounter() {\n        val payload = JsonObject().apply {\n            add(\"messages\", JsonArray().apply {\n                add(message(\"system\", \"base rule\"))\n                add(message(\"user\", \"hello\"))\n            })\n        }\n\n        val captured = ContextUsageTracker.capture(\"network-uuid\", payload)\n        assertTrue(captured != null)\n        ContextUsageTracker.linkToMessage(\"network-uuid\", \"chat-1\", \"user-message-1\")\n\n        assertEquals(null, ContextUsageTracker.consume(\"1\"))\n        val recovered = ContextUsageTracker.consumeForMessage(\"chat-1\", \"user-message-1\")\n        assertEquals(captured, recovered)\n        assertEquals(null, ContextUsageTracker.consume(\"network-uuid\"))\n    }\n\n'''
          if anchor not in text:
              raise SystemExit('Test anchor not found')
          test.write_text(text.replace(anchor, addition + anchor, 1))
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/ayuemin/ymnik/network/OpenRouterRequestEnhancer.kt app/src/main/java/com/ayuemin/ymnik/data/ChatRepository.kt app/src/test/java/com/ayuemin/ymnik/network/ContextUsageTrackerTest.kt
          git diff --cached --check
          git commit -m "Apply context correlation fallback"
          git push origin HEAD:work/local-shell-mvp

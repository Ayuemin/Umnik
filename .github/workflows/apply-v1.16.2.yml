name: Apply v1.16.2 patch

on:
  push:
    branches:
      - fix/background-request-v1.16.2

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/background-request-v1.16.2
          fetch-depth: 0
      - name: Apply source changes
        shell: python
        run: |
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"anchor not found in {path}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          # Version.
          replace_once("app/build.gradle.kts", "// Umnik v1.16.1", "// Umnik v1.16.2")
          replace_once("app/build.gradle.kts", "versionCode = 120", "versionCode = 121")
          replace_once("app/build.gradle.kts", 'versionName = "1.16.1"', 'versionName = "1.16.2"')

          # RequestExecutionManager: keep progress in process-wide state and surface it to Activity/service.
          p = Path("app/src/main/java/com/ayuemin/ymnik/RequestExecutionManager.kt")
          text = p.read_text()
          text = text.replace(
              'data class Snapshot(val activeChatId: String? = null, val sequence: Long = 0L, val lastError: String? = null)',
              '''data class Snapshot(\n        val activeChatId: String? = null,\n        val sequence: Long = 0L,\n        val lastError: String? = null,\n        val label: String? = null,\n        val startedAt: Long? = null\n    )''',
              1
          )
          text = text.replace(
              'mutableSnapshots.value = Snapshot(chatId, mutableSnapshots.value.sequence + 1L)',
              'mutableSnapshots.value = Snapshot(chatId, mutableSnapshots.value.sequence + 1L, label = label, startedAt = System.currentTimeMillis())',
              1
          )
          anchor = '''    fun fail(message: String) {\n        mutableSnapshots.value = mutableSnapshots.value.copy(lastError = message)\n    }\n\n    fun cancel() {'''
          replacement = '''    fun updatePhase(context: Context, label: String) {\n        if (!hasActiveRequest()) return\n        val clean = label.trim().take(160).ifBlank { "Модель работает…" }\n        mutableSnapshots.value = mutableSnapshots.value.copy(label = clean)\n        RequestKeepAliveService.update(context.applicationContext, clean)\n    }\n\n    fun fail(message: String) {\n        mutableSnapshots.value = mutableSnapshots.value.copy(lastError = message)\n    }\n\n    fun cancel() {'''
          if anchor not in text:
              raise SystemExit("RequestExecutionManager fail/cancel anchor missing")
          text = text.replace(anchor, replacement, 1)
          text = text.replace(
              'mutableSnapshots.value = Snapshot(null, mutableSnapshots.value.sequence + 1L, mutableSnapshots.value.lastError)',
              'mutableSnapshots.value = Snapshot(null, mutableSnapshots.value.sequence + 1L, mutableSnapshots.value.lastError)',
              1
          )
          p.write_text(text)

          # Foreground notification can be updated as phases change.
          p = Path("app/src/main/java/com/ayuemin/ymnik/RequestKeepAliveService.kt")
          text = p.read_text()
          text = text.replace('.setOngoing(true)\n                .build()', '.setOngoing(true)\n                .setOnlyAlertOnce(true)\n                .build()')
          anchor = '''        fun stop(context: Context) {\n            context.stopService(Intent(context, RequestKeepAliveService::class.java))\n        }'''
          replacement = '''        fun update(context: Context, label: String) {\n            start(context, label)\n        }\n\n        fun stop(context: Context) {\n            context.stopService(Intent(context, RequestKeepAliveService::class.java))\n        }'''
          if anchor not in text:
              raise SystemExit("RequestKeepAliveService companion anchor missing")
          text = text.replace(anchor, replacement, 1)
          p.write_text(text)

          # Recovery policy is pure/testable: retry only when OpenRouter gave a generation id and response cache is active.
          Path("app/src/main/java/com/ayuemin/ymnik/network/OpenRouterRecoveryPolicy.kt").write_text('''package com.ayuemin.ymnik.network\n\ninternal fun shouldRecoverOpenRouterBodyFailure(\n    locallyCancelled: Boolean,\n    generationId: String?,\n    cacheStatus: String?,\n    recoveryAttempt: Int\n): Boolean {\n    if (locallyCancelled || recoveryAttempt > 0 || generationId.isNullOrBlank()) return false\n    return cacheStatus.equals("MISS", ignoreCase = true) || cacheStatus.equals("HIT", ignoreCase = true)\n}\n''')

          Path("app/src/test/java/com/ayuemin/ymnik/network/OpenRouterRecoveryPolicyTest.kt").write_text('''package com.ayuemin.ymnik.network\n\nimport org.junit.Assert.assertFalse\nimport org.junit.Assert.assertTrue\nimport org.junit.Test\n\nclass OpenRouterRecoveryPolicyTest {\n    @Test fun recoversCachedGenerationAfterRemoteBodyFailure() {\n        assertTrue(shouldRecoverOpenRouterBodyFailure(false, "gen-123", "MISS", 0))\n        assertTrue(shouldRecoverOpenRouterBodyFailure(false, "gen-123", "HIT", 0))\n    }\n\n    @Test fun neverRetriesLocalCancelOrUnknownUncachedGeneration() {\n        assertFalse(shouldRecoverOpenRouterBodyFailure(true, "gen-123", "MISS", 0))\n        assertFalse(shouldRecoverOpenRouterBodyFailure(false, null, "MISS", 0))\n        assertFalse(shouldRecoverOpenRouterBodyFailure(false, "gen-123", null, 0))\n        assertFalse(shouldRecoverOpenRouterBodyFailure(false, "gen-123", "MISS", 1))\n    }\n}\n''')

          # OpenRouter: HTTP/2 keepalive + response-cache-backed recovery without blind duplicate paid requests.
          p = Path("app/src/main/java/com/ayuemin/ymnik/network/OpenRouterClient.kt")
          text = p.read_text()
          text = text.replace('import com.ayuemin.ymnik.diagnostics.DiagnosticHttpInterceptor', 'import com.ayuemin.ymnik.RequestExecutionManager\nimport com.ayuemin.ymnik.diagnostics.DiagnosticHttpInterceptor', 1)
          text = text.replace('import kotlinx.coroutines.Dispatchers\nimport kotlinx.coroutines.withContext', 'import kotlinx.coroutines.Dispatchers\nimport kotlinx.coroutines.delay\nimport kotlinx.coroutines.withContext', 1)
          text = text.replace('import java.io.File', 'import java.io.File\nimport java.io.IOException', 1)
          text = text.replace('.retryOnConnectionFailure(false)', '.retryOnConnectionFailure(true)\n        .pingInterval(20, TimeUnit.SECONDS)', 1)

          text = text.replace(
              '        val created = mutableListOf<GeneratedFile>()\n        var loops = 0',
              '        val created = mutableListOf<GeneratedFile>()\n        val requestRunId = UUID.randomUUID().toString()\n        var loops = 0',
              1
          )
          text = text.replace(
              '''                addProperty("model", model)\n                add("messages", messages)\n                if (toolsEnabled) add("tools", tools())''',
              '''                addProperty("model", model)\n                add("messages", messages)\n                add("metadata", JsonObject().apply {\n                    addProperty("umnik_request_id", requestRunId)\n                    addProperty("umnik_step", loops.toString())\n                })\n                if (toolsEnabled) add("tools", tools())''',
              1
          )

          pattern = re.compile(r'''    private suspend fun requestCompletion\(apiKey: String, baseUrl: String, payload: JsonObject, allowEmpty: Boolean\): OpenRouterResponseParser\.Completion \{.*?\n    \}\n\n    private fun message''', re.S)
          new_func = '''    private suspend fun requestCompletion(apiKey: String, baseUrl: String, payload: JsonObject, allowEmpty: Boolean): OpenRouterResponseParser.Completion {\n        val model = payload.get("model")?.takeUnless { it.isJsonNull }?.asString.orEmpty()\n        if (model.endsWith(":batch", ignoreCase = true)) {\n            return chatBatchRunner.complete(apiKey, baseUrl, payload)\n        }\n        val request = Request.Builder()\n            .url(endpoint(baseUrl, "chat/completions"))\n            .header("Authorization", "Bearer $apiKey")\n            .header("Content-Type", "application/json")\n            .header("X-Title", "Umnik Android")\n            .header("HTTP-Referer", "https://github.com/Ayuemin/Umnik")\n            .header("X-OpenRouter-Metadata", "enabled")\n            // A short-lived response cache lets Umnik recover the exact already-paid\n            // completion after a mobile HTTP/2 interruption instead of blindly paying twice.\n            .header("X-OpenRouter-Cache", "true")\n            .header("X-OpenRouter-Cache-TTL", "300")\n            .post(gson.toJson(payload).toRequestBody("application/json".toMediaType()))\n            .build()\n\n        var recoveryAttempt = 0\n        while (true) {\n            var generationId: String? = null\n            var cacheStatus: String? = null\n            try {\n                RequestExecutionManager.updatePhase(\n                    context,\n                    if (recoveryAttempt == 0) "Запрос отправлен · модель отвечает…" else "Забираю восстановленный ответ…"\n                )\n                executeActive(request).use { response ->\n                    generationId = response.header("X-Generation-Id")\n                    cacheStatus = response.header("X-OpenRouter-Cache-Status")\n                    RequestExecutionManager.updatePhase(\n                        context,\n                        if (cacheStatus.equals("HIT", ignoreCase = true))\n                            "Готовый ответ найден · загружаю…"\n                        else\n                            "Модель формирует ответ…"\n                    )\n                    val body = response.body?.string().orEmpty()\n                    if (!response.isSuccessful) error(apiError(response.code, body))\n                    val completion = OpenRouterResponseParser.parse(body, allowEmpty)\n                    DiagnosticLog.record(\n                        context,\n                        "COMPLETION",\n                        "OpenRouter id=${completion.id}; provider=${completion.provider}; finish=${completion.finishReason}; nativeFinish=${completion.nativeFinishReason}; completionTokens=${completion.completionTokens}; reasoningTokens=${completion.reasoningTokens}; cache=${cacheStatus ?: "off"}"\n                    )\n                    return completion\n                }\n            } catch (error: IOException) {\n                val locallyCancelled = synchronized(activeCallLock) { activeCall?.isCanceled() == true }\n                val recover = shouldRecoverOpenRouterBodyFailure(\n                    locallyCancelled = locallyCancelled,\n                    generationId = generationId,\n                    cacheStatus = cacheStatus,\n                    recoveryAttempt = recoveryAttempt\n                )\n                DiagnosticLog.record(\n                    context,\n                    "REQUEST_RECOVERY",\n                    "body failure; localCancel=$locallyCancelled; generation=${generationId ?: "none"}; cache=${cacheStatus ?: "off"}; recover=$recover; error=${error::class.java.simpleName}: ${error.message}"\n                )\n                if (!recover) throw error\n\n                clearActiveCall()\n                RequestExecutionManager.updatePhase(context, "Связь прервалась · проверяю готовый ответ…")\n                val ready = if (cacheStatus.equals("HIT", ignoreCase = true)) {\n                    true\n                } else {\n                    awaitGenerationFinished(apiKey, baseUrl, generationId.orEmpty())\n                }\n                if (!ready) {\n                    DiagnosticLog.record(context, "REQUEST_RECOVERY", "generation not completed in recovery window; id=${generationId ?: "none"}")\n                    throw error\n                }\n                recoveryAttempt += 1\n                RequestExecutionManager.updatePhase(context, "Ответ готов · восстанавливаю соединение…")\n                delay(700L)\n            } finally {\n                clearActiveCall()\n            }\n        }\n    }\n\n    private suspend fun awaitGenerationFinished(apiKey: String, baseUrl: String, generationId: String): Boolean {\n        if (generationId.isBlank()) return false\n        repeat(12) { attempt ->\n            if (attempt > 0) delay(2_500L)\n            val request = Request.Builder()\n                .url(endpoint(baseUrl, "generation") + "?id=" + Uri.encode(generationId))\n                .header("Authorization", "Bearer $apiKey")\n                .header("X-Title", "Umnik Android")\n                .get()\n                .build()\n            val result = runCatching {\n                http.newCall(request).execute().use { response ->\n                    if (response.code == 404) return@use null\n                    if (!response.isSuccessful) return@use false\n                    val root = gson.fromJson(response.body?.string().orEmpty(), JsonObject::class.java)\n                    val data = root.getAsJsonObject("data") ?: return@use null\n                    if (runCatching { data.get("cancelled")?.asBoolean }.getOrNull() == true) return@use false\n                    val finish = data.get("finish_reason")?.takeUnless { it.isJsonNull }?.asString.orEmpty()\n                    if (finish.isNotBlank()) true else null\n                }\n            }.getOrNull()\n            if (result == true) {\n                DiagnosticLog.record(context, "REQUEST_RECOVERY", "generation completed; id=$generationId; poll=${attempt + 1}")\n                return true\n            }\n            if (result == false) return false\n        }\n        return false\n    }\n\n    private fun message'''
          text, count = pattern.subn(new_func, text, count=1)
          if count != 1:
              raise SystemExit(f"OpenRouter requestCompletion replacement count={count}")
          p.write_text(text)

          # ChatViewModel: show process-wide phase after Activity recreation / returning to the app.
          replace_once(
              "app/src/main/java/com/ayuemin/ymnik/ChatViewModel.kt",
              '                    busyLabel = if (active) "Модель работает…" else null,',
              '                    busyLabel = if (active) snapshot.label ?: "Модель работает…" else null,'
          )

          # Shared clickable settings header for consistent touch target/alignment.
          Path("app/src/main/java/com/ayuemin/ymnik/ui/ExpandableSettingsHeader.kt").write_text('''package com.ayuemin.ymnik.ui\n\nimport androidx.compose.foundation.clickable\nimport androidx.compose.foundation.layout.Column\nimport androidx.compose.foundation.layout.Row\nimport androidx.compose.foundation.layout.Spacer\nimport androidx.compose.foundation.layout.fillMaxWidth\nimport androidx.compose.foundation.layout.padding\nimport androidx.compose.foundation.layout.size\nimport androidx.compose.foundation.layout.width\nimport androidx.compose.material.icons.Icons\nimport androidx.compose.material.icons.outlined.KeyboardArrowDown\nimport androidx.compose.material.icons.outlined.KeyboardArrowUp\nimport androidx.compose.material3.Icon\nimport androidx.compose.material3.MaterialTheme\nimport androidx.compose.material3.Text\nimport androidx.compose.runtime.Composable\nimport androidx.compose.ui.Alignment\nimport androidx.compose.ui.Modifier\nimport androidx.compose.ui.graphics.vector.ImageVector\nimport androidx.compose.ui.text.font.FontWeight\nimport androidx.compose.ui.unit.dp\n\n@Composable\ninternal fun ExpandableSettingsHeader(\n    icon: ImageVector,\n    title: String,\n    subtitle: String,\n    expanded: Boolean,\n    onToggle: () -> Unit,\n    modifier: Modifier = Modifier\n) {\n    Row(\n        modifier = modifier\n            .fillMaxWidth()\n            .clickable(onClick = onToggle)\n            .padding(horizontal = 16.dp, vertical = 14.dp),\n        verticalAlignment = Alignment.CenterVertically\n    ) {\n        Icon(\n            icon,\n            contentDescription = null,\n            tint = MaterialTheme.colorScheme.primary,\n            modifier = Modifier.size(24.dp)\n        )\n        Spacer(Modifier.width(12.dp))\n        Column(Modifier.weight(1f)) {\n            Text(\n                title,\n                fontWeight = FontWeight.SemiBold,\n                color = MaterialTheme.colorScheme.primary\n            )\n            Text(\n                subtitle,\n                style = MaterialTheme.typography.bodySmall,\n                color = MaterialTheme.colorScheme.onSurfaceVariant\n            )\n        }\n        Icon(\n            if (expanded) Icons.Outlined.KeyboardArrowUp else Icons.Outlined.KeyboardArrowDown,\n            contentDescription = if (expanded) "Свернуть" else "Развернуть",\n            tint = MaterialTheme.colorScheme.primary,\n            modifier = Modifier.size(24.dp)\n        )\n    }\n}\n''')

          p = Path("app/src/main/java/com/ayuemin/ymnik/ui/ChatMemorySettings.kt")
          text = p.read_text()
          old_header = '''    ElevatedCard(Modifier.fillMaxWidth()) {\n        Column(Modifier.fillMaxWidth().padding(14.dp), verticalArrangement = Arrangement.spacedBy(9.dp)) {\n            Row(verticalAlignment = Alignment.CenterVertically) {\n                Icon(\n                    Icons.Outlined.History,\n                    contentDescription = null,\n                    tint = MaterialTheme.colorScheme.primary,\n                    modifier = Modifier.size(22.dp)\n                )\n                Spacer(Modifier.width(9.dp))\n                Column(Modifier.weight(1f)) {\n                    Text(\n                        "Память и контекст",\n                        fontWeight = FontWeight.SemiBold,\n                        color = MaterialTheme.colorScheme.primary\n                    )\n                    Text(\n                        "Гибридная память длинных чатов · ${formatMemoryBytes(vm.totalChatMemoryBytes())}",\n                        style = MaterialTheme.typography.bodySmall,\n                        color = MaterialTheme.colorScheme.onSurfaceVariant\n                    )\n                }\n                IconButton(onClick = { expanded = !expanded }) {\n                    Icon(\n                        if (expanded) Icons.Outlined.KeyboardArrowUp else Icons.Outlined.KeyboardArrowDown,\n                        contentDescription = null,\n                        tint = MaterialTheme.colorScheme.primary\n                    )\n                }\n            }\n            if (!expanded) return@Column\n\n'''
          new_header = '''    ElevatedCard(Modifier.fillMaxWidth()) {\n        ExpandableSettingsHeader(\n            icon = Icons.Outlined.History,\n            title = "Память и контекст",\n            subtitle = "Гибридная память длинных чатов · ${formatMemoryBytes(vm.totalChatMemoryBytes())}",\n            expanded = expanded,\n            onToggle = { expanded = !expanded }\n        )\n        if (!expanded) return@ElevatedCard\n        Column(\n            Modifier.fillMaxWidth().padding(start = 14.dp, end = 14.dp, bottom = 14.dp),\n            verticalArrangement = Arrangement.spacedBy(9.dp)\n        ) {\n\n'''
          if old_header not in text:
              raise SystemExit("global memory header anchor missing")
          text = text.replace(old_header, new_header, 1)

          pattern = re.compile(r'''@Composable\nprivate fun MemorySettingsExpander\(\n    title: String,\n    subtitle: String,\n    expanded: Boolean,\n    onToggle: \(\) -> Unit\n\) \{.*?\n\}\n\nprivate fun adaptiveChunkTarget''', re.S)
          replacement = '''@Composable\nprivate fun MemorySettingsExpander(\n    title: String,\n    subtitle: String,\n    expanded: Boolean,\n    onToggle: () -> Unit\n) {\n    ElevatedCard(Modifier.fillMaxWidth()) {\n        ExpandableSettingsHeader(\n            icon = Icons.Outlined.History,\n            title = title,\n            subtitle = subtitle,\n            expanded = expanded,\n            onToggle = onToggle\n        )\n    }\n}\n\nprivate fun adaptiveChunkTarget'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f"MemorySettingsExpander replacement count={count}")
          p.write_text(text)

          # Help: explain background work/recovery in user terms.
          p = Path("app/src/main/java/com/ayuemin/ymnik/help/UmnikUsageGuide.kt")
          text = p.read_text()
          marker = '''        Topic(\n            "Файлы, PDF и фотографии",'''
          topic = '''        Topic(\n            "Работа в фоне и восстановление ответа",\n            """\n# Работа в фоне и восстановление ответа\n\n**Что это:** обычный запрос модели не должен останавливаться только потому, что вы переключились в другое приложение или погасили экран.\n\nВо время активного запроса Umnik использует системную фоновую службу Android и показывает постоянное уведомление. В чате и уведомлении отображается текущий этап: запрос отправлен, модель формирует ответ или Umnik восстанавливает соединение.\n\nЕсли мобильное соединение HTTP/2 оборвалось уже после того, как OpenRouter принял запрос, Umnik не отправляет платный запрос вслепую второй раз. Когда OpenRouter успел завершить исходную генерацию и она доступна через кратковременный response cache, приложение проверяет её Generation ID и забирает тот же готовый ответ.\n\n**Пример:** отправьте длинную задачу, перейдите в браузер и вернитесь через несколько минут. Работа должна продолжаться, а состояние запроса останется видно.\n\nЕсли Android полностью уничтожил процесс приложения или OpenRouter не сохранил завершённую генерацию, Umnik сообщит, что запрос прерван, вместо скрытой повторной отправки и возможного двойного списания.\n            """.trimIndent()\n        ),\n'''
          if marker not in text:
              raise SystemExit("usage guide marker missing")
          text = text.replace(marker, topic + marker, 1)
          p.write_text(text)
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app
          git commit -m "Improve background request recovery and settings UX"
          git push origin HEAD:fix/background-request-v1.16.2

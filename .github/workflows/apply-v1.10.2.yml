name: Apply v1.10.2

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/apply-v1.10.2.yml"

permissions:
  contents: write
  actions: write

jobs:
  apply:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Apply source migration
        run: python3 tools/patch_v1_10_2.py

      - name: Verify intended changes
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionName = "1.10.2"' app/build.gradle.kts
          grep -q 'openRouterSpeechModel' app/src/main/java/com/ayuemin/ymnik/model/Models.kt
          grep -q 'OpenRouterSpeechAction' app/src/main/java/com/ayuemin/ymnik/ui/YmnikApp.kt
          grep -q 'SidebarSectionTitle("Избранные")' app/src/main/java/com/ayuemin/ymnik/ui/NavigationSidebar.kt
          grep -q 'clearFinishedBatchHistory' app/src/main/java/com/ayuemin/ymnik/ui/OpenRouterHubController.kt
          grep -q 'Файлы к задаче' app/src/main/java/com/ayuemin/ymnik/ui/OpenRouterHub.kt

      - name: Unit tests and debug APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Commit verified source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/ayuemin/ymnik/AsyncJobEvents.kt \
                  app/src/main/java/com/ayuemin/ymnik/ChatViewModel.kt \
                  app/src/main/java/com/ayuemin/ymnik/model/Models.kt \
                  app/src/main/java/com/ayuemin/ymnik/ui/YmnikApp.kt \
                  app/src/main/java/com/ayuemin/ymnik/ui/NavigationSidebar.kt \
                  app/src/main/java/com/ayuemin/ymnik/ui/OpenRouterHub.kt \
                  app/src/main/java/com/ayuemin/ymnik/ui/OpenRouterHubController.kt \
                  app/build.gradle.kts CHANGELOG.md
          git commit -m "feat: polish Batch chats and OpenRouter speech in v1.10.2"
          git push origin HEAD:main

      - name: Tag tested release
        shell: bash
        run: |
          set -euo pipefail
          git tag -a v1.10.2 -m "Umnik v1.10.2"
          git push origin v1.10.2

      - name: Dispatch signed release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run android-release.yml --repo Ayuemin/Umnik -f tag=v1.10.2

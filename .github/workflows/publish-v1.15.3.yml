name: Publish v1.15.3

on:
  push:
    branches: [ "main" ]
    paths: [ ".github/workflows/publish-v1.15.3.yml" ]

permissions:
  contents: write
  actions: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Create v1.15.3 tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref='refs/tags/v1.15.3' \
            -f sha='aa5fc908b9bf9e68f5c05678c94e47f2ec1ab2d2'

      - name: Dispatch Android Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/android-release.yml/dispatches" \
            -f ref='main' \
            -f 'inputs[tag]=v1.15.3'

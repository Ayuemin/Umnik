name: Agent Mode UI Patch

on:
  push:

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, '[apply-agent-mode]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: work/local-shell-mvp
          fetch-depth: 0

      - name: Apply patch
        run: python .github/scripts/agent_mode_ui_patch.py

      - name: Validate diff
        run: |
          git diff --check
          git diff --stat
          grep -R "agentEnabled" app/src/main/java/com/ayuemin/ymnik/model/ChatRuntimeProfile.kt app/src/main/java/com/ayuemin/ymnik/ChatViewModel.kt app/src/main/java/com/ayuemin/ymnik/ui/YmnikApp.kt
          grep -R "supportedReasoningEfforts" app/src/main/java/com/ayuemin/ymnik/ui/YmnikApp.kt
          grep -R "versionName = \"1.20.0-beta.27\"" app/build.gradle.kts

      - name: Unit tests and compile
        run: ./gradlew testDebugUnitTest

      - name: Commit product changes and remove patch helper
        run: |
          rm -f .github/scripts/agent_mode_ui_patch.py .github/workflows/agent-mode-ui-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "[signed-test] Build beta.27 Agent mode and adaptive reasoning UI"
          git push origin HEAD:work/local-shell-mvp

name: Apply v1.10.3

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/apply-v1.10.3.yml"

permissions:
  contents: write
  actions: write

jobs:
  apply:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Harden migration anchor
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("tools/patch_v1_10_3.py")
          s = p.read_text(encoding="utf-8")

          # OpenRouterSpeechAction is followed by WorkingStopIcon. The original
          # one-time patch used GeneratedAudioPlayer as the end marker, which
          # was far too broad and swallowed the intervening chat UI.
          broad = '"@Composable\\nprivate fun GeneratedAudioPlayer("'
          if s.count(broad) != 1:
              raise SystemExit(f"speech end marker: expected 1, got {s.count(broad)}")
          s = s.replace(broad, '"@Composable\\nprivate fun WorkingStopIcon("', 1)

          old = '''    if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, got {count}")
              return text.replace(old, new, 1)
          '''
          new = '''    if count != 1:
                  if label == "generated file card call":
                      lines = text.splitlines(keepends=True)
                      for index, line in enumerate(lines):
                          if "GeneratedFileCard(" in line and "onSaveGenerated" in line:
                              indent = line[:len(line) - len(line.lstrip())]
                              lines[index] = indent + "GeneratedFileCard(file)\\n"
                              return "".join(lines)
                  raise SystemExit(f"{label}: expected exactly one match, got {count}")
              return text.replace(old, new, 1)
          '''
          if old not in s:
              raise SystemExit("replace_once helper anchor not found")
          p.write_text(s.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Apply source migration
        run: python3 tools/patch_v1_10_3.py

      - name: Verify intended changes
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionName = "1.10.3"' app/build.gradle.kts
          grep -q 'versionCode = 103' app/build.gradle.kts
          grep -q 'clearFinishedVideoHistory' app/src/main/java/com/ayuemin/ymnik/ui/OpenRouterHubController.kt
          grep -q 'openrouter_speech_playback' app/src/main/java/com/ayuemin/ymnik/ui/OpenRouterSpeechPlayer.kt
          grep -q 'Никогда не создавай файл автоматически только из-за длины ответа' app/src/main/java/com/ayuemin/ymnik/network/OpenRouterClient.kt
          grep -q 'Поиск в сети' app/src/main/java/com/ayuemin/ymnik/ui/YmnikApp.kt
          test "$(grep -c 'title = "Поиск в сети"' app/src/main/java/com/ayuemin/ymnik/ui/YmnikApp.kt || true)" -eq 0

      - name: Unit tests and debug APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Commit verified source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app CHANGELOG.md
          git diff --cached --quiet && { echo "No source changes to commit"; exit 1; }
          git commit -m "feat: polish files video history and transient speech in v1.10.3"
          git push origin HEAD:main
          echo "RELEASE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Tag tested release
        shell: bash
        run: |
          set -euo pipefail
          git tag -a v1.10.3 -m "Umnik v1.10.3" "$RELEASE_COMMIT"
          git push origin v1.10.3

      - name: Dispatch signed release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run android-release.yml -f tag=v1.10.3

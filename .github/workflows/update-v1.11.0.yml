name: Update Umnik v1.11.0

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-v1.11.0.yml"

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fix updater replacement handling
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply_v1_11_0.py')
          text = path.read_text()
          old = "out, count = re.subn(pattern, repl, text, count=1, flags=re.S)"
          new = "out, count = re.subn(pattern, lambda _match: repl, text, count=1, flags=re.S)"
          if old not in text:
              raise SystemExit('sub_once implementation not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Apply v1.11.0 source update
        run: python3 scripts/apply_v1_11_0.py

      - name: Remove temporary updater files
        run: |
          rm -f scripts/apply_v1_11_0.py
          rm -f .github/workflows/update-v1.11.0.yml
          rm -f .github/workflows/update-v1.10.9.yml
          rm -f scripts/apply_v1_10_9.py

      - name: Check patch
        run: |
          git diff --check
          git status --short

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Compile and test
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Commit tested update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release Umnik v1.11.0 project workflows"
          git push origin HEAD:main

      - name: Create release tag
        run: |
          git tag -a v1.11.0 -m "Umnik v1.11.0"
          git push origin v1.11.0

      - name: Dispatch signed release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run android-release.yml --repo Ayuemin/Umnik --ref main -f tag=v1.11.0

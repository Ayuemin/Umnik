name: Implement connections v1.2 beta once

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/implement-connections-v1.2-beta-once.yml"

permissions:
  contents: write
  actions: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v1.2 connection changes
        run: python3 .github/scripts/implement-connections-v1.2.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Ayuemin"
          git config user.email "105455063+Ayuemin@users.noreply.github.com"
          git add \
            app/src/main/java/com/ayuemin/ymnik/model/Models.kt \
            app/src/main/java/com/ayuemin/ymnik/ChatViewModel.kt \
            app/src/main/java/com/ayuemin/ymnik/ui/YmnikApp.kt \
            app/build.gradle.kts
          git commit -m "Add multi-connection quick model routing"
          git push origin HEAD:main

      - name: Tag beta release
        shell: bash
        run: |
          set -euo pipefail
          git tag v1.2.0-beta.1
          git push origin v1.2.0-beta.1

      - name: Dispatch signed prerelease build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          sleep 3
          gh workflow run android-release.yml --repo "$GITHUB_REPOSITORY" --ref main -f tag=v1.2.0-beta.1

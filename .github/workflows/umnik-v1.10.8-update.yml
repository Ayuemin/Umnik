name: Prepare Umnik v1.10.8

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/umnik-v1.10.8-update.yml"
      - ".github/scripts/update_v1_10_8.py"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Apply v1.10.8 changes
        run: python3 .github/scripts/update_v1_10_8.py

      - name: Check diff
        run: |
          git diff --check
          git diff --stat

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Compile and test
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Remove one-shot updater
        run: rm -f .github/workflows/umnik-v1.10.8-update.yml .github/scripts/update_v1_10_8.py

      - name: Commit tested update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release Umnik 1.10.8: chat project tools"
          git push origin HEAD:main

      - name: Create release tag
        run: |
          git tag -a v1.10.8 -m "Umnik v1.10.8"
          git push origin v1.10.8

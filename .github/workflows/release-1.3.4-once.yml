name: Release Umnik 1.3.4 once

on:
  push:
    branches:
      - main
    paths:
      - .github/trigger-1.3.4
      - scripts/release_1_3_4.py

permissions:
  contents: write

jobs:
  fix-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply fixes
        run: python3 scripts/release_1_3_4.py

      - name: Remove one-shot files
        run: rm -f .github/trigger-1.3.4 .github/workflows/release-1.3.4-once.yml scripts/release_1_3_4.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Commit and tag
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix provider switching and NVIDIA image models"
          git tag v1.3.4
          git push origin HEAD:main
          git push origin v1.3.4

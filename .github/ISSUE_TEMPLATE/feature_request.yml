name: Feature request
description: Предложить улучшение Umnik
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Какую проблему решает предложение
      description: Лучше начать с пользовательской ситуации, а не с конкретной кнопки.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Предлагаемое поведение
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Альтернативы
      description: Необязательно. Что уже пробовали или почему текущего поведения недостаточно.

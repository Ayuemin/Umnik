name: Bug report
description: Сообщить об ошибке Umnik
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Спасибо за сообщение. Не прикладывайте API-ключи, токены и другие секреты.
  - type: input
    id: version
    attributes:
      label: Версия Umnik
      placeholder: "Например: 0.6.7"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Устройство и Android
      placeholder: "Например: TECNO, Android 15"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Что произошло
      description: Опишите фактическое поведение.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Как повторить
      description: Последовательность действий, после которой возникает ошибка.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Что ожидалось
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Дополнительная информация
      description: Скриншоты, модель OpenRouter, текст ошибки. Удалите любые секреты перед публикацией.
